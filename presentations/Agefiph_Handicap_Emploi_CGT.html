<style>
:root{
  --red:#E2001A; --red-d:#A60012; --yellow:#FFD200; --ink:#141414;
  --paper:#FBFAF6; --card:#F1EFE8; --line:#E4E0D4; --muted:#6C6A63; --white:#fff;
  --disp:'Anton', 'Arial Narrow', Impact, sans-serif;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0c;color:var(--ink);font-family:var(--body)}
body{-webkit-font-smoothing:antialiased}
#deck{position:fixed;top:0;right:0;bottom:0;left:0}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;
  padding:5.5vh 7vw;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(14px) scale(.995);transition:opacity .45s ease, transform .45s ease;
  background:var(--paper);
  background-image:radial-gradient(rgba(20,20,20,.035) 1px, transparent 1px);background-size:22px 22px;}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:2}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--red)}
.slide.dark::before{background:var(--yellow)}
.kicker{font-family:var(--ui);font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:clamp(11px,1.25vw,18px);color:var(--red);margin-bottom:1.4vh;display:flex;align-items:center;gap:.8em}
.kicker .dot{width:.6em;height:.6em;background:var(--yellow);display:inline-block;transform:rotate(45deg)}
h1,h2{font-family:var(--disp);font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.title{font-size:clamp(34px,6.2vw,104px);color:var(--ink)}
.title .em{color:var(--red)}
.lede{font-size:clamp(16px,2.1vw,30px);max-width:60ch;margin-top:2.4vh;color:#2b2b2b}
.foot{font-family:var(--ui);font-weight:700;color:var(--red);margin-top:auto;font-size:clamp(14px,1.6vw,22px);
  text-transform:uppercase;letter-spacing:.12em}
.slide.active .reveal{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.slide.active .reveal:nth-child(2){animation-delay:.06s}
.slide.active .reveal:nth-child(3){animation-delay:.12s}
.slide.active .reveal:nth-child(4){animation-delay:.18s}
.slide.active .reveal:nth-child(5){animation-delay:.24s}
.slide.active .reveal:nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.s-title .title{font-size:clamp(40px,7.4vw,128px)}
.s-title .accent{height:14px;width:min(42vw,520px);background:var(--yellow);margin:3vh 0}
.slide.s-divider{background:var(--ink);color:var(--white);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.s-divider .kicker{color:var(--yellow)}
.s-divider .title{color:var(--yellow);font-size:clamp(40px,8vw,132px)}
.s-divider .lede{color:#e8e8e8}
.s-divider .barline{height:10px;width:min(36vw,440px);background:var(--red);margin-top:3vh}
.bullets{list-style:none;margin-top:2vh;display:flex;flex-direction:column;gap:1.5vh;max-width:64ch}
.bullets li{display:flex;gap:.9em;align-items:flex-start;font-size:clamp(16px,2.05vw,30px);line-height:1.3}
.bullets li::before{content:"";flex:0 0 auto;width:.62em;height:.62em;margin-top:.5em;background:var(--red);transform:rotate(45deg)}
.note-strip{margin-top:2.6vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1.4vh 1.6vw;font-size:clamp(14px,1.7vw,24px);max-width:70ch;border-left:8px solid var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;margin-top:3vh}
.stat{background:var(--white);border:1px solid var(--line);border-top:7px solid var(--red);
  padding:3vh 1.4vw;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.stat .num{font-family:var(--disp);color:var(--red);font-size:clamp(34px,5.6vw,92px);line-height:.9}
.stat .lab{font-family:var(--body);color:#2b2b2b;font-size:clamp(12px,1.3vw,19px);margin-top:1.4vh;line-height:1.25}
.source{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:2.4vh}
.steps{display:grid;gap:1.4vw;margin-top:3vh}
.steps.n3{grid-template-columns:repeat(3,1fr)} .steps.n4{grid-template-columns:repeat(4,1fr)}
.step{background:var(--card);border:1px solid var(--line);padding:2.6vh 1.3vw;position:relative;
  transition:transform .25s ease, box-shadow .25s ease}
.step:hover{transform:translateY(-6px);box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.step .big{font-family:var(--disp);color:var(--red);font-size:clamp(26px,3.6vw,60px);line-height:.9}
.step .nm{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(13px,1.4vw,21px);margin-top:1.2vh}
.step .ds{font-size:clamp(12px,1.25vw,19px);color:#333;margin-top:.7vh;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.8vw;margin-top:3vh}
.tc{padding:3.2vh 1.8vw;border:1px solid var(--line);background:var(--card)}
.tc.red{background:var(--red);color:#fff;border-color:var(--red)}
.tc.black{background:var(--ink);color:#fff;border-color:var(--ink)}
.tc h3{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(17px,2.1vw,32px)}
.tc.red h3,.tc.black h3{color:var(--yellow)}
.tc.plain h3{color:var(--red)}
.tc p{font-size:clamp(14px,1.6vw,24px);margin-top:1.6vh;line-height:1.35}
.callout{margin-top:3vh;padding:5vh 3vw;display:flex;flex-direction:column;gap:1.6vh;max-width:80ch}
.callout.black{background:var(--ink)} .callout.red{background:var(--red)}
.callout .big{font-family:var(--disp);text-transform:uppercase;line-height:1;
  font-size:clamp(24px,3.6vw,58px)}
.callout.black .big{color:var(--yellow)} .callout.red .big{color:#fff}
.callout .sub{font-size:clamp(15px,1.8vw,26px)} .callout.black .sub{color:#fff} .callout.red .sub{color:#fff}
.defbox{margin-top:2.6vh;background:var(--card);border-left:12px solid var(--red);padding:3.4vh 2.4vw;max-width:82ch}
.defbox .term{font-family:var(--ui);font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(16px,1.9vw,28px)}
.defbox .txt{font-size:clamp(17px,2.1vw,30px);margin-top:1.4vh;line-height:1.3}
.defextra{margin-top:2.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1.4vh 1.6vw;border-left:8px solid var(--yellow);font-size:clamp(14px,1.6vw,23px);max-width:82ch}
.quiz-q{font-size:clamp(18px,2.4vw,36px);font-weight:600;margin-top:2vh;max-width:60ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3vh;max-width:90ch}
.opt{font-family:var(--ui);text-align:left;background:var(--white);border:2px solid var(--line);
  padding:1.8vh 1.4vw;font-size:clamp(14px,1.6vw,23px);cursor:pointer;transition:.2s;display:flex;gap:.7em;align-items:center}
.opt:hover{border-color:var(--ink);transform:translateY(-3px)}
.opt .k{font-weight:800;color:var(--red)}
.opt.good{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.opt.good .k{color:var(--ink)}
.opt.bad{opacity:.45;border-style:dashed}
.quiz-a{margin-top:2.4vh;font-family:var(--ui);font-weight:700;color:var(--red);
  font-size:clamp(14px,1.7vw,24px);opacity:0;transition:.3s}
.quiz-a.show{opacity:1}
.case-sc{background:var(--card);border-left:10px solid var(--yellow);padding:2.6vh 2vw;
  font-size:clamp(16px,1.9vw,27px);margin-top:2vh;max-width:80ch;line-height:1.35}
.case-q{margin-top:2.2vh}
.timer{display:flex;align-items:center;gap:1.2vw;margin-top:auto;padding-top:2.4vh}
.tmr-display{font-family:var(--disp);font-size:clamp(34px,5vw,80px);color:var(--ink);line-height:.9;min-width:3.4ch}
.tmr-display.run{color:var(--red)} .tmr-display.done{color:var(--red);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.25}}
.tbtn{font-family:var(--ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:2px solid var(--ink);background:var(--ink);color:#fff;padding:1.1vh 1.4vw;cursor:pointer;font-size:clamp(12px,1.2vw,17px)}
.tbtn.ghost{background:transparent;color:var(--ink)}
.tbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.slide.s-closing{background:var(--ink);color:#fff;justify-content:center}
.s-closing .title{color:var(--yellow);font-size:clamp(54px,11vw,180px)}
.s-closing .sub{font-size:clamp(16px,2vw,30px);color:#eee;margin-top:2vh}
.s-closing .contacts{font-family:var(--ui);color:#bbb;margin-top:3vh;font-size:clamp(13px,1.4vw,20px);line-height:1.6}
.s-closing::before{background:var(--red)}
.svgwrap{margin-top:2.2vh;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
.svgwrap svg{width:100%;max-width:1100px;max-height:72vh;height:auto;display:block}
.svgwrap text{font-family:var(--ui)}
#ink{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#inktools{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:58;display:none;gap:8px;
  background:rgba(18,18,18,.94);padding:9px;border-radius:14px;box-shadow:0 14px 40px -16px rgba(0,0,0,.6)}
#inktools.on{display:flex}
.it{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:#2a2a2a;color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:18px;font-family:var(--ui);font-weight:800;transition:.15s}
.it:hover{background:#3a3a3a}
.it.act{border-color:#fff;background:#000}
.it.pen{color:var(--red)} .it.hl{color:var(--yellow)}
#bar{position:fixed;top:0;left:0;height:6px;background:rgba(0,0,0,.12);width:100%;z-index:50}
#bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s ease}
.hud{position:fixed;z-index:50;font-family:var(--ui);font-weight:700}
#count{left:24px;bottom:18px;color:var(--muted);font-size:14px;letter-spacing:.1em}
#count b{color:var(--red)}
#ctrl{right:18px;bottom:14px;display:flex;gap:8px}
.cb{width:42px;height:42px;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
  border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:.2s;font-size:18px}
.cb:hover{background:var(--red);color:#fff;border-color:var(--red)}
#brand{position:fixed;right:26px;top:16px;z-index:50;font-family:var(--disp);font-size:24px;color:var(--red);letter-spacing:.02em;
  background:var(--yellow);padding:2px 10px 0;line-height:1.25}
#notes{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(15,15,15,.96);color:#f4f4f4;
  padding:22px 28px 26px;transform:translateY(102%);transition:.35s;max-height:46vh;overflow:auto;
  border-top:5px solid var(--yellow);font-family:var(--ui)}
#notes.show{transform:none}
#notes h4{color:var(--yellow);font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;font-weight:800}
#notes .nbody{font-family:var(--body);font-size:clamp(15px,1.5vw,21px);line-height:1.5;max-width:120ch}
#notes .nbody b{color:#fff} #notes .nbody .cgt{color:var(--yellow);font-weight:700}
#notes .nbody .ref{color:#9fbfff;font-style:italic;font-size:.92em}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(12,12,12,.97);overflow:auto;padding:70px 5vw 60px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
#ov.show{display:grid}
.ovc{background:#1b1b1b;border:1px solid #2c2c2c;border-left:5px solid var(--red);padding:16px 16px 18px;cursor:pointer;
  color:#eaeaea;transition:.18s;min-height:120px;display:flex;flex-direction:column;gap:6px}
.ovc:hover{background:#262626;transform:translateY(-4px);border-left-color:var(--yellow)}
.ovc.div{border-left-color:var(--yellow);background:#000}
.ovc .n{font-family:var(--ui);font-weight:800;color:var(--red);font-size:12px;letter-spacing:.1em}
.ovc .k{font-family:var(--ui);font-weight:700;color:var(--yellow);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ovc .t{font-family:var(--disp);font-size:19px;line-height:1.02;text-transform:uppercase;color:#fff}
#ovhead{position:fixed;top:18px;left:5vw;z-index:71;color:#fff;font-family:var(--ui);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;font-size:13px;display:none}
#ov.show ~ #ovhead{display:block}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(10,10,10,.9);display:none;place-items:center}
#help.show{display:grid}
.helpcard{background:#fff;max-width:520px;width:90%;padding:34px 38px;border-top:10px solid var(--red)}
.helpcard h3{font-family:var(--disp);font-size:30px;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.helpcard dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-family:var(--ui);font-size:15px}
.helpcard dt{font-weight:800;color:var(--ink)}
.helpcard kbd{background:var(--ink);color:#fff;padding:2px 9px;border-radius:5px;font-family:var(--ui);font-size:13px}
.wordmark{font-family:var(--disp);background:var(--yellow);color:var(--red);padding:2px 10px 0;line-height:1.25;display:inline-block}
.logo-img{display:block;height:100%}
#brand.haslogo{background:transparent;padding:0;height:46px}
.lockup{display:flex;align-items:center;gap:16px;margin-bottom:2.4vh}
.lockup .wordmark{font-size:clamp(26px,3vw,40px)}
.lockup .logo-img{height:clamp(46px,6vw,84px)}
.s-title .lockup .logo-img{height:clamp(110px,15vh,190px)}
.s-closing .lockup .logo-img{height:clamp(90px,12vh,150px)}
#brand.haslogo{height:clamp(74px,9.5vh,112px)}
@media print{
  @page{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #bar,#ctrl,#brand,#count,#notes,#ov,#ovhead,#help{display:none!important}
  #deck{position:static!important}
  .slide{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
    opacity:1!important;visibility:visible!important;transform:none!important;height:100vh!important;
    page-break-after:always;break-after:page}
  .reveal{animation:none!important;opacity:1!important;transform:none!important}
  .quiz-a{opacity:1!important}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr}
  .steps.n3,.steps.n4{grid-template-columns:1fr 1fr} .opts{grid-template-columns:1fr}
  .slide{padding:8vh 8vw}
}
</style>
</head>

<script>
const CONFIG = {logo:"/assets/logo-cgt-occitanie.jpg", title:"Handicap & Emploi"};

const SLIDES = [
// 1 - Titre
{type:"title", kicker:"Formation syndicale CGT Occitanie", title:["AGEFIPH","Handicap","& Emploi"], lede:"AGEFIPH · OETH · RQTH · Maintien dans l'emploi", foot:"Formation syndicale CGT Occitanie — Handicap & Emploi"},

function logoMark(){
  return `<img src="/assets/logo-cgt-occitanie.jpg" class="logo-img" alt="CGT Occitanie">`;
}

function buildSlide(s,i){
  const div=document.createElement('div');
  div.className='slide';
  if(s.type==='title') div.classList.add('s-title');
  if(s.type==='divider') div.classList.add('s-divider');
  if(s.type==='closing') div.classList.add('s-closing');
  if(s.dark) div.classList.add('dark');

  if(s.type==='title'){
    const titleArr=Array.isArray(s.title)?s.title:[s.title];
    div.innerHTML=`
      <div class="lockup reveal">${logoMark()}</div>
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h1 class="title reveal">${titleArr.join('<br>')}</h1>
      <div class="accent reveal"></div>
      <p class="lede reveal">${s.lede||''}</p>
      <div class="foot reveal">${s.foot||''}</div>`;
  } else if(s.type==='divider'){
    const titleArr=Array.isArray(s.title)?s.title:[s.title];
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal">${titleArr.join('<br>')}</h2>
      ${s.lede?`<p class="lede reveal">${s.lede}</p>`:''}
      <div class="barline reveal"></div>`;
  } else if(s.type==='closing'){
    div.innerHTML=`
      <div class="lockup reveal">${logoMark()}</div>
      <h1 class="title reveal">${(s.title||'').replace(/\n/g,'<br>')}</h1>
      <p class="sub reveal">${s.sub||''}</p>
      <div class="contacts reveal">${s.contacts||''}</div>`;
  } else if(s.type==='content'){
    const bis=s.bullets||[];
    const bhtml=bis.map(b=>`<li>${b}</li>`).join('');
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <ul class="bullets reveal">${bhtml}</ul>
      ${s.strip?`<div class="note-strip reveal">${s.strip}</div>`:''}`;
  } else if(s.type==='def'){
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="defbox reveal">
        <div class="term">${s.term||''}</div>
        <div class="txt">${s.text||''}</div>
      </div>
      ${s.extra?`<div class="defextra reveal">${s.extra}</div>`:''}`;
  } else if(s.type==='stats'){
    const sthtml=(s.items||[]).map(it=>`
      <div class="stat">
        <div class="num">${it.num||''}</div>
        <div class="lab">${it.lab||''}</div>
      </div>`).join('');
    const cols=s.items&&s.items.length<=2?s.items.length:4;
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="stats reveal" style="grid-template-columns:repeat(${cols},1fr)">${sthtml}</div>`;
  } else if(s.type==='steps'){
    const sthtml=(s.items||[]).map(it=>`
      <div class="step">
        <div class="big">${it.big||''}</div>
        <div class="nm">${it.nm||''}</div>
        <div class="ds">${it.ds||''}</div>
      </div>`).join('');
    const n=s.items?s.items.length:3;
    const cls=n<=3?'n3':'n4';
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="steps ${cls} reveal">${sthtml}</div>`;
  } else if(s.type==='two'){
    const styleA=s.a&&s.a.style?s.a.style:'plain';
    const styleB=s.b&&s.b.style?s.b.style:'black';
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="two reveal">
        <div class="tc ${styleA}"><h3>${s.a&&s.a.h||''}</h3><p>${s.a&&s.a.t||''}</p></div>
        <div class="tc ${styleB}"><h3>${s.b&&s.b.h||''}</h3><p>${s.b&&s.b.t||''}</p></div>
      </div>`;
  } else if(s.type==='table'){
    const hhtml=(s.headers||[]).map(h=>`<th style="background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:800;font-size:clamp(13px,1.4vw,20px);padding:1.2vh 1vw;text-align:left;letter-spacing:.04em;text-transform:uppercase">${h}</th>`).join('');
    const rhtml=(s.rows||[]).map((row,ri)=>{
      const tds=row.map(cell=>`<td style="padding:1.1vh 1vw;font-size:clamp(13px,1.4vw,19px);border-bottom:1px solid var(--line)">${cell}</td>`).join('');
      return `<tr style="background:${ri%2===0?'var(--white)':'var(--card)'}">${tds}</tr>`;
    }).join('');
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="reveal" style="margin-top:2.5vh;overflow:auto;max-height:65vh">
        <table style="width:100%;border-collapse:collapse;border:1px solid var(--line)">
          <thead><tr>${hhtml}</tr></thead>
          <tbody>${rhtml}</tbody>
        </table>
      </div>`;
  } else if(s.type==='placeholder'){
    const safetitle=(s.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(28px,4.5vw,72px)">${s.title||''}</h2>
      <div class="svgwrap reveal">
        <svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
          <rect width="800" height="300" fill="#F1EFE8" rx="4"/>
          <rect x="0" y="0" width="8" height="300" fill="#E2001A"/>
          <rect x="28" y="130" width="744" height="4" fill="#FFD200" opacity=".6"/>
          <text x="400" y="110" text-anchor="middle" font-size="22" font-family="Arial,sans-serif" font-weight="700" fill="#6C6A63" letter-spacing="2">${safetitle}</text>
          <text x="400" y="180" text-anchor="middle" font-size="40" font-family="Arial,sans-serif" fill="#E4E0D4">&#9635;</text>
          <text x="400" y="240" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#6C6A63">[ Slide visuelle / Support graphique ]</text>
        </svg>
      </div>`;
  } else if(s.type==='quiz'){
    const optshtml=(s.opts||[]).map((o,oi)=>`<button class="opt" data-idx="${oi}"><span class="k">${o.k}</span>${o.t}</button>`).join('');
    const timerSec=s.timer||0;
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h2 class="title reveal" style="font-size:clamp(22px,3.5vw,58px)">${s.title||''}</h2>
      <p class="quiz-q reveal">${s.q||''}</p>
      <div class="opts reveal">${optshtml}</div>
      <div class="quiz-a reveal">${s.explain||''}</div>
      ${timerSec>0?`<div class="timer reveal"><div class="tmr-display" id="tmr${i}">${Math.floor(timerSec/60)}:${String(timerSec%60).padStart(2,'0')}</div><button class="tbtn" id="ts${i}">Démarrer</button><button class="tbtn ghost" id="tr${i}">Reset</button></div>`:''}`;
    setTimeout(()=>{
      const ans=s.ans;
      div.querySelectorAll('.opt').forEach((btn,oi)=>{
        btn.addEventListener('click',()=>{
          if(ans>=0){
            div.querySelectorAll('.opt').forEach((b,bi)=>{b.classList.toggle('good',bi===ans);b.classList.toggle('bad',bi!==ans);});
          }
          div.querySelector('.quiz-a').classList.add('show');
        });
      });
      if(timerSec>0){
        const disp=div.querySelector(`#tmr${i}`);
        const startBtn=div.querySelector(`#ts${i}`);
        const resetBtn=div.querySelector(`#tr${i}`);
        let sec=timerSec, running=false, intv=null;
        const fmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
        startBtn.addEventListener('click',()=>{
          if(!running){running=true;startBtn.textContent='Pause';disp.classList.add('run');
            intv=setInterval(()=>{if(sec>0){sec--;disp.textContent=fmt(sec);}else{clearInterval(intv);disp.classList.remove('run');disp.classList.add('done');startBtn.textContent='Terminé';}},1000);
          } else {clearInterval(intv);running=false;startBtn.textContent='Reprendre';disp.classList.remove('run');}
        });
        resetBtn.addEventListener('click',()=>{clearInterval(intv);running=false;sec=timerSec;disp.textContent=fmt(sec);disp.classList.remove('run','done');startBtn.textContent='Démarrer';});
      }
    },100);
  }
  return div;
}

SLIDES.forEach((s,i)=>deck.appendChild(buildSlide(s,i)));
const allSlides=deck.querySelectorAll('.slide');

function goTo(n){
  allSlides[cur].classList.remove('active');
  cur=Math.max(0,Math.min(n,SLIDES.length-1));
  allSlides[cur].classList.add('active');
  countEl.innerHTML=`<b>${String(cur+1).padStart(2,'0')}</b> / ${SLIDES.length}`;
  barFill.style.width=`${((cur+1)/SLIDES.length)*100}%`;
  notesBody.innerHTML=SLIDES[cur].notes||'<em>Aucune note pour cette diapositive.</em>';
  try{localStorage.setItem('cgt-agefiph-slide',cur);}catch(e){}
}

try{const saved=localStorage.getItem('cgt-agefiph-slide');if(saved!==null)goTo(+saved);else goTo(0);}catch(e){goTo(0);}

function buildOv(){
  ovEl.innerHTML='';
  SLIDES.forEach((s,i)=>{
    const c=document.createElement('div');
    c.className=`ovc ${s.type==='divider'?'div':''}`;
    c.innerHTML=`<div class="n">${String(i+1).padStart(2,'0')}</div>
      ${s.kicker?`<div class="k">${s.kicker}</div>`:''}
      <div class="t">${Array.isArray(s.title)?s.title[0]:s.title||s.type}</div>`;
    c.addEventListener('click',()=>{ovEl.classList.remove('show');goTo(i);});
    ovEl.appendChild(c);
  });
}
buildOv();

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();goTo(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(cur-1);}
  else if(e.key==='Home'){goTo(0);}
  else if(e.key==='End'){goTo(SLIDES.length-1);}
  else if(e.key.toLowerCase()==='o'){ovEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='n'){notesEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key.toLowerCase()==='a'){toggleInk();}
  else if(e.key.toLowerCase()==='p'){openPresenter();}
  else if(e.key==='Escape'){ovEl.classList.remove('show');notesEl.classList.remove('show');document.getElementById('help').classList.remove('show');if(inkOn)toggleInk();}
  else if(e.key==='?'){document.getElementById('help').classList.toggle('show');}
});
document.getElementById('bPrev').addEventListener('click',()=>goTo(cur-1));
document.getElementById('bNext').addEventListener('click',()=>goTo(cur+1));
document.getElementById('bOv').addEventListener('click',()=>{buildOv();ovEl.classList.toggle('show');});
document.getElementById('bNotes').addEventListener('click',()=>notesEl.classList.toggle('show'));
document.getElementById('bFull').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
document.getElementById('bHelp').addEventListener('click',()=>document.getElementById('help').classList.toggle('show'));

let touchStartX=0;
document.addEventListener('touchstart',e=>touchStartX=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dx)>40){if(dx<0)goTo(cur+1);else goTo(cur-1);}});

function toggleInk(){
  inkOn=!inkOn;
  inkCanvas.classList.toggle('on',inkOn);
  inkTools.classList.toggle('on',inkOn);
  document.getElementById('bInk').classList.toggle('cb-on',inkOn);
}
document.getElementById('bInk').addEventListener('click',toggleInk);
document.getElementById('inkClearBtn').addEventListener('click',()=>ctx.clearRect(0,0,inkCanvas.width,inkCanvas.height));
document.getElementById('inkCloseBtn').addEventListener('click',()=>{if(inkOn)toggleInk();});
document.querySelectorAll('.it[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    inkTool=b.dataset.tool;
    document.querySelectorAll('.it[data-tool]').forEach(x=>x.classList.remove('act'));
    b.classList.add('act');
  });
});
inkCanvas.addEventListener('pointerdown',e=>{if(!inkOn)return;drawing=true;lastX=e.offsetX;lastY=e.offsetY;});
inkCanvas.addEventListener('pointermove',e=>{
  if(!inkOn||!drawing)return;
  ctx.save();
  if(inkTool==='pen'){ctx.strokeStyle='rgba(226,0,26,0.9)';ctx.lineWidth=3;ctx.globalCompositeOperation='source-over';}
  else if(inkTool==='hl'){ctx.strokeStyle='rgba(255,210,0,0.35)';ctx.lineWidth=24;ctx.globalCompositeOperation='source-over';}
  else{ctx.lineWidth=28;ctx.globalCompositeOperation='destination-out';}
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();
  ctx.restore();
  lastX=e.offsetX;lastY=e.offsetY;
});
inkCanvas.addEventListener('pointerup',()=>drawing=false);
allSlides.forEach(s=>s.addEventListener('click',e=>{
  if(inkOn||e.target.classList.contains('opt')||e.target.closest('.tbtn')||e.target.closest('.it'))return;
  const x=e.clientX/window.innerWidth;
  if(x>0.6)goTo(cur+1);else if(x<0.4)goTo(cur-1);
}));

function openPresenter(){
  const pw=window.open('','presenterWindow','width=800,height=600,resizable=yes');
  if(!pw)return;
  pw.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;padding:20px}
  #pt{font-size:32px;font-weight:bold;color:#FFD200;margin-bottom:12px}
  #pc{font-size:16px;color:#aaa;margin-bottom:20px}
  #pnotes{font-size:18px;line-height:1.5;background:#1a1a1a;padding:16px;border-left:4px solid #FFD200}
  #pnext{font-size:13px;color:#888;margin-top:16px}
  #pclock{position:fixed;top:14px;right:20px;font-size:15px;color:#aaa;font-family:monospace}
  </style></head><body>
  <div id="pclock"></div>
  <div id="pt">Diapo 1</div><div id="pc">1 / ${SLIDES.length}</div>
  <div id="pnotes"></div><div id="pnext"></div>
  <script>
  const clk=document.getElementById('pclock');
  setInterval(()=>{const n=new Date();clk.textContent=n.toLocaleTimeString('fr-FR');},1000);
  window.updatePres=function(cur,total,notes,nextTitle){
    document.getElementById('pt').textContent='Diapo '+(cur+1);
    document.getElementById('pc').textContent=(cur+1)+' / '+total;
    document.getElementById('pnotes').innerHTML=notes||'';
    document.getElementById('pnext').textContent=nextTitle?'Suivante : '+nextTitle:'';
  };
  <\/script></body></html>`);
  pw.document.close();
  function syncPres(){
    if(!pw.closed){
      const n=SLIDES[cur].notes||'';
      const nextT=SLIDES[cur+1]?`${Array.isArray(SLIDES[cur+1].title)?SLIDES[cur+1].title[0]:SLIDES[cur+1].title||''}`:null;
      pw.updatePres&&pw.updatePres(cur,SLIDES.length,n,nextT);
    }
  }
  const origGoTo=goTo;
  window.goTo=function(n){origGoTo(n);syncPres();};
  syncPres();
}
document.getElementById('bPres').addEventListener('click',openPresenter);
</script>
