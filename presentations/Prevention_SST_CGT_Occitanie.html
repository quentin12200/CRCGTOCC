<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CGT · Prévention des risques — Diagnostic SST &amp; Mesures de prévention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E2001A; --red-d:#A60012; --yellow:#FFD200; --ink:#141414;
  --paper:#FBFAF6; --card:#F1EFE8; --line:#E4E0D4; --muted:#6C6A63; --white:#fff;
  --disp:'Anton', 'Arial Narrow', Impact, sans-serif;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0c;color:var(--ink);font-family:var(--body)}
body{-webkit-font-smoothing:antialiased}
#deck{position:fixed;top:0;right:0;bottom:0;left:0}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;
  padding:3.5vh 7vw;opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;
  transform:translateY(14px) scale(.995);transition:opacity .45s ease, transform .45s ease;
  background:var(--paper);
  background-image:radial-gradient(rgba(20,20,20,.035) 1px, transparent 1px);background-size:22px 22px;}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:2}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--red)}
.slide.dark::before{background:var(--yellow)}
.kicker{font-family:var(--ui);font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:clamp(11px,1.25vw,18px);color:var(--red);margin-bottom:1.4vh;display:flex;align-items:center;gap:.8em}
.kicker .dot{width:.6em;height:.6em;background:var(--yellow);display:inline-block;transform:rotate(45deg)}
h1,h2{font-family:var(--disp);font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.title{font-size:clamp(34px,6.2vw,104px);color:var(--ink)}
.title .em{color:var(--red)}
.lede{font-size:clamp(15px,1.9vw,26px);max-width:64ch;margin-top:1.6vh;color:#2b2b2b}
.foot{font-family:var(--ui);font-weight:700;color:var(--red);margin-top:auto;font-size:clamp(14px,1.6vw,22px);
  text-transform:uppercase;letter-spacing:.12em}
.slide.active .reveal{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.slide.active .reveal:nth-child(2){animation-delay:.06s}
.slide.active .reveal:nth-child(3){animation-delay:.12s}
.slide.active .reveal:nth-child(4){animation-delay:.18s}
.slide.active .reveal:nth-child(5){animation-delay:.24s}
.slide.active .reveal:nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.s-title .title{font-size:clamp(40px,7.4vw,128px)}
.s-title .accent{height:14px;width:min(42vw,520px);background:var(--yellow);margin:3vh 0}
.slide.s-divider{background:var(--ink);color:var(--white);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.s-divider .kicker{color:var(--yellow)}
.s-divider .title{color:var(--yellow);font-size:clamp(40px,8vw,132px)}
.s-divider .lede{color:#e8e8e8}
.s-divider .barline{height:10px;width:min(36vw,440px);background:var(--red);margin-top:3vh}
.bullets{list-style:none;margin-top:1.2vh;display:flex;flex-direction:column;gap:.85vh;max-width:76ch}
.bullets li{position:relative;padding-left:1.3em;font-size:clamp(14px,1.6vw,22px);line-height:1.45}
.bullets li::before{content:"";position:absolute;left:0;top:.52em;width:.55em;height:.55em;background:var(--red);transform:rotate(45deg)}
/* Densité : 5–6 bullets */
.bullets.md{gap:.6vh;max-width:80ch}
.bullets.md li{font-size:clamp(13px,1.42vw,20px);line-height:1.4}
/* Densité : 7+ bullets → 2 colonnes */
.bullets.dense{display:grid;grid-template-columns:1fr 1fr;gap:.65vh 2.5vw;max-width:100ch;margin-top:1vh;align-items:start}
.bullets.dense li{font-size:clamp(12px,1.28vw,18px);line-height:1.35}
.note-strip{margin-top:1.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:.8vh 1.4vw;font-size:clamp(12px,1.3vw,17px);max-width:80ch;border-left:8px solid var(--yellow);line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;margin-top:3vh}
.stat{background:var(--white);border:1px solid var(--line);border-top:7px solid var(--red);
  padding:3vh 1.4vw;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.stat .num{font-family:var(--disp);color:var(--red);font-size:clamp(34px,5.6vw,92px);line-height:.9}
.stat .lab{font-family:var(--body);color:#2b2b2b;font-size:clamp(12px,1.3vw,19px);margin-top:1.4vh;line-height:1.25}
.source{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:2.4vh}
.steps{display:grid;gap:1.2vw;margin-top:2vh}
.steps.n3{grid-template-columns:repeat(3,1fr)} .steps.n4{grid-template-columns:repeat(4,1fr)}
.steps.n5{grid-template-columns:repeat(5,1fr)}
.steps.n5 .step{padding:1.4vh .9vw}
.steps.n5 .step .big{font-size:clamp(22px,3vw,50px)}
.steps.n5 .step .nm{font-size:clamp(11px,1.2vw,17px)}
.steps.n5 .step .ds{font-size:clamp(10px,1.1vw,15px)}
.step{background:var(--card);border:1px solid var(--line);padding:2vh 1.2vw;position:relative;
  transition:transform .25s ease, box-shadow .25s ease}
.step:hover{transform:translateY(-6px);box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.step .big{font-family:var(--disp);color:var(--red);font-size:clamp(26px,3.6vw,60px);line-height:.9}
.step .nm{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(13px,1.4vw,21px);margin-top:1.2vh}
.step .ds{font-size:clamp(12px,1.25vw,19px);color:#333;margin-top:.7vh;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;margin-top:1.6vh}
.tc{padding:1.8vh 1.6vw;border:1px solid var(--line);background:var(--card)}
.tc.red{background:var(--red);color:#fff;border-color:var(--red)}
.tc.black{background:var(--ink);color:#fff;border-color:var(--ink)}
.tc h3{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(17px,2.1vw,32px)}
.tc.red h3,.tc.black h3{color:var(--yellow)}
.tc.plain h3{color:var(--red)}
.tc p{font-size:clamp(13px,1.4vw,20px);margin-top:1.2vh;line-height:1.42}
.callout{margin-top:2vh;padding:3.5vh 2.5vw;display:flex;flex-direction:column;gap:1.4vh;max-width:82ch}
.callout.black{background:var(--ink)} .callout.red{background:var(--red)}
.callout .big{font-family:var(--disp);text-transform:uppercase;line-height:1;
  font-size:clamp(24px,3.6vw,58px)}
.callout.black .big{color:var(--yellow)} .callout.red .big{color:#fff}
.callout .sub{font-size:clamp(15px,1.8vw,26px)} .callout.black .sub{color:#fff} .callout.red .sub{color:#fff}
.defbox{margin-top:1.4vh;background:var(--card);border-left:12px solid var(--red);padding:1.8vh 2.2vw;max-width:84ch}
.defbox .term{font-family:var(--ui);font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(16px,1.9vw,28px)}
.defbox .txt{font-size:clamp(17px,2.1vw,30px);margin-top:1.4vh;line-height:1.3}
.defextra{margin-top:2.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1.4vh 1.6vw;border-left:8px solid var(--yellow);font-size:clamp(14px,1.6vw,23px);max-width:82ch}
.quiz-q{font-size:clamp(18px,2.4vw,36px);font-weight:600;margin-top:2vh;max-width:60ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3vh;max-width:90ch}
.opt{font-family:var(--ui);text-align:left;background:var(--white);border:2px solid var(--line);
  padding:1.8vh 1.4vw;font-size:clamp(14px,1.6vw,23px);cursor:pointer;transition:.2s;display:flex;gap:.7em;align-items:center}
.opt:hover{border-color:var(--ink);transform:translateY(-3px)}
.opt .k{font-weight:800;color:var(--red)}
.opt.good{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.opt.good .k{color:var(--ink)}
.opt.bad{opacity:.45;border-style:dashed}
.quiz-a{margin-top:2.4vh;font-family:var(--ui);font-weight:700;color:var(--red);
  font-size:clamp(14px,1.7vw,24px);opacity:0;transition:.3s}
.quiz-a.show{opacity:1}
.case-sc{background:var(--ink);color:#eee;border-left:5px solid var(--yellow);padding:1.4vh 1.8vw;
  font-size:clamp(13px,1.4vw,20px);margin-top:.8vh;max-width:96ch;line-height:1.45;border-radius:0 6px 6px 0;
  position:relative}
.case-sc::before{content:"Scénario";position:absolute;top:-1px;left:-1px;background:var(--yellow);color:var(--ink);
  font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;line-height:1.6}
.case-ctx{font-size:clamp(11px,1.05vw,14px);color:#6a8fa8;margin-top:.6vh;padding:.4vh 1vw;
  border-left:2px solid #334;max-width:96ch;line-height:1.5;font-style:italic;background:rgba(100,160,220,.05);border-radius:0 3px 3px 0}
.case-ctx::before{content:"Guide d'animation · ";font-weight:700;color:#4a7090;font-style:normal}
.case-q{margin-top:1.2vh;display:flex;flex-direction:column;gap:.7vh}
.case-q li{font-size:clamp(12px,1.35vw,19px) !important;list-style:none;padding:.5vh .8vw .5vh 2.8vw;
  background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);border-radius:5px;
  position:relative;line-height:1.3;color:var(--ink)}
.case-q li::before{content:none}
.case-q li .qi{position:absolute;left:.6vw;top:.45vh;font-family:var(--disp);color:var(--yellow);font-size:clamp(14px,1.5vw,21px);line-height:1}
.timer{display:flex;align-items:center;gap:1.2vw;margin-top:auto;padding-top:2.4vh}
.tmr-display{font-family:var(--disp);font-size:clamp(34px,5vw,80px);color:var(--ink);line-height:.9;min-width:3.4ch}
.tmr-display.run{color:var(--red)} .tmr-display.done{color:var(--red);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.25}}
.tbtn{font-family:var(--ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:2px solid var(--ink);background:var(--ink);color:#fff;padding:1.1vh 1.4vw;cursor:pointer;font-size:clamp(12px,1.2vw,17px)}
.tbtn.ghost{background:transparent;color:var(--ink)}
.tbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.slide.s-closing{background:var(--ink);color:#fff;justify-content:center}
.s-closing .title{color:var(--yellow);font-size:clamp(54px,11vw,180px)}
.s-closing .sub{font-size:clamp(16px,2vw,30px);color:#eee;margin-top:2vh}
.s-closing .contacts{font-family:var(--ui);color:#bbb;margin-top:3vh;font-size:clamp(13px,1.4vw,20px);line-height:1.6}
.s-closing::before{background:var(--red)}
.svgwrap{margin-top:2.2vh;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
.svgwrap svg{width:100%;max-width:1100px;max-height:72vh;height:auto;display:block}
.svgwrap text{font-family:var(--ui)}
#ink{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#inktools{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:58;display:none;gap:8px;
  background:rgba(18,18,18,.94);padding:9px;border-radius:14px;box-shadow:0 14px 40px -16px rgba(0,0,0,.6)}
#inktools.on{display:flex}
.it{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:#2a2a2a;color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:18px;font-family:var(--ui);font-weight:800;transition:.15s}
.it:hover{background:#3a3a3a}
.it.act{border-color:#fff;background:#000}
.it.pen{color:var(--red)} .it.hl{color:var(--yellow)}
#bar{position:fixed;top:0;left:0;height:6px;background:rgba(0,0,0,.12);width:100%;z-index:50}
#bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s ease}
.hud{position:fixed;z-index:50;font-family:var(--ui);font-weight:700}
#count{left:24px;bottom:18px;color:var(--muted);font-size:14px;letter-spacing:.1em}
#count b{color:var(--red)}
#ctrl{right:18px;bottom:14px;display:flex;gap:8px}
.cb{width:42px;height:42px;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
  border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:.2s;font-size:18px}
.cb:hover{background:var(--red);color:#fff;border-color:var(--red)}
#brand{position:fixed;right:26px;top:16px;z-index:50;font-family:var(--disp);font-size:24px;color:var(--red);letter-spacing:.02em;
  background:var(--yellow);padding:2px 10px 0;line-height:1.25}
/* notes */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,10,10,.97);color:#f4f4f4;
  transform:translateY(102%);transition:transform .35s cubic-bezier(.4,0,.2,1), height .25s ease;
  height:50vh;display:flex;flex-direction:column;
  border-top:3px solid var(--yellow);font-family:var(--ui);box-shadow:0 -8px 40px rgba(0,0,0,.6)}
#notes.show{transform:none}
#notes.mini{height:54px}
#notes.mini #notes-body{display:none}
#notes.mini #notes-min{transform:rotate(180deg)}

/* handle de drag pour resize */
#notes-handle{height:18px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
#notes-handle::before{content:"";width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#notes-handle:hover::before{background:var(--yellow)}

#notes-head{display:flex;align-items:center;gap:10px;padding:0 20px 10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
#notes-head .n-label{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;flex:1}
#notes-head .n-slide{color:#666;font-size:11px;font-weight:600;letter-spacing:.05em;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:3px}
.notes-btn{background:none;border:1.5px solid #3a3a3a;color:#aaa;width:28px;height:28px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;padding:0;line-height:1}
.notes-btn:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
#notes-close:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}

#notes-body{overflow-y:auto;padding:16px 22px 20px;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
#notes .nbody{font-family:var(--body,'Georgia',serif);font-size:clamp(14px,1.35vw,18px);line-height:1.75;max-width:110ch;color:#ccc}
#notes .nbody b{color:#fff;font-weight:700}
#notes .nbody br+b,#notes .nbody>b:first-child{display:inline-block;margin-top:1em;color:var(--yellow);font-size:.78em;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(255,210,0,.2);padding-bottom:.2em;width:100%}
#notes .nbody .cgt{color:#FFD200;font-weight:600;display:block;margin-top:.8em;padding:.6em 1em;background:rgba(255,210,0,.06);border-left:3px solid var(--yellow);border-radius:0 4px 4px 0;font-family:var(--ui);font-size:.92em;line-height:1.5}
#notes .nbody .ref{color:#7aabff;font-style:italic;font-size:.84em;display:inline-block;margin-top:.4em}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(12,12,12,.97);overflow:auto;padding:70px 5vw 60px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
#ov.show{display:grid}
.ovc{background:#1b1b1b;border:1px solid #2c2c2c;border-left:5px solid var(--red);padding:16px 16px 18px;cursor:pointer;
  color:#eaeaea;transition:.18s;min-height:120px;display:flex;flex-direction:column;gap:6px}
.ovc:hover{background:#262626;transform:translateY(-4px);border-left-color:var(--yellow)}
.ovc.div{border-left-color:var(--yellow);background:#000}
.ovc .n{font-family:var(--ui);font-weight:800;color:var(--red);font-size:12px;letter-spacing:.1em}
.ovc .k{font-family:var(--ui);font-weight:700;color:var(--yellow);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ovc .t{font-family:var(--disp);font-size:19px;line-height:1.02;text-transform:uppercase;color:#fff}
#ovhead{position:fixed;top:18px;left:5vw;z-index:71;color:#fff;font-family:var(--ui);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;font-size:13px;display:none}
#ov.show ~ #ovhead{display:block}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(10,10,10,.9);display:none;place-items:center}
#help.show{display:grid}
.helpcard{background:#fff;max-width:520px;width:90%;padding:34px 38px;border-top:10px solid var(--red)}
.helpcard h3{font-family:var(--disp);font-size:30px;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.helpcard dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-family:var(--ui);font-size:15px}
.helpcard dt{font-weight:800;color:var(--ink)}
.helpcard kbd{background:var(--ink);color:#fff;padding:2px 9px;border-radius:5px;font-family:var(--ui);font-size:13px}
.wordmark{font-family:var(--disp);background:var(--yellow);color:var(--red);padding:2px 10px 0;line-height:1.25;display:inline-block}
.logo-img{display:block;height:100%}
#brand.haslogo{background:transparent;padding:0;height:46px}
.lockup{display:flex;align-items:center;gap:16px;margin-bottom:2.4vh}
.lockup .wordmark{font-size:clamp(26px,3vw,40px)}
.lockup .logo-img{height:clamp(46px,6vw,84px)}
.s-title .lockup .logo-img{height:clamp(110px,15vh,190px)}
.s-closing .lockup .logo-img{height:clamp(90px,12vh,150px)}
#brand.haslogo{height:clamp(74px,9.5vh,112px)}
@media print{
  @page{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #bar,#ctrl,#brand,#count,#notes,#ov,#ovhead,#help,#spotlight,#inktools,#ink,#btn-print-float{display:none!important}
  #deck{position:static!important}
  .slide{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
    opacity:1!important;visibility:visible!important;transform:none!important;height:100vh!important;
    page-break-after:always;break-after:page}
  .reveal{animation:none!important;opacity:1!important;transform:none!important}
  .quiz-a{opacity:1!important}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr}
  .steps.n3,.steps.n4{grid-template-columns:1fr 1fr} .opts{grid-template-columns:1fr}
  .slide{padding:8vh 8vw}
}
/* ===== AMÉLIORATIONS V2 ===== */
/* 1. Timer circulaire */
.timer-ring{width:clamp(80px,10vw,120px);height:clamp(80px,10vw,120px);flex-shrink:0}
.timer-arc{transition:stroke-dashoffset 1s linear}
/* 3. Transitions directionnelles */
@keyframes slideOutLeft{to{opacity:0;transform:translateX(-60px) scale(.97)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOutRight{to{opacity:0;transform:translateX(60px) scale(.97)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px) scale(.97)}to{opacity:1;transform:none}}
.slide.leave-left{animation:slideOutLeft .38s cubic-bezier(.4,0,.2,1) forwards;z-index:3}
.slide.enter-right{animation:slideInRight .38s cubic-bezier(.4,0,.2,1) forwards}
.slide.leave-right{animation:slideOutRight .38s cubic-bezier(.4,0,.2,1) forwards;z-index:3}
.slide.enter-left{animation:slideInLeft .38s cubic-bezier(.4,0,.2,1) forwards}
/* 4. Divider animé */
.slide.s-divider{background:linear-gradient(135deg,#0a0a0a 0%,#1a0a0a 50%,#0a0a0a 100%);background-size:400% 400%;animation:divPulse 6s ease infinite}
@keyframes divPulse{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.s-divider .title::after{content:'';display:block;height:3px;background:var(--red,#E2001A);width:0;margin-top:.5rem;animation:lineGrow 1s .3s ease forwards}
.slide.active.s-divider .title::after{animation:lineGrow 1s .3s ease forwards}
@keyframes lineGrow{to{width:80px}}
/* 5. Spotlight laser */
#spotlight{position:fixed;inset:0;pointer-events:none;z-index:500;display:none}
#spotlight.on{display:block;background:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),transparent 0%,rgba(0,0,0,.75) 100%)}
/* 6. Barre numérotée */
#bar{overflow:visible}
#bar-num{position:absolute;right:8px;top:8px;background:var(--yellow);color:var(--ink);font-family:var(--ui);font-weight:800;font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;z-index:51;white-space:nowrap;letter-spacing:.04em;box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* 8. Print amélioré */
@media print{
  #spotlight,#bar-num{display:none!important}
}

/* ===== V3 : schémas animés, stagger étendu ===== */
.slide.active .reveal:nth-child(7){animation-delay:.36s}
.slide.active .reveal:nth-child(8){animation-delay:.42s}
.slide.active .reveal:nth-child(9){animation-delay:.48s}
.slide.active .reveal:nth-child(10){animation-delay:.54s}
.svgcap{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:1.2vh;max-width:90ch}
.s-svg .svgwrap{margin-top:1.6vh}
.s-svg .svgwrap svg{max-height:66vh}
.svgwrap .t-title{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em}
.svgwrap .t-ui{font-family:var(--ui);font-weight:700}
.svgwrap .t-body{font-family:var(--body)}
/* tracés qui se dessinent (pathLength="1") */
.slide .a-draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .a-draw{animation:drawLine .9s cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
/* éléments qui apparaissent */
.slide .a-pop{opacity:0;transform-box:fill-box;transform-origin:center}
.slide.active .a-pop{animation:popIn .55s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slide .a-fade{opacity:0}
.slide.active .a-fade{animation:fadeIn .6s ease var(--d,0s) forwards}
@keyframes fadeIn{to{opacity:1}}
/* barres qui grandissent */
.slide .a-growx{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.slide.active .a-growx{animation:growX .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growX{to{transform:scaleX(1)}}
.slide .a-growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0)}
.slide.active .a-growy{animation:growY .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growY{to{transform:scaleY(1)}}
/* pulsation d'un point d'attention */
.slide.active .a-pulse{animation:pulseRing 1.8s ease-out calc(var(--d,0s) + .6s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media print{
  .a-draw{stroke-dashoffset:0!important;animation:none!important}
  .a-pop,.a-fade{opacity:1!important;animation:none!important;transform:none!important}
  .a-growx,.a-growy{transform:none!important;animation:none!important}
  .a-pulse{display:none!important}
}

  foot:"CGT Occitanie — Comité régional · Secteur privé · Adaptations FP disponibles",
  notes:"<b>Ouvrir la journée : de la réparation à la prévention.</b> La formation AT/MP apprend à faire reconnaître et réparer. Celle-ci apprend à agir <b>avant</b> l'accident. Présenter le plan en 6 parties : 1. Cadre légal & acteurs · 2. Analyse des AT (a posteriori) · 3. Analyse des situations de travail (a priori) · 4. DUERP & plan d'action · 5. Rôle du CSE & droits militants · 6. Outils pratiques. <b>Tour de table rapide (10 min) :</b> prénom, entreprise, mandat, et « un risque de mon entreprise qui m'inquiète ». Noter les risques au tableau : ils serviront de fil rouge pour les exercices. <span class='cgt'>Fil rouge CGT de la journée : la santé au travail n'est pas une question technique réservée aux experts ni une affaire de comportements individuels. C'est l'organisation du travail, décidée par l'employeur, qui crée ou supprime les risques — et c'est donc un terrain d'action syndicale collective.</span> <span class='ref'>Durée indicative : 1 journée. Supports : DUERP anonymisé, grille d'inspection, registre DGI vierge.</span>"},

  source:"Source : Assurance Maladie – Risques professionnels 2025 ; communiqué CGT du 10 septembre 2026.",
  notes:"<b>Mesurer l'ampleur pour poser l'enjeu.</b> Plus de 1 300 personnes meurent chaque année de leur travail en France — près de 4 par jour. Plus d'un demi-million d'accidents avec arrêt. Et ces chiffres ne comptent que ce qui est <b>déclaré et reconnu</b> : la sous-déclaration est massive, en particulier pour les maladies professionnelles et les troubles psychiques. Les affections psychiques reconnues ont doublé en cinq ans, signe que l'intensification du travail produit des dégâts. <b>Question au groupe :</b> combien d'accidents ont eu lieu dans votre entreprise l'an dernier ? Le savez-vous ? Le CSE dispose-t-il de ces chiffres ? <span class='cgt'>Chaque accident évité, c'est une vie ou une santé préservée — mais c'est aussi la démonstration que les accidents ne sont pas une fatalité. Derrière chaque chiffre, il y a une organisation du travail : cadences, sous-effectif, sous-traitance, précarité. Les intérimaires et les jeunes sont surreprésentés dans les accidents graves.</span> <span class='ref'>Chiffres : Assurance Maladie, rapport annuel Risques professionnels.</span>"},

  notes:"<b>Poser les bases juridiques avant les méthodes.</b> Cette partie répond à deux questions : qu'est-ce que l'employeur doit faire ? Et qui peut l'y obliger ? Annoncer les 3 notions clés à retenir : l'<b>obligation de sécurité</b>, les <b>9 principes généraux de prévention</b>, le <b>DUERP</b>. <span class='cgt'>Connaître le droit, ce n'est pas faire du juridisme : c'est savoir sur quoi s'appuyer pour obliger l'employeur à agir, et laisser des traces écrites qui serviront aux salariés.</span>"},

{type:"def", title:"L'obligation de sécurité de l'employeur",
  term:"Article L.4121-1 du Code du travail",
  text:"L'employeur prend les mesures nécessaires pour assurer la sécurité et protéger la santé physique et mentale des travailleurs : actions de prévention, d'information et de formation, organisation et moyens adaptés.",
  extra:"<b>Jurisprudence :</b> l'employeur ne s'exonère que s'il prouve avoir pris <b>toutes</b> les mesures de prévention prévues par les articles L.4121-1 et L.4121-2 (Cass. soc. 25 nov. 2015, Air France). En cas d'AT/MP, la faute inexcusable est retenue s'il avait conscience du danger et n'a pas pris les mesures nécessaires.",
  notes:"<b>La base légale de toute action syndicale en prévention.</b> L'obligation de sécurité pèse sur l'employeur seul : c'est lui qui organise le travail, c'est donc lui qui répond des risques. Historique à expliquer : en 2002, les arrêts « amiante » ont parlé d'obligation de <b>résultat</b>. Depuis 2015 (arrêt Air France), la Cour de cassation admet que l'employeur s'exonère s'il <b>prouve</b> avoir mis en œuvre toutes les mesures de prévention prévues par la loi. Concrètement, la charge de la preuve reste sur l'employeur : c'est à lui de démontrer qu'il a évalué, planifié, formé, protégé. <b>Faute inexcusable :</b> en cas d'AT/MP, elle est caractérisée dès lors que l'employeur avait ou aurait dû avoir conscience du danger et n'a pas pris les mesures nécessaires. Elle est même de droit si le risque lui avait été signalé par un salarié ou un élu (L.4131-4). <span class='cgt'>Conséquence pratique majeure : tout écrit du CSE qui signale un risque (PV, alerte, courrier, compte rendu d'inspection) établit la conscience du danger. C'est la meilleure protection des salariés : soit l'employeur agit, soit il engage sa responsabilité. Face au discours sur « l'imprudence des salariés », rappeler que la responsabilité est d'abord organisationnelle.</span> <span class='ref'>Réf. L.4121-1, L.4121-2, L.4131-4 CT ; Cass. soc. 28 fév. 2002 ; Cass. soc. 25 nov. 2015 n° 14-24.444 ; L.452-1 CSS.</span>"},

{type:"content", title:"Les 9 principes généraux de prévention",
  kicker:"Article L.4121-2 du Code du travail",
  bullets:[
    "<b>1.</b> Éviter les risques",
    "<b>2.</b> Évaluer les risques qui ne peuvent pas être évités",
    "<b>3.</b> Combattre les risques à la source",
    "<b>4.</b> Adapter le travail à l'homme (conception des postes, choix des équipements, méthodes de travail)",
    "<b>5.</b> Tenir compte de l'état d'évolution de la technique",
    "<b>6.</b> Remplacer ce qui est dangereux par ce qui l'est moins",
    "<b>7.</b> Planifier la prévention (technique, organisation, conditions de travail, relations sociales, harcèlement)",
    "<b>8.</b> Prioriser la protection collective sur la protection individuelle",
    "<b>9.</b> Donner les instructions appropriées aux travailleurs"
  ],
  notes:"<b>Une hiérarchie, pas une liste à cocher.</b> Les 9 principes se lisent de haut en bas : on commence par chercher à <b>supprimer</b> le risque (1), puis on évalue ce qui reste (2), on agit à la source (3), on adapte le travail aux personnes et non l'inverse (4), on intègre les progrès techniques (5), on substitue ce qui est dangereux (6), on planifie en intégrant l'organisation et les relations sociales — y compris le harcèlement moral et sexuel (7), on privilégie le collectif sur l'individuel (8), et seulement en dernier lieu on donne des consignes (9). <b>Exercice (5 min) :</b> reprendre un risque noté au tour de table et parcourir les 9 niveaux : jusqu'où l'employeur est-il allé ? <span class='cgt'>Quand l'employeur répond « EPI » ou « consignes », il saute directement aux niveaux 8 et 9. Lui opposer les niveaux 1 à 7 : a-t-il démontré qu'il ne pouvait pas supprimer ou réduire le risque à la source ? Le principe 4 est central pour la CGT : c'est l'organisation (cadences, effectifs, horaires) qu'il faut adapter aux salariés, pas les salariés qu'il faut « endurcir ».</span> <span class='ref'>Réf. L.4121-2 CT (issu de la directive-cadre européenne 89/391).</span>"},

{type:"two", title:"Les acteurs internes de la prévention",
  kicker:"Qui fait quoi en entreprise",
  a:{h:"Employeur & encadrement", t:"Évalue les risques (DUERP), met en œuvre et finance les mesures, informe et forme. Responsabilité civile et pénale. Peut désigner un salarié compétent en prévention (L.4644-1).", style:"plain"},
  b:{h:"CSE / CSSCT", t:"Analyse les risques, inspecte, enquête après AT/MP, déclenche le droit d'alerte, recourt à l'expertise, est consulté sur tout projet modifiant les conditions de travail.", style:"black"},
  notes:"<b>Distinguer responsabilité et pouvoir d'agir.</b> L'employeur est seul responsable de la sécurité : il ne peut pas la déléguer au CSE, ni aux salariés. Le CSE (et sa commission santé, sécurité et conditions de travail, la CSSCT, obligatoire à partir de 300 salariés et dans les sites à risques) n'est pas co-responsable : il contrôle, propose, alerte. Le salarié désigné compétent en prévention (L.4644-1) aide l'employeur mais ne le remplace pas. Dans les entreprises de 11 à 49 salariés, le CSE dispose aussi de prérogatives en santé-sécurité : il peut alerter, présenter des réclamations, saisir l'inspection du travail. <span class='cgt'>Ne jamais accepter que le CSE « valide » le DUERP ou « co-signe » une décision de prévention : ce serait partager une responsabilité qui n'appartient qu'à l'employeur. Le rôle des élus est de contrôler, d'exiger et de proposer — en toute indépendance.</span> <span class='ref'>Réf. L.4121-1 et L.4644-1 CT ; L.2312-5 (CSE &lt; 50) ; L.2312-9 et L.2312-13 (CSE ≥ 50) ; L.2315-36 (CSSCT).</span>"},

{type:"content", title:"Les acteurs externes de la prévention",
  kicker:"Les alliés du militant",
  bullets:[
    "<b>Service de prévention et de santé au travail (SPST)</b> — médecin du travail, infirmiers, IPRP : conseil, études de poste, fiche d'entreprise",
    "<b>Inspection du travail (DREETS)</b> — contrôle, mise en demeure, procès-verbal, arrêt temporaire de travaux",
    "<b>CARSAT</b> — prévention, aides financières, tarification AT/MP ; peut adresser une injonction à l'employeur",
    "<b>INRS</b> — ressources documentaires, outils d'évaluation, fiches toxicologiques",
    "<b>OPPBTP</b> (BTP) — organisme de prévention du secteur de la construction"
  ],
  strip:"L'inspection du travail peut ordonner l'arrêt temporaire de travaux en cas de danger grave et imminent (chute de hauteur, ensevelissement, amiante…).",
  notes:"<b>Clarifier le rôle de chacun pour savoir qui saisir.</b> <b>Médecin du travail (SPST)</b> : conseil et prévention, pas de soins ; rédige la fiche d'entreprise (document très utile pour les élus), propose des aménagements de poste, peut être invité au CSE. <b>Inspection du travail</b> : contrôle, mise en demeure, procès-verbal, arrêt temporaire de travaux (L.4731-1) ; peut être saisie par tout salarié ou élu. <b>CARSAT</b> : ingénieurs et contrôleurs de sécurité, visites d'entreprise, aides financières, et pouvoir d'injonction suivi d'une cotisation supplémentaire si l'employeur ne fait rien. <b>INRS</b> : documentation gratuite et outils. <span class='cgt'>Saisir l'inspection du travail n'est pas une « escalade » : c'est un droit. Un courrier recommandé, avec copie au CSE, crée une trace officielle souvent plus efficace qu'une réunion avec un employeur de mauvaise foi. La CARSAT peut être invitée à venir en entreprise : un diagnostic extérieur et gratuit est un levier précieux.</span> <span class='ref'>Réf. L.4622-2 (SPST), L.4731-1 (arrêt de travaux), L.422-4 CSS (injonction CARSAT).</span>"},

{type:"callout", title:"Le DUERP — Document unique d'évaluation des risques",
  kicker:"L'outil central — Articles L.4121-3 et R.4121-1",
  mode:"red",
  big:"Obligatoire dès 1 salarié",
  sub:"Mis à jour au moins une fois par an dans les entreprises d'au moins 11 salariés, et à chaque changement important des conditions de travail ou après une information sur un risque. Conservé 40 ans. Tenu à la disposition des salariés, du CSE, du médecin du travail et de l'inspection.",
  notes:"<b>Le DUERP : point de départ de la prévention — et du contrôle syndical.</b> Obligatoire dès le premier salarié, il recense et évalue les risques de chaque unité de travail. Depuis la loi santé au travail du 2 août 2021 : il est conservé 40 ans dans ses versions successives, le CSE contribue à son élaboration, et il débouche sur un <b>programme annuel de prévention (PAPRIPACT)</b> dans les entreprises d'au moins 50 salariés, ou sur une liste d'actions en dessous. <b>Questions au groupe :</b> avez-vous accès au DUERP ? De quand date-t-il ? Mentionne-t-il les risques psychosociaux ? <span class='cgt'>Exiger sa communication par écrit et l'inscrire à l'ordre du jour. S'il n'existe pas ou n'est pas à jour, c'est une infraction pénale : le consigner au PV, demander une mise à jour avec un délai, puis saisir l'inspection. Un DUERP qui ignore un risque connu des salariés est une preuve que l'employeur n'a pas évalué : c'est un argument en cas de faute inexcusable.</span> <span class='ref'>Réf. L.4121-3, L.4121-3-1, R.4121-1 à R.4121-4 CT ; sanction : R.4741-1 (amende de 5e classe).</span>"},

/* ═══ PARTIE 2 — ANALYSE A POSTERIORI ═══ */
{type:"divider", kicker:"Partie 2",
  title:["Analyse des AT", "a posteriori"],
  lede:"L'accident du travail s'analyse — méthode de l'arbre des causes",
  notes:"<b>Changer de regard sur l'accident.</b> Annoncer l'objectif : apprendre à analyser un accident non pour trouver un coupable, mais pour comprendre ce qui, dans l'organisation, l'a rendu possible. <b>Question d'ouverture :</b> « Dans votre entreprise, après un accident, quelle est la première explication donnée par la direction ? » Recueillir 2 ou 3 réponses : très souvent, « il n'a pas fait attention ». <span class='cgt'>C'est précisément ce réflexe que l'analyse syndicale doit déconstruire.</span>"},

{type:"content", title:"Un AT n'est jamais dû au hasard",
  kicker:"Principes de l'analyse a posteriori",
  bullets:[
    "Un AT <b>n'est jamais dû au hasard</b> — il s'explique toujours",
    "Il est toujours <b>multi-causal</b> : plusieurs facteurs se combinent",
    "C'est un <b>dysfonctionnement du système de travail</b>, pas une faute individuelle",
    "L'analyse recherche des <b>faits</b>, pas des responsables",
    "Elle remonte aux causes <b>organisationnelles</b>, techniques et humaines"
  ],
  strip:"Rechercher des faits, jamais des coupables : c'est la condition pour que les témoins parlent librement.",
  notes:"<b>Déconstruire le réflexe de la faute individuelle.</b> Quand un AT survient, l'encadrement dit souvent : « il n'a pas respecté la consigne ». Explication commode, souvent fausse ou incomplète. Un accident résulte toujours d'une combinaison de facteurs : matériel, environnement, organisation, formation, charge de travail. Même lorsqu'un geste est en cause, il faut se demander pourquoi ce geste a été fait : manque de temps, outil inadapté, consigne impossible à respecter. <b>Image à donner :</b> l'erreur humaine est le point d'arrivée de l'analyse, jamais son point de départ. <span class='cgt'>Attribuer l'AT à l'imprudence du salarié exonère l'employeur à moindre coût et prépare parfois une sanction disciplinaire. L'analyse des causes est un contre-pouvoir factuel : elle met au jour cadences excessives, formation insuffisante, matériel défaillant, effectifs trop justes — c'est-à-dire des choix de gestion.</span> <span class='ref'>Méthode : INRS, « L'arbre des causes » (ED 6163).</span>"},

{type:"steps", title:"Les 5 étapes de l'analyse d'un AT",
  kicker:"Méthode de l'arbre des causes",
  items:[
    {big:"1", nm:"Recueillir les faits", ds:"Sur place, vite (24-48 h). Faits précis, sans jugement. Témoignages, photos, état du matériel."},
    {big:"2", nm:"Construire l'arbre", ds:"Partir du fait final et remonter : « qu'a-t-il fallu pour que… ? ». Faits nécessaires et suffisants."},
    {big:"3", nm:"Rechercher des mesures", ds:"Une mesure par cause, en suivant les 9 principes de prévention : d'abord supprimer, ensuite protéger."},
    {big:"4", nm:"Mettre en œuvre", ds:"Plan d'action : quoi, qui, quand, avec quel budget. Inscription au DUERP."},
    {big:"5", nm:"Suivre et vérifier", ds:"Les mesures sont-elles réalisées ? Efficaces ? Ont-elles créé d'autres risques ?"}
  ],
  notes:"<b>Une méthode rigoureuse en 5 temps.</b> (1) <b>Recueil</b> : se rendre sur les lieux très vite, avant que tout soit rangé ; noter les faits observables (« le sol était mouillé ») et non les opinions (« il allait trop vite ») ; entendre la victime, les témoins, l'encadrement séparément. (2) <b>Arbre</b> : chaque fait doit être nécessaire (sans lui, l'accident n'arrive pas) ; repérer les faits inhabituels (variations par rapport au travail normal). (3) <b>Mesures</b> : pour chaque cause, chercher la mesure la plus haute dans la hiérarchie de prévention. (4) <b>Mise en œuvre</b> : un responsable, un délai, un budget, sinon rien ne se passe. (5) <b>Suivi</b> : vérifier et réévaluer. <span class='cgt'>L'étape 1 est décisive : demander que les élus soient prévenus immédiatement de tout accident pour pouvoir enquêter à chaud. Une enquête menée trois semaines après, sur la seule base du récit de la hiérarchie, ne vaut rien. Exiger que l'arbre et le plan d'action soient présentés au CSE et annexés au PV.</span> <span class='ref'>Réf. L.2312-13 CT (enquêtes du CSE) ; INRS ED 6163.</span>"},

{type:"two", title:"Causes immédiates vs causes profondes",
  kicker:"Creuser jusqu'à l'organisation",
  a:{h:"Causes immédiates", t:"Geste inapproprié, équipement défectueux, sol glissant, EPI absent. Faciles à identifier — insuffisantes à traiter seules.", style:"plain"},
  b:{h:"Causes profondes (organisationnelles)", t:"Pression de production, sous-effectif, formation insuffisante, politique d'achat, maintenance reportée, sous-traitance, management par objectifs.", style:"black"},
  source:"<b>Angle CGT :</b> l'employeur s'arrête volontiers aux causes immédiates pour ne pas remettre en cause ses choix de gestion.",
  notes:"<b>Le cœur du débat syndical sur l'accident.</b> Les causes immédiates sont visibles et proches de l'accident. Les causes profondes sont plus éloignées dans le temps et dans la hiérarchie : ce sont des décisions prises par d'autres que la victime (budget, effectifs, délais, achats, sous-traitance). <b>Questions à poser systématiquement :</b> qui a décidé de ne pas former ? Qui a validé ce matériel ? Qui a fixé ces cadences ? Pourquoi la maintenance a-t-elle été reportée ? Le poste était-il tenu par un intérimaire ou un nouvel embauché sans accompagnement ? <span class='cgt'>Si l'analyse s'arrête aux causes immédiates, elle ne sert qu'à culpabiliser le salarié et à prévoir un « rappel des consignes ». Remonter aux causes profondes, c'est remettre l'organisation du travail au centre — et c'est là que se trouvent les leviers de prévention durable comme les éléments de faute inexcusable.</span>"},

{type:"quiz", title:"Quiz — Arbre des causes",
  q:"Un cariste percute une palette en reculant. L'employeur conclut : « imprudence du salarié ». Quelle(s) cause(s) organisationnelle(s) l'arbre des causes peut-il révéler ?",
  opts:[{k:"A",t:"Allées de circulation trop étroites (conception de l'entrepôt)"},{k:"B",t:"Absence d'alarme de recul sur le chariot"},{k:"C",t:"Les trois — et potentiellement d'autres (cadences, sous-effectif…)"},{k:"D",t:"Salarié non formé ou CACES périmé"}],
  ans:2,
  explain:"Les trois causes sont toutes plausibles — et l'arbre en révèle souvent d'autres. Un AT n'a jamais une seule cause : chacune doit faire l'objet d'une mesure de prévention distincte.",
  notes:"<b>Vérifier la compréhension de la multi-causalité.</b> Laisser voter à main levée avant de révéler. Si des stagiaires choisissent une seule réponse, demander : « si on corrige seulement cette cause, l'accident peut-il se reproduire ? ». <span class='cgt'>Conclure « imprudence du salarié » permet souvent d'éviter d'investir dans les vraies causes — et peut masquer une faute inexcusable. Le rôle de l'élu est de refuser cette conclusion tant que l'analyse n'a pas été menée.</span>"},

/* ═══ PARTIE 3 — ANALYSE A PRIORI ═══ */
{type:"divider", kicker:"Partie 3",
  title:["Analyse des situations", "de travail — a priori"],
  lede:"Identifier les risques avant l'accident",
  notes:"<b>Passer de la réaction à l'anticipation.</b> L'analyse a posteriori part d'un accident ; l'analyse a priori cherche les risques avant qu'ils ne se réalisent. C'est la vraie prévention primaire. <span class='cgt'>Les élus qui attendent l'accident pour agir arrivent toujours trop tard : l'observation du travail réel doit devenir une pratique régulière du CSE.</span>"},

{type:"content", title:"La démarche d'analyse a priori",
  kicker:"Observer avant que l'accident arrive",
  bullets:[
    "Analyser le <b>travail réel</b>, pas le travail prescrit",
    "Être <b>descriptif</b> et factuel, pas évaluatif",
    "Observer : <b>qui</b> fait quoi · <b>comment</b> · <b>avec quoi</b> · <b>où</b> · <b>quand</b>",
    "Impliquer les <b>salariés</b> : ce sont eux qui connaissent les vrais risques",
    "Distinguer <b>danger</b> (ce qui peut causer un dommage) et <b>risque</b> (exposition à ce danger)"
  ],
  strip:"Le travail prescrit, c'est ce que l'employeur a prévu. Le travail réel, c'est ce que font les salariés pour que ça marche malgré tout.",
  notes:"<b>Observer le travail réel : la base de la prévention primaire.</b> Les fiches de poste et modes opératoires décrivent un travail idéal. Le travail réel est fait d'aléas, d'outils inadaptés, de pannes, de délais intenables, que les salariés compensent par des « astuces ». Ces écarts sont des risques invisibles dans le DUERP tant que personne ne va les observer. <b>Méthode pour les élus :</b> tournée en binôme (élu + salarié du secteur), observation sans juger, questions ouvertes (« qu'est-ce qui est difficile ? », « que faites-vous quand la machine tombe en panne ? »), compte rendu écrit au CSE. <span class='cgt'>L'écart entre prescrit et réel est presque toujours révélateur d'un manque de moyens. Le faire apparaître, c'est montrer que les salariés tiennent la production en prenant des risques — et que c'est l'organisation qui doit changer, pas leur comportement.</span> <span class='ref'>Réf. L.2312-13 CT (inspections du CSE).</span>"},

{type:"content", title:"Les familles de risques",
  kicker:"Ne rien oublier dans le DUERP",
  bullets:[
    "<b>Mécaniques</b> — écrasement, coupure, happement, chutes de hauteur et de plain-pied, circulation d'engins",
    "<b>Chimiques & biologiques</b> — agents CMR, solvants, poussières (silice, bois), fumées, agents infectieux",
    "<b>Physiques</b> — bruit, vibrations, chaleur et froid, rayonnements, éclairage",
    "<b>Ergonomiques (TMS)</b> — manutentions, postures pénibles, gestes répétitifs",
    "<b>Psychosociaux (RPS)</b> — charge de travail, pression, conflits de valeurs, violences, harcèlement",
    "<b>Organisationnels</b> — travail de nuit, horaires atypiques, travail isolé, sous-traitance, précarité"
  ],
  notes:"<b>Six familles pour un DUERP complet.</b> Parcourir chaque famille en demandant aux stagiaires des exemples de leur entreprise. Insister sur les risques <b>différés</b> (chimiques, bruit, TMS) : leurs effets apparaissent des années plus tard et ils sont sous-évalués. Repères utiles : bruit ≥ 80 dB(A) = actions d'information et protecteurs mis à disposition, ≥ 85 dB(A) = port obligatoire et programme de réduction ; agents CMR = substitution obligatoire quand elle est techniquement possible. <span class='cgt'>Les RPS et les risques organisationnels sont presque toujours absents ou minimisés dans les DUERP. Exiger qu'ils y figurent au même titre qu'un sol glissant : surcharge, injonctions contradictoires, objectifs inatteignables, violences des usagers. Pour l'évaluation des RPS, l'INRS propose des outils gratuits (RPS-DU, questionnaire SATIN).</span> <b>Exercice :</b> chaque groupe relève les risques de son secteur absents de son DUERP. <span class='ref'>Réf. R.4431-1 et s. (bruit) ; R.4412-59 et s. (CMR) ; outils INRS.</span>"},

{type:"steps", title:"Analyser une situation de travail",
  kicker:"4 étapes clés",
  items:[
    {big:"1", nm:"Décrire la situation", ds:"Observer le travail réel : qui, quoi, comment, avec quoi, où, quand. Recueillir des faits."},
    {big:"2", nm:"Repérer les dangers", ds:"Identifier les sources de dommage potentiel dans la situation observée."},
    {big:"3", nm:"Identifier les risques", ds:"Danger + exposition = risque. Estimer la fréquence et la gravité du dommage."},
    {big:"4", nm:"Hiérarchiser", ds:"Classer par priorité (gravité × fréquence) pour construire le plan d'action."}
  ],
  notes:"<b>La grille d'analyse que les élus peuvent utiliser dès demain.</b> (1) Décrire sans juger. (2) Repérer les dangers (la machine, le produit, la charge). (3) Caractériser le risque : qui est exposé, combien de temps, avec quelle gravité possible. (4) Hiérarchiser, mais attention : un risque rare mais mortel (chute de hauteur) doit rester prioritaire même si « il n'est jamais rien arrivé ». <span class='cgt'>Lors d'une inspection, utiliser cette grille systématiquement et ne jamais se contenter de ce que dit l'encadrement : observer les postes, parler aux salariés. La cotation des risques est souvent manipulée pour faire baisser les priorités : demander la méthode de cotation et la discuter en CSE.</span>"},

/* ═══ PARTIE 4 — DUERP & PLAN D'ACTION ═══ */
{type:"divider", kicker:"Partie 4",
  title:["DUERP", "& plan d'action"],
  lede:"Du diagnostic au plan de prévention — droits et leviers du CSE",
  notes:"<b>Du diagnostic à l'action.</b> Un DUERP sans plan d'action est un inventaire inutile. Cette partie montre comment transformer l'évaluation en engagements écrits, datés et vérifiables. <span class='cgt'>C'est là que le CSE pèse : en exigeant un plan précis, puis en contrôlant sa réalisation.</span>"},

{type:"svg", kicker:"La démarche de prévention", title:"Un cycle qui ne s'arrête jamais",

  </g>

  <g class="a-pop" style="--d:1.1s"><circle cx="550" cy="415" r="62" fill="#141414"/><text x="550" y="409" text-anchor="middle" fill="#fff" class="t-title" font-size="21">Agir</text><text x="550" y="433" text-anchor="middle" fill="#FFD200" class="t-ui" font-size="15">mesures</text></g>
  <g class="a-pop" style="--d:1.6s"><circle cx="300" cy="248" r="62" fill="#F1EFE8" stroke="#141414" stroke-width="3"/><text x="300" y="242" text-anchor="middle" fill="#141414" class="t-title" font-size="20">Contrôler</text><text x="300" y="266" text-anchor="middle" fill="#E2001A" class="t-ui" font-size="15">suivi</text></g>
  <g class="a-pop" style="--d:2.6s"><rect x="440" y="215" width="220" height="66" rx="33" fill="#fff" stroke="#E2001A" stroke-width="3"/><text x="550" y="243" text-anchor="middle" class="t-ui" font-size="16" fill="#141414">Le CSE</text><text x="550" y="265" text-anchor="middle" class="t-ui" font-size="16" fill="#E2001A">à chaque étape</text></g>
  <g class="t-body" font-size="16" fill="#3b3b3b">
    <text class="a-fade" style="--d:2.8s" x="660" y="40">Contribue à l'évaluation, exige les RPS</text>
    <text class="a-fade" style="--d:2.9s" x="880" y="320">Amende, vote, fixe les délais</text>
    <text class="a-fade" style="--d:3s" x="640" y="460">Vérifie sur le terrain</text>
    <text class="a-fade" style="--d:3.1s" x="20" y="340">Inspections, enquêtes,</text>
    <text class="a-fade" style="--d:3.1s" x="20" y="362">indicateurs, alertes</text>

</svg>`,
  notes:"<b>La prévention est un processus continu, pas un document annuel.</b> Animer le schéma étape par étape. <b>Évaluer</b> : le DUERP, élaboré avec la contribution du CSE (loi de 2021). <b>Planifier</b> : le PAPRIPACT (≥ 50 salariés) ou la liste d'actions (&lt; 50), présenté au CSE. <b>Agir</b> : mettre réellement en œuvre, avec budget et responsables. <b>Contrôler</b> : inspections, enquêtes, indicateurs, retours des salariés — puis on réévalue, et le cycle recommence. <span class='cgt'>Le piège classique : un DUERP mis à jour une fois par an « pour être en règle », sans lien avec ce qui se passe sur le terrain. Le CSE doit casser cette routine en reliant chaque étape aux constats des élus : un accident, une alerte, une inspection doivent déclencher une mise à jour du DUERP et du plan d'action.</span> <span class='ref'>Réf. L.4121-3 et L.4121-3-1 CT ; L.2312-5 et L.2312-27 (consultation annuelle).</span>"},

{type:"content", title:"Le DUERP — contenu et obligations",
  kicker:"Document unique d'évaluation des risques professionnels",
  bullets:[
    "<b>Contenu :</b> inventaire et évaluation des risques par unité de travail, y compris les risques psychosociaux et les facteurs de pénibilité",
    "<b>Mise à jour :</b> au moins une fois par an (≥ 11 salariés), à chaque changement important, après toute information sur un risque",
    "<b>Accès :</b> salariés, anciens salariés (pour leurs périodes d'emploi), CSE, médecin du travail, inspection, CARSAT",
    "<b>Débouché :</b> PAPRIPACT (≥ 50 salariés) ou liste d'actions de prévention (< 50 salariés)",
    "<b>Sanctions :</b> absence ou défaut de mise à jour = contravention de 5e classe ; élément de preuve en cas de faute inexcusable"
  ],
  notes:"<b>Check-list militante d'un DUERP complet.</b> (1) Découpage en unités de travail cohérentes avec le travail réel (pas seulement l'organigramme). (2) Méthode d'évaluation expliquée. (3) Tous les risques, y compris RPS, TMS, risques chimiques différés, travail de nuit. (4) Cotation et hiérarchisation. (5) Mesures existantes et mesures à prendre. (6) Date de mise à jour. Les anciens salariés ont accès aux versions couvrant leur période d'emploi : utile pour faire reconnaître une maladie professionnelle des années plus tard. <span class='cgt'>Demander le DUERP par écrit et en faire un point permanent de l'ordre du jour. S'il est incomplet : (a) le consigner au PV avec une demande de mise à jour et un délai ; (b) courrier recommandé ; (c) saisine de l'inspection sans réponse. Un DUERP qui ignore un risque connu prouve l'absence d'évaluation.</span> <span class='ref'>Réf. L.4121-3, R.4121-1 à R.4121-4, R.4741-1 CT.</span>"},

{type:"svg", kicker:"De la suppression du danger aux EPI", title:"La hiérarchie des mesures de prévention",
  caption:"Plus on monte, plus la mesure est efficace et durable. Les EPI et les consignes viennent en dernier recours.",
  svg:`<svg viewBox="0 0 1100 470" role="img" aria-label="Hiérarchie des mesures de prévention">
  <g class="a-fade" style="--d:.2s">
    <line x1="60" y1="440" x2="60" y2="40" stroke="#141414" stroke-width="4"/>
    <path d="M60 22 l-14 24 h28z" fill="#141414"/>
    <text x="40" y="250" transform="rotate(-90 40 250)" text-anchor="middle" class="t-ui" font-size="16" fill="#141414">EFFICACITÉ</text>
  </g>
  <g class="t-ui" font-size="20">
    <g><rect class="a-growx" style="--d:.3s" x="100" y="40" width="960" height="66" fill="#E2001A"/><text class="a-fade" style="--d:.8s" x="125" y="81" fill="#fff">1. SUPPRIMER le danger</text><text class="a-fade" style="--d:.9s" x="1040" y="81" text-anchor="end" fill="#FFD200" font-size="16">ex. produit CMR retiré, tâche supprimée</text></g>
    <g><rect class="a-growx" style="--d:.6s" x="100" y="122" width="860" height="66" fill="#B8001A"/><text class="a-fade" style="--d:1.1s" x="125" y="163" fill="#fff">2. SUBSTITUER / combattre à la source</text><text class="a-fade" style="--d:1.2s" x="940" y="163" text-anchor="end" fill="#FFD200" font-size="16">solvant moins toxique, outil moins bruyant</text></g>
    <g><rect class="a-growx" style="--d:.9s" x="100" y="204" width="760" height="66" fill="#141414"/><text class="a-fade" style="--d:1.4s" x="125" y="245" fill="#fff">3. PROTECTION COLLECTIVE</text><text class="a-fade" style="--d:1.5s" x="840" y="245" text-anchor="end" fill="#FFD200" font-size="16">capotage, aspiration, garde-corps</text></g>
    <g><rect class="a-growx" style="--d:1.2s" x="100" y="286" width="660" height="66" fill="#6C6A63"/><text class="a-fade" style="--d:1.7s" x="125" y="327" fill="#fff">4. ORGANISATION &amp; FORMATION</text><text class="a-fade" style="--d:1.8s" x="740" y="327" text-anchor="end" fill="#FFD200" font-size="16">effectifs, rythmes, rotation</text></g>
    <g><rect class="a-growx" style="--d:1.5s" x="100" y="368" width="520" height="66" fill="#FFD200"/><text class="a-fade" style="--d:2s" x="125" y="409" fill="#141414">5. EPI &amp; consignes</text><text class="a-fade" style="--d:2.1s" x="600" y="409" text-anchor="end" fill="#E2001A" font-size="16">dernier recours</text></g>
  </g>
  <g class="a-pop" style="--d:2.4s"><circle cx="1000" cy="401" r="40" fill="none" stroke="#E2001A" stroke-width="4"/><circle class="a-pulse" style="--d:2.4s" cx="1000" cy="401" r="40" fill="none" stroke="#E2001A" stroke-width="3"/><text x="1000" y="397" text-anchor="middle" class="t-ui" font-size="14" fill="#E2001A">EPI seuls</text><text x="1000" y="415" text-anchor="middle" class="t-ui" font-size="14" fill="#E2001A">= alerte</text></g>
</svg>`,
  notes:"<b>Un outil de négociation très concret (schéma animé).</b> Les barres apparaissent de la mesure la plus efficace (supprimer) à la moins efficace (EPI et consignes). <b>Niveau 1</b> : supprimer le danger (retirer un produit CMR, supprimer une manutention par un convoyeur). <b>Niveau 2</b> : substituer ou agir à la source (produit moins toxique, machine moins bruyante). <b>Niveau 3</b> : protection collective (capotage, aspiration à la source, garde-corps). <b>Niveau 4</b> : organisation et formation (effectifs, rotation, pauses, rythmes). <b>Niveau 5</b> : EPI et consignes. Un EPI mal adapté, inconfortable ou non porté laisse le salarié sans protection : c'est la limite fondamentale de ce niveau. <span class='cgt'>Quand l'employeur ne propose que des EPI, il saute quatre étages. Question à poser en CSE : « Avez-vous étudié la suppression ou la substitution ? Pouvez-vous démontrer qu'elles sont impossibles ? ». Cette exigence est fondée sur L.4121-2 et elle est recevable devant l'inspection du travail.</span> <span class='ref'>Réf. L.4121-2 CT ; R.4321-1 et s. (équipements de travail) ; R.4323-91 et s. (EPI).</span>"},

{type:"content", title:"Le plan d'action — PAPRIPACT",
  kicker:"Programme annuel de prévention des risques professionnels et d'amélioration des conditions de travail",
  bullets:[
    "Décline le DUERP en mesures concrètes : <b>quoi · qui · délai · budget · indicateur</b>",
    "Obligatoire dans les entreprises d'au moins <b>50 salariés</b> ; liste d'actions en dessous",
    "<b>Présenté au CSE</b> lors de la consultation annuelle sur la politique sociale",
    "Le CSE peut proposer un <b>ordre de priorité</b> et des actions supplémentaires",
    "Un risque identifié et non traité est un élément de <b>faute inexcusable</b> en cas d'AT"
  ],
  notes:"<b>Le PAPRIPACT : un engagement écrit et daté de l'employeur.</b> Il fixe la liste détaillée des mesures pour l'année, leurs conditions d'exécution, des indicateurs de résultat, l'estimation de leur coût, les ressources mobilisées et le calendrier. Il est présenté au CSE dans le cadre de la consultation sur la politique sociale ; le CSE peut proposer un ordre de priorité et des mesures supplémentaires. <span class='cgt'>Conserver tous les plans des années précédentes. Si un accident survient sur un risque inscrit dans un plan non réalisé, l'argument est imparable : « l'employeur savait, il avait même prévu d'agir, et il n'a rien fait ». Tactique : émettre un avis motivé (négatif si besoin) sur un plan insuffisant, proposer des amendements chiffrés et datés, et faire du suivi du plan un point permanent de l'ordre du jour.</span> <span class='ref'>Réf. L.4121-3-1 CT (loi du 2 août 2021) ; L.2312-27 (consultation sur la politique sociale).</span>"},

/* ═══ PARTIE 5 — RÔLE DU CSE & DROITS MILITANTS ═══ */
{type:"divider", kicker:"Partie 5",
  title:["Rôle du CSE", "& droits militants"],
  lede:"Droit d'alerte, enquêtes, expertise, négociation — les leviers syndicaux",
  notes:"<b>Les outils pour obliger l'employeur à agir.</b> Cette partie présente les prérogatives concrètes des élus et la manière de s'en servir. <span class='cgt'>Ces droits sont réels mais sous-utilisés : beaucoup d'élus ne savent pas où se trouve le registre d'alerte, n'ont jamais demandé d'expertise ni mené d'enquête. L'objectif est que chacun reparte en sachant les activer.</span>"},

{type:"content", title:"Les droits du CSE en santé-sécurité",
  kicker:"Pouvoirs réels, souvent sous-utilisés",
  bullets:[
    "<b>Droit d'alerte pour danger grave et imminent</b> — tout élu le déclenche seul, par écrit dans le registre spécial",
    "<b>Inspections des lieux de travail</b> — à une fréquence au moins égale à celle des réunions SSCT (4 par an minimum à partir de 50 salariés)",
    "<b>Enquêtes</b> après accident du travail ou maladie professionnelle",
    "<b>Expertise</b> en cas de risque grave constaté ou de projet important modifiant les conditions de travail",
    "<b>Consultation</b> sur tout projet important modifiant les conditions de santé, de sécurité ou de travail"
  ],
  notes:"<b>L'arsenal du CSE — connaître chaque outil.</b> (1) <b>Alerte DGI</b> : droit individuel de chaque élu, sans vote préalable (détaillé plus loin). (2) <b>Inspections</b> : fréquence au moins égale à celle des réunions consacrées à la santé-sécurité, soit au moins 4 par an dans les entreprises d'au moins 50 salariés. (3) <b>Enquêtes</b> en matière d'AT et de MP. (4) <b>Expertise</b> : pour risque grave, identifié et actuel, révélé ou non par un accident — financée à 100 % par l'employeur ; pour projet important — financée à 80 % par l'employeur. L'expert est habilité (certifié). (5) <b>Consultation</b> préalable sur tout projet important (réorganisation, nouvelles technologies, déménagement, changement d'horaires). <span class='cgt'>L'expertise pour risque grave est un outil puissant et méconnu : elle permet un diagnostic indépendant payé par l'employeur, par exemple face à une vague de TMS, de burn-out ou d'arrêts maladie. Le délibérer en séance, avec des faits précis consignés au PV.</span> <span class='ref'>Réf. L.2312-13, L.4131-2, L.2312-8 CT ; L.2315-94 et L.2315-80 (expertise et financement) ; L.2315-27 (réunions SSCT).</span>"},

{type:"two", title:"Droit de retrait et droit d'alerte — deux outils distincts",
  kicker:"Articles L.4131-1 et L.4131-2 du Code du travail",
  a:{h:"Droit de retrait (L.4131-1)",t:"<b>Tout salarié</b> alerte l'employeur et peut se retirer d'une situation dont il a un motif raisonnable de penser qu'elle présente un danger grave et imminent. Pas d'accord nécessaire. Aucune sanction ni retenue de salaire (L.4131-3)."},
  b:{h:"Droit d'alerte du CSE (L.4131-2)",t:"<b>Tout membre du CSE</b> qui constate un danger grave et imminent alerte l'employeur et consigne l'alerte par écrit dans le registre spécial. L'employeur doit enquêter immédiatement avec lui.",style:"black"},
  notes:"<b>Ne pas confondre les deux dispositifs.</b> Le <b>droit de retrait</b> appartient à chaque salarié : il prévient l'employeur et se retire, sans attendre d'autorisation, s'il a un motif raisonnable de penser que la situation présente un danger grave et imminent pour sa vie ou sa santé. Il ne peut être ni sanctionné ni privé de salaire ; la seule limite est l'abus (danger manifestement inexistant). Le <b>droit d'alerte</b> appartient à chaque élu du CSE : il consigne par écrit le danger constaté et déclenche une procédure qui oblige l'employeur à enquêter et à agir. Les deux se combinent souvent : le salarié se retire et prévient un élu, qui consigne l'alerte. <span class='cgt'>Erreur fréquente des directions : prétendre que le retrait exige leur accord, ou menacer de retenues. C'est faux. Autre point essentiel : si un accident survient alors que le risque avait été signalé par un salarié ou un élu, la faute inexcusable de l'employeur est de droit (L.4131-4).</span> <span class='ref'>Réf. L.4131-1 à L.4131-4 ; L.4132-1 à L.4132-5 CT.</span>"},

{type:"svg", kicker:"Procédure du danger grave et imminent", title:"Le droit d'alerte du CSE, pas à pas",
  caption:"L'élu ne retire pas lui-même les salariés : il déclenche une procédure qui oblige l'employeur à agir, sous le contrôle de l'inspection du travail.",
  svg:`<svg viewBox="0 0 1100 470" role="img" aria-label="Procédure du droit d'alerte DGI">

  </g>
  <g fill="#141414" class="a-fade" style="--d:2.6s"><path d="M268 120 l-14 -8 v16z"/><path d="M518 120 l-14 -8 v16z"/><path d="M768 120 l-14 -8 v16z"/><path d="M610 248 l-8 -14 h16z"/><path d="M452 300 l14 -8 v16z"/><path d="M242 300 l14 -8 v16z"/></g>
  <g class="t-ui" font-size="16" text-anchor="middle">
    <g class="a-pop" style="--d:.1s"><rect x="15" y="75" width="190" height="90" rx="8" fill="#E2001A"/><text x="110" y="113" fill="#fff">1. L'élu constate</text><text x="110" y="137" fill="#fff">un danger grave</text></g>

</svg>`,
  notes:"<b>La procédure, étape par étape (schéma animé).</b> (1) Un élu constate, notamment par l'intermédiaire d'un salarié, une cause de danger grave et imminent. (2) Il alerte immédiatement l'employeur et consigne l'avis par écrit dans le registre spécial, daté et signé : nature du danger, postes concernés, noms des salariés exposés. (3) L'employeur procède <b>immédiatement</b> à une enquête avec l'élu et prend les mesures nécessaires. (4) En cas de désaccord sur la réalité du danger ou les mesures, le CSE est réuni d'urgence dans les 24 heures ; l'inspection du travail et l'agent de la CARSAT en sont informés et peuvent assister à la réunion. (5) À défaut d'accord, l'inspecteur du travail est saisi immédiatement : il peut mettre l'employeur en demeure ou saisir le juge des référés. <span class='cgt'>Ne jamais retirer une alerte sous la pression. Vérifier que le registre spécial existe, qu'il est accessible et que tous les élus savent où il se trouve. Rédiger l'alerte de façon factuelle et précise : c'est un document qui pourra être produit devant un tribunal.</span> <span class='ref'>Réf. L.4131-2 ; L.4132-2 à L.4132-4 ; D.4132-1 et D.4132-2 (registre) ; L.4732-1 (référé).</span>"},

{type:"callout", title:"La formation SSCT des élus",
  kicker:"Un droit, pas un bonus",
  mode:"black",
  big:"5 jours au premier mandat",
  sub:"Tous les membres de la délégation du personnel du CSE bénéficient d'une formation en santé, sécurité et conditions de travail. Renouvellement : 3 jours (5 jours pour les membres de la CSSCT dans les entreprises d'au moins 300 salariés). Financée par l'employeur, sur le temps de travail.",
  notes:"<b>Faire valoir le droit à la formation SSCT dès le début du mandat.</b> Depuis la loi du 2 août 2021, tous les élus du CSE (et plus seulement ceux de l'ancienne CSSCT) y ont droit : au moins 5 jours lors du premier mandat ; au moins 3 jours en cas de renouvellement, portés à 5 jours pour les membres de la CSSCT dans les entreprises d'au moins 300 salariés. La formation est prise en charge par l'employeur (dans les entreprises de moins de 50 salariés, elle peut être financée par l'OPCO), se déroule sur le temps de travail et n'est pas imputée sur les heures de délégation. L'organisme est choisi par l'élu parmi les organismes agréés ou certifiés. <span class='cgt'>Un élu non formé est un élu moins efficace pour protéger les salariés : l'employeur ne peut pas refuser au motif du coût ou de la charge de travail. Les centres de formation de la CGT dispensent cette formation : orienter les élus vers l'UD ou le comité régional pour s'inscrire.</span> <span class='ref'>Réf. L.2315-18 et R.2315-9 et s. CT.</span>"},

{type:"content", title:"L'enquête après accident — rôle du CSE",
  kicker:"Article L.2312-13 du Code du travail",
  bullets:[
    "Le CSE réalise des <b>enquêtes en matière d'AT et de MP</b> ou de maladies à caractère professionnel",
    "Une délégation du CSE mène l'enquête avec un représentant de l'employeur",
    "Méthode : <b>arbre des causes</b>, recherche des causes organisationnelles",
    "Le temps passé aux enquêtes après un AT grave ou des incidents répétés est payé comme du temps de travail, <b>sans s'imputer</b> sur les heures de délégation",
    "Les conclusions sont présentées au CSE et débouchent sur un <b>plan d'action</b> intégré au DUERP"
  ],
  notes:"<b>L'enquête : un droit qui protège et qui construit la preuve.</b> En pratique : (1) se rendre sur les lieux dans les 24 à 48 heures, avant que tout soit remis en ordre ; (2) recueillir des témoignages écrits et datés ; (3) photographier le poste et le matériel ; (4) construire l'arbre des causes sans désigner de coupable ; (5) proposer des mesures avec responsable et délai. Le temps passé aux enquêtes après un accident grave ou des incidents répétés ayant révélé un risque grave n'est pas déduit des heures de délégation. <span class='cgt'>Si l'employeur refuse l'enquête commune, l'accès au lieu ou la communication des informations : le consigner, adresser un courrier recommandé et saisir l'inspection du travail. Chaque enquête établit que l'employeur connaissait le risque — et s'il s'est ou non engagé à le corriger. Penser aussi aux intérimaires et aux salariés d'entreprises extérieures victimes d'un accident sur le site : le CSE de l'entreprise utilisatrice est compétent.</span> <span class='ref'>Réf. L.2312-13, L.2315-11 CT ; R.4511-1 et s. (entreprises extérieures).</span>"},

{type:"content", title:"La négociation sur la prévention",
  kicker:"Les obligations de négocier — levier CGT",
  bullets:[
    "<b>Égalité professionnelle et qualité de vie et des conditions de travail (QVCT)</b> — négociation obligatoire dans les entreprises dotées d'un délégué syndical",
    "<b>Accord de prévention des effets de l'exposition aux risques professionnels</b> — entreprises d'au moins 50 salariés exposant au moins 25 % de leurs effectifs, ou à forte sinistralité",
    "<b>Droit d'expression</b> des salariés sur leurs conditions de travail",
    "Exiger des <b>indicateurs chiffrés</b> : taux de fréquence, taux de gravité, maladies professionnelles, actions réalisées",
    "Inscrire des <b>engagements opposables</b> : effectifs, cadences, investissements, formation"
  ],
  notes:"<b>La prévention comme terrain de négociation collective.</b> (1) La négociation <b>égalité professionnelle et QVCT</b> (L.2242-17) peut porter sur l'articulation des temps, le droit à la déconnexion, la prévention des risques, les conditions de travail. (2) L'<b>accord de prévention des effets de l'exposition à certains facteurs de risques</b> (manutentions, postures, vibrations, bruit, travail de nuit, etc.) est obligatoire dans les entreprises d'au moins 50 salariés lorsque 25 % au moins des salariés sont exposés ou que la sinistralité AT/MP dépasse un seuil ; à défaut, pénalité. <span class='cgt'>Sans indicateurs chiffrés, pas de suivi ni de sanction possible : exiger des clauses quantitatives (réduction du taux de fréquence, recrutements sur les postes en tension, investissements datés). Rappeler la revendication CGT : rétablir dans le compte pénibilité (C2P) les facteurs supprimés en 2017 (manutentions, postures pénibles, vibrations, agents chimiques dangereux).</span> <span class='ref'>Réf. L.2242-17 CT ; L.4162-1 et D.4162-1 et s. (accord de prévention) ; L.2281-1 (droit d'expression).</span>"},

/* ═══ PARTIE 6 — OUTILS & MÉTHODES PRATIQUES ═══ */
{type:"divider", kicker:"Partie 6",
  title:["Outils pratiques", "pour militants"],
  lede:"Indicateurs, grille d'inspection, ressources",

{type:"content", title:"Les indicateurs à suivre au CSE",
  kicker:"Mesurer pour agir",
  bullets:[
    "<b>Taux de fréquence</b> = AT avec arrêt × 1 000 000 ÷ heures travaillées — à comparer à la branche",
    "<b>Taux de gravité</b> = journées perdues × 1 000 ÷ heures travaillées",
    "<b>Maladies professionnelles</b> déclarées, reconnues, refusées",
    "<b>Absentéisme</b> : maladie, AT, MP, longues maladies — par service",

  ],
  strip:"Exiger ces indicateurs à chaque réunion consacrée à la santé-sécurité. Les comparer à la branche (données CARSAT).",
  notes:"<b>Les indicateurs et leur usage syndical.</b> Le <b>taux de fréquence</b> mesure le nombre d'accidents avec arrêt par million d'heures travaillées ; le <b>taux de gravité</b> mesure le nombre de journées perdues pour 1 000 heures travaillées ; l'<b>indice de fréquence</b> rapporte les accidents à 1 000 salariés. S'y ajoutent les maladies professionnelles, l'absentéisme par service, le turn-over, les inaptitudes. <span class='cgt'>Comparer les taux de l'entreprise avec ceux de la branche (statistiques de l'Assurance Maladie par code risque, compte AT/MP de l'employeur sur net-entreprises) : un taux supérieur à la moyenne est un argument fort pour exiger un plan renforcé, voire une expertise. Attention aux indicateurs « trop beaux » : une baisse des accidents déclarés peut cacher une sous-déclaration (primes « zéro accident », pressions, postes aménagés pour éviter les arrêts).</span> <span class='ref'>Réf. L.2312-27 (consultation sur la politique sociale) ; L.2312-36 (BDESE).</span>"},

{type:"content", title:"La grille d'inspection des lieux",
  kicker:"Préparer · observer · écrire · suivre",
  bullets:[
    "<b>Préparer</b> : DUERP, accidents récents, alertes et inspections précédentes",
    "Observer le <b>travail réel</b>, pas les procédures affichées ; parler aux salariés",
    "<b>Photographier</b> les situations à risque (avec l'accord des salariés présents)",
    "Rédiger un <b>compte rendu écrit</b> remis à l'employeur, avec demande de réponse datée",
    "<b>Suivre</b> les actions correctives à l'inspection suivante"
  ],
  notes:"<b>L'inspection : méthode et rigueur.</b> Organiser l'inspection en binôme (élu + salarié du secteur), avec une grille par famille de risques. Points à vérifier : sols et circulations, éclairage, bruit, ambiances thermiques, stockage et étiquetage des produits chimiques (fiches de données de sécurité accessibles), état et adaptation des équipements de travail, protections collectives, EPI disponibles et adaptés, issues de secours, sanitaires et vestiaires, affichages obligatoires, et surtout l'organisation (effectifs, cadences, aléas). <span class='cgt'>Une inspection sans écrit ne laisse aucune trace. Le compte rendu, transmis de façon traçable et inscrit à l'ordre du jour du CSE suivant, prouve que l'employeur a été informé du risque. En cas d'accident ultérieur, c'est une pièce maîtresse du dossier de faute inexcusable.</span> Fréquence : au moins aussi souvent que les réunions SSCT, et après chaque accident ou incident grave. <span class='ref'>Réf. L.2312-13 CT.</span>"},

{type:"quiz", title:"Quiz — Droits du CSE",
  q:"L'employeur refuse d'inscrire le point « mise à jour du DUERP » à l'ordre du jour du CSE, au motif que c'était fait l'an dernier. Quelle est la bonne réponse ?",
  opts:[{k:"A",t:"Accepter : l'employeur fixe seul l'ordre du jour"},{k:"B",t:"Saisir directement l'inspection du travail sans passer par le CSE"},{k:"C",t:"Demander une réunion extraordinaire sur ce seul sujet"},{k:"D",t:"L'ordre du jour est arrêté conjointement par le président et le secrétaire : le secrétaire peut y inscrire ce point"}],
  ans:3,
  explain:"L'ordre du jour est arrêté conjointement par le président et le secrétaire du CSE ; les consultations rendues obligatoires par la loi y sont inscrites de plein droit. Le DUERP doit en outre être mis à jour au moins chaque année (≥ 11 salariés).",
  notes:"<b>Un cas très fréquent.</b> Rappeler que l'ordre du jour n'est pas la propriété du président : il est établi conjointement avec le secrétaire, et les consultations obligatoires y sont inscrites de plein droit. La réponse C n'est pas fausse en soi (une réunion supplémentaire peut être demandée par la majorité des élus), mais ce n'est pas le premier levier. <span class='cgt'>Connaître L.2315-29 et L.2312-27 : la santé-sécurité n'est pas un sujet que l'employeur peut écarter de l'ordre du jour.</span> <span class='ref'>Réf. L.2315-29, L.2315-28, L.2312-27 CT ; R.4121-2.</span>"},

{type:"quiz", title:"Quiz — Cas pratique",
  q:"Lors d'une inspection, vous constatez que 3 salariés travaillent sans protection auditive dans un atelier bruyant (> 85 dB). Le DUERP mentionne le risque avec la mention « EPI distribués ». Que faites-vous ?",
  opts:[{k:"A",t:"Rappeler que les EPI sont le dernier recours et exiger une étude de réduction du bruit à la source et une protection collective"},{k:"B",t:"C'est réglé : le risque est identifié et des EPI ont été distribués"},{k:"C",t:"Demander une sanction contre les salariés qui ne portent pas leurs EPI"},{k:"D",t:"Déclencher immédiatement un droit d'alerte DGI"}],
  ans:0,
  explain:"La distribution d'EPI ne dispense pas l'employeur de réduire le bruit à la source (à partir de 85 dB, un programme de réduction est obligatoire). Le non-port est un symptôme : EPI inadaptés, inconfortables, salariés non formés.",
  notes:"<b>Ancrer la hiérarchie des mesures.</b> Au-delà de 85 dB(A), l'employeur doit établir et mettre en œuvre un programme de mesures techniques et organisationnelles pour réduire l'exposition, et le port des protecteurs devient obligatoire. Le bruit ne constitue pas, en général, un danger « imminent » justifiant une alerte DGI (réponse D), mais un risque grave à traiter dans le plan d'action. <span class='cgt'>Ne jamais tomber dans le piège de la sanction (réponse C) : se demander pourquoi les EPI ne sont pas portés (inconfort, communication impossible, chaleur, absence de formation). Exiger encoffrement, capotage, traitement acoustique, rotation, et audiogrammes dans le suivi médical.</span> <span class='ref'>Réf. R.4431-1 et s. CT (bruit).</span>"},

{type:"case", title:"Mise en situation — Inspection de l'entrepôt Logisud",
  scenario:"Logisud, entrepôt logistique de 60 salariés (colis, picking, chariots élévateurs). Vous êtes élus du CSE et venez de réaliser une inspection. Constats : sol fissuré et gras dans la zone chariots ; bruit estimé à 87 dB sans protections disponibles ; produits de nettoyage stockés sans fiches de données de sécurité ; éclairage défaillant dans 2 allées ; 3 postes de picking à 280 colis/h (4 signalements de TMS en 6 mois). Le DUERP date de 2021 et ne mentionne ni le bruit ni le risque chimique. Le PAPRIPACT 2023 prévoyait « amélioration de l'éclairage » : rien n'a été fait.",
  questions:["Groupe A — Classez les risques observés par famille, cotez leur criticité (fréquence × gravité) et retenez 3 priorités pour le DUERP.","Groupe B — Rédigez les points essentiels d'un PAPRIPACT : pour chaque risque prioritaire, une mesure (selon la hiérarchie de prévention), un responsable, un délai.","Groupe C — Préparez l'argumentaire CSE : comment présenter ces constats ? Quels droits activer si l'employeur refuse d'agir ? Quel rôle pour l'inspection du travail et la CARSAT ?"],
  minutes:25,
  notes:"<b>Atelier en 3 groupes (15 min) + restitution (10 min).</b> Chaque groupe a un angle différent : restitution croisée en plénière. <b>Groupe A — éléments de corrigé :</b> bruit (87 dB : au-delà de 85 dB, programme de réduction et port obligatoire), TMS (cadence + gestes répétitifs : priorité haute), chimique (absence de FDS : infraction), mécanique (sol, éclairage, circulation des chariots). <b>Groupe B — PAPRIPACT :</b> bruit : mesurage sous 30 jours, traitement acoustique et encoffrement sous 90 jours, protections immédiates ; TMS : étude de poste avec le médecin du travail, révision des cadences, rotation ; chimique : FDS et étiquetage sous 48 h, inventaire et substitution ; sol et éclairage : travaux datés. <b>Groupe C — argumentaire :</b> compte rendu d'inspection transmis par écrit, inscription à l'ordre du jour, délai de réponse, saisine de l'inspection et demande de visite CARSAT sans réponse ; expertise pour risque grave sur les TMS si nécessaire. <span class='cgt'>Point fort : le PAPRIPACT 2023 non réalisé prouve que l'employeur connaissait le risque d'éclairage. Le faire acter au PV et demander des explications : en cas d'accident, c'est un élément décisif.</span>"},

{type:"content", title:"Synthèse — les réflexes du militant prévention",
  kicker:"Ce que vous pouvez faire dès demain",
  bullets:[
    "<b>Demander le DUERP</b> et le plan d'action — s'ils sont absents ou anciens : consigner et saisir l'inspection",

  strip:"La prévention n'est pas un sujet technique réservé aux experts : c'est un terrain d'action syndicale à part entière.",
  notes:"<b>Six réflexes à activer dès le retour en entreprise.</b> (1) Demander par écrit le DUERP et le plan d'action au prochain CSE. (2) Programmer une inspection dans le mois, avec grille, photos et compte rendu. (3) Exiger d'être prévenu de chaque accident pour enquêter à chaud. (4) Opposer la hiérarchie des mesures à toute réponse « EPI ». (5) Faire du suivi du plan d'action un point permanent. (6) Vérifier où se trouve le registre d'alerte et former tous les élus. <span class='cgt'>Message de fin : agir en prévention, c'est à la fois protéger les salariés aujourd'hui et construire la preuve si l'employeur n'agit pas. Chaque inspection écrite, chaque alerte consignée, chaque plan suivi renforce la position des salariés. La prévention syndicale CGT est une protection immédiate et une stratégie de long terme.</span> <b>Tour de table :</b> chacun énonce un engagement concret pour les 30 prochains jours."},

let cur=0, timerInt=null, timerSec=0, timerRunning=false;
const deck=document.getElementById('deck');
const notesEl=document.getElementById('notes');
const notesBody=notesEl.querySelector('.nbody');
const countEl=document.getElementById('count');
const barFill=document.querySelector('#bar i');
const ovEl=document.getElementById('ov');

const inkTools=document.getElementById('inktools');
