<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CGT · Recours & contestations face à la CPAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E2001A; --red-d:#A60012; --yellow:#FFD200; --ink:#141414;
  --paper:#FBFAF6; --card:#F1EFE8; --line:#E4E0D4; --muted:#6C6A63; --white:#fff;
  --disp:'Anton', 'Arial Narrow', Impact, sans-serif;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0c;color:var(--ink);font-family:var(--body)}
body{-webkit-font-smoothing:antialiased}
#deck{position:fixed;top:0;right:0;bottom:0;left:0}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;
  padding:3.5vh 7vw;opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;
  transform:translateY(14px) scale(.995);transition:opacity .45s ease, transform .45s ease;
  background:var(--paper);
  background-image:radial-gradient(rgba(20,20,20,.035) 1px, transparent 1px);background-size:22px 22px;}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:2}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--red)}
.slide.dark::before{background:var(--yellow)}
.kicker{font-family:var(--ui);font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:clamp(11px,1.25vw,18px);color:var(--red);margin-bottom:1.4vh;display:flex;align-items:center;gap:.8em}
.kicker .dot{width:.6em;height:.6em;background:var(--yellow);display:inline-block;transform:rotate(45deg)}
h1,h2{font-family:var(--disp);font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.title{font-size:clamp(34px,6.2vw,104px);color:var(--ink)}
.title .em{color:var(--red)}
.lede{font-size:clamp(15px,1.9vw,26px);max-width:64ch;margin-top:1.6vh;color:#2b2b2b}
.foot{font-family:var(--ui);font-weight:700;color:var(--red);margin-top:auto;font-size:clamp(14px,1.6vw,22px);
  text-transform:uppercase;letter-spacing:.12em}
.slide.active .reveal{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.slide.active .reveal:nth-child(2){animation-delay:.06s}
.slide.active .reveal:nth-child(3){animation-delay:.12s}
.slide.active .reveal:nth-child(4){animation-delay:.18s}
.slide.active .reveal:nth-child(5){animation-delay:.24s}
.slide.active .reveal:nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.s-title .title{font-size:clamp(40px,7.4vw,128px)}
.s-title .accent{height:14px;width:min(42vw,520px);background:var(--yellow);margin:3vh 0}
.slide.s-divider{background:var(--ink);color:var(--white);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.s-divider .kicker{color:var(--yellow)}
.s-divider .title{color:var(--yellow);font-size:clamp(40px,8vw,132px)}
.s-divider .lede{color:#e8e8e8}
.s-divider .barline{height:10px;width:min(36vw,440px);background:var(--red);margin-top:3vh}
.bullets{list-style:none;margin-top:1.2vh;display:flex;flex-direction:column;gap:.85vh;max-width:76ch}
.bullets li{position:relative;padding-left:1.3em;font-size:clamp(14px,1.6vw,22px);line-height:1.45}
.bullets li::before{content:"";position:absolute;left:0;top:.52em;width:.55em;height:.55em;background:var(--red);transform:rotate(45deg)}
/* Densité : 5–6 bullets */
.bullets.md{gap:.6vh;max-width:80ch}
.bullets.md li{font-size:clamp(13px,1.42vw,20px);line-height:1.4}
/* Densité : 7+ bullets → 2 colonnes */
.bullets.dense{display:grid;grid-template-columns:1fr 1fr;gap:.65vh 2.5vw;max-width:100ch;margin-top:1vh;align-items:start}
.bullets.dense li{font-size:clamp(12px,1.28vw,18px);line-height:1.35}
.note-strip{margin-top:1.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:.8vh 1.4vw;font-size:clamp(12px,1.3vw,17px);max-width:80ch;border-left:8px solid var(--yellow);line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;margin-top:3vh}
.stat{background:var(--white);border:1px solid var(--line);border-top:7px solid var(--red);
  padding:3vh 1.4vw;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.stat .num{font-family:var(--disp);color:var(--red);font-size:clamp(34px,5.6vw,92px);line-height:.9}
.stat .lab{font-family:var(--body);color:#2b2b2b;font-size:clamp(12px,1.3vw,19px);margin-top:1.4vh;line-height:1.25}
.source{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:2.4vh}
.steps{display:grid;gap:1.2vw;margin-top:2vh}
.steps.n3{grid-template-columns:repeat(3,1fr)} .steps.n4{grid-template-columns:repeat(4,1fr)}
.steps.n5{grid-template-columns:repeat(5,1fr)}
.steps.n5 .step{padding:1.4vh .9vw}
.steps.n5 .step .big{font-size:clamp(22px,3vw,50px)}
.steps.n5 .step .nm{font-size:clamp(11px,1.2vw,17px)}
.steps.n5 .step .ds{font-size:clamp(10px,1.1vw,15px)}
.step{background:var(--card);border:1px solid var(--line);padding:2vh 1.2vw;position:relative;
  transition:transform .25s ease, box-shadow .25s ease}
.step:hover{transform:translateY(-6px);box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.step .big{font-family:var(--disp);color:var(--red);font-size:clamp(26px,3.6vw,60px);line-height:.9}
.step .nm{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(13px,1.4vw,21px);margin-top:1.2vh}
.step .ds{font-size:clamp(12px,1.25vw,19px);color:#333;margin-top:.7vh;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;margin-top:1.6vh}
.tc{padding:1.8vh 1.6vw;border:1px solid var(--line);background:var(--card)}
.tc.red{background:var(--red);color:#fff;border-color:var(--red)}
.tc.black{background:var(--ink);color:#fff;border-color:var(--ink)}
.tc h3{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(17px,2.1vw,32px)}
.tc.red h3,.tc.black h3{color:var(--yellow)}
.tc.plain h3{color:var(--red)}
.tc p{font-size:clamp(13px,1.4vw,20px);margin-top:1.2vh;line-height:1.42}
.callout{margin-top:2vh;padding:3.5vh 2.5vw;display:flex;flex-direction:column;gap:1.4vh;max-width:82ch}
.callout.black{background:var(--ink)} .callout.red{background:var(--red)}
.callout .big{font-family:var(--disp);text-transform:uppercase;line-height:1;
  font-size:clamp(24px,3.6vw,58px)}
.callout.black .big{color:var(--yellow)} .callout.red .big{color:#fff}
.callout .sub{font-size:clamp(15px,1.8vw,26px)} .callout.black .sub{color:#fff} .callout.red .sub{color:#fff}
.defbox{margin-top:1.4vh;background:var(--card);border-left:12px solid var(--red);padding:1.8vh 2.2vw;max-width:84ch}
.defbox .term{font-family:var(--ui);font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(16px,1.9vw,28px)}
.defbox .txt{font-size:clamp(17px,2.1vw,30px);margin-top:1.4vh;line-height:1.3}
.defextra{margin-top:2.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1.4vh 1.6vw;border-left:8px solid var(--yellow);font-size:clamp(14px,1.6vw,23px);max-width:82ch}
.quiz-q{font-size:clamp(18px,2.4vw,36px);font-weight:600;margin-top:2vh;max-width:60ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3vh;max-width:90ch}
.opt{font-family:var(--ui);text-align:left;background:var(--white);border:2px solid var(--line);
  padding:1.8vh 1.4vw;font-size:clamp(14px,1.6vw,23px);cursor:pointer;transition:.2s;display:flex;gap:.7em;align-items:center}
.opt:hover{border-color:var(--ink);transform:translateY(-3px)}
.opt .k{font-weight:800;color:var(--red)}
.opt.good{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.opt.good .k{color:var(--ink)}
.opt.bad{opacity:.45;border-style:dashed}
.quiz-a{margin-top:2.4vh;font-family:var(--ui);font-weight:700;color:var(--red);
  font-size:clamp(14px,1.7vw,24px);opacity:0;transition:.3s}
.quiz-a.show{opacity:1}
.case-sc{background:var(--ink);color:#eee;border-left:5px solid var(--yellow);padding:1.4vh 1.8vw;
  font-size:clamp(13px,1.4vw,20px);margin-top:.8vh;max-width:96ch;line-height:1.45;border-radius:0 6px 6px 0;
  position:relative}
.case-sc::before{content:"Scénario";position:absolute;top:-1px;left:-1px;background:var(--yellow);color:var(--ink);
  font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;line-height:1.6}
.case-ctx{font-size:clamp(11px,1.05vw,14px);color:#6a8fa8;margin-top:.6vh;padding:.4vh 1vw;
  border-left:2px solid #334;max-width:96ch;line-height:1.5;font-style:italic;background:rgba(100,160,220,.05);border-radius:0 3px 3px 0}
.case-ctx::before{content:"Guide d'animation · ";font-weight:700;color:#4a7090;font-style:normal}
.case-q{margin-top:1.2vh;display:flex;flex-direction:column;gap:.7vh}
.case-q li{font-size:clamp(12px,1.35vw,19px) !important;list-style:none;padding:.5vh .8vw .5vh 2.8vw;
  background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);border-radius:5px;
  position:relative;line-height:1.3;color:var(--ink)}
.case-q li::before{content:none}
.case-q li .qi{position:absolute;left:.6vw;top:.45vh;font-family:var(--disp);color:var(--yellow);font-size:clamp(14px,1.5vw,21px);line-height:1}
.timer{display:flex;align-items:center;gap:1.2vw;margin-top:auto;padding-top:2.4vh}
.tmr-display{font-family:var(--disp);font-size:clamp(34px,5vw,80px);color:var(--ink);line-height:.9;min-width:3.4ch}
.tmr-display.run{color:var(--red)} .tmr-display.done{color:var(--red);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.25}}
.tbtn{font-family:var(--ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:2px solid var(--ink);background:var(--ink);color:#fff;padding:1.1vh 1.4vw;cursor:pointer;font-size:clamp(12px,1.2vw,17px)}
.tbtn.ghost{background:transparent;color:var(--ink)}
.tbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.slide.s-closing{background:var(--ink);color:#fff;justify-content:center}
.s-closing .title{color:var(--yellow);font-size:clamp(54px,11vw,180px)}
.s-closing .sub{font-size:clamp(16px,2vw,30px);color:#eee;margin-top:2vh}
.s-closing .contacts{font-family:var(--ui);color:#bbb;margin-top:3vh;font-size:clamp(13px,1.4vw,20px);line-height:1.6}
.s-closing::before{background:var(--red)}
.svgwrap{margin-top:2.2vh;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
.svgwrap svg{width:100%;max-width:1100px;max-height:72vh;height:auto;display:block}
.svgwrap text{font-family:var(--ui)}
#ink{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#inktools{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:58;display:none;gap:8px;
  background:rgba(18,18,18,.94);padding:9px;border-radius:14px;box-shadow:0 14px 40px -16px rgba(0,0,0,.6)}
#inktools.on{display:flex}
.it{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:#2a2a2a;color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:18px;font-family:var(--ui);font-weight:800;transition:.15s}
.it:hover{background:#3a3a3a}
.it.act{border-color:#fff;background:#000}
.it.pen{color:var(--red)} .it.hl{color:var(--yellow)}
#bar{position:fixed;top:0;left:0;height:6px;background:rgba(0,0,0,.12);width:100%;z-index:50}
#bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s ease}
.hud{position:fixed;z-index:50;font-family:var(--ui);font-weight:700}
#count{left:24px;bottom:18px;color:var(--muted);font-size:14px;letter-spacing:.1em}
#count b{color:var(--red)}
#ctrl{right:18px;bottom:14px;display:flex;gap:8px}
.cb{width:42px;height:42px;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
  border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:.2s;font-size:18px}
.cb:hover{background:var(--red);color:#fff;border-color:var(--red)}
#brand{position:fixed;right:26px;top:16px;z-index:50;font-family:var(--disp);font-size:24px;color:var(--red);letter-spacing:.02em;
  background:var(--yellow);padding:2px 10px 0;line-height:1.25}
/* notes */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,10,10,.97);color:#f4f4f4;
  transform:translateY(102%);transition:transform .35s cubic-bezier(.4,0,.2,1), height .25s ease;
  height:50vh;display:flex;flex-direction:column;
  border-top:3px solid var(--yellow);font-family:var(--ui);box-shadow:0 -8px 40px rgba(0,0,0,.6)}
#notes.show{transform:none}
#notes.mini{height:54px}
#notes.mini #notes-body{display:none}
#notes.mini #notes-min{transform:rotate(180deg)}

/* handle de drag pour resize */
#notes-handle{height:18px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
#notes-handle::before{content:"";width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#notes-handle:hover::before{background:var(--yellow)}

#notes-head{display:flex;align-items:center;gap:10px;padding:0 20px 10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
#notes-head .n-label{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;flex:1}
#notes-head .n-slide{color:#666;font-size:11px;font-weight:600;letter-spacing:.05em;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:3px}
.notes-btn{background:none;border:1.5px solid #3a3a3a;color:#aaa;width:28px;height:28px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;padding:0;line-height:1}
.notes-btn:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
#notes-close:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}

#notes-body{overflow-y:auto;padding:16px 22px 20px;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
#notes .nbody{font-family:var(--body,'Georgia',serif);font-size:clamp(14px,1.35vw,18px);line-height:1.75;max-width:110ch;color:#ccc}
#notes .nbody b{color:#fff;font-weight:700}
#notes .nbody br+b,#notes .nbody>b:first-child{display:inline-block;margin-top:1em;color:var(--yellow);font-size:.78em;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(255,210,0,.2);padding-bottom:.2em;width:100%}
#notes .nbody .cgt{color:#FFD200;font-weight:600;display:block;margin-top:.8em;padding:.6em 1em;background:rgba(255,210,0,.06);border-left:3px solid var(--yellow);border-radius:0 4px 4px 0;font-family:var(--ui);font-size:.92em;line-height:1.5}
#notes .nbody .ref{color:#7aabff;font-style:italic;font-size:.84em;display:inline-block;margin-top:.4em}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(12,12,12,.97);overflow:auto;padding:70px 5vw 60px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
#ov.show{display:grid}
.ovc{background:#1b1b1b;border:1px solid #2c2c2c;border-left:5px solid var(--red);padding:16px 16px 18px;cursor:pointer;
  color:#eaeaea;transition:.18s;min-height:120px;display:flex;flex-direction:column;gap:6px}
.ovc:hover{background:#262626;transform:translateY(-4px);border-left-color:var(--yellow)}
.ovc.div{border-left-color:var(--yellow);background:#000}
.ovc .n{font-family:var(--ui);font-weight:800;color:var(--red);font-size:12px;letter-spacing:.1em}
.ovc .k{font-family:var(--ui);font-weight:700;color:var(--yellow);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ovc .t{font-family:var(--disp);font-size:19px;line-height:1.02;text-transform:uppercase;color:#fff}
#ovhead{position:fixed;top:18px;left:5vw;z-index:71;color:#fff;font-family:var(--ui);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;font-size:13px;display:none}
#ov.show ~ #ovhead{display:block}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(10,10,10,.9);display:none;place-items:center}
#help.show{display:grid}
.helpcard{background:#fff;max-width:520px;width:90%;padding:34px 38px;border-top:10px solid var(--red)}
.helpcard h3{font-family:var(--disp);font-size:30px;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.helpcard dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-family:var(--ui);font-size:15px}
.helpcard dt{font-weight:800;color:var(--ink)}
.helpcard kbd{background:var(--ink);color:#fff;padding:2px 9px;border-radius:5px;font-family:var(--ui);font-size:13px}
.wordmark{font-family:var(--disp);background:var(--yellow);color:var(--red);padding:2px 10px 0;line-height:1.25;display:inline-block}
.logo-img{display:block;height:100%}
#brand.haslogo{background:transparent;padding:0;height:46px}
.lockup{display:flex;align-items:center;gap:16px;margin-bottom:2.4vh}
.lockup .wordmark{font-size:clamp(26px,3vw,40px)}
.lockup .logo-img{height:clamp(46px,6vw,84px)}
.s-title .lockup .logo-img{height:clamp(110px,15vh,190px)}
.s-closing .lockup .logo-img{height:clamp(90px,12vh,150px)}
#brand.haslogo{height:clamp(74px,9.5vh,112px)}
@media print{
  @page{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #bar,#ctrl,#brand,#count,#notes,#ov,#ovhead,#help,#spotlight,#inktools,#ink,#btn-print-float{display:none!important}
  #deck{position:static!important}
  .slide{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
    opacity:1!important;visibility:visible!important;transform:none!important;height:100vh!important;
    page-break-after:always;break-after:page}
  .reveal{animation:none!important;opacity:1!important;transform:none!important}
  .quiz-a{opacity:1!important}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr}
  .steps.n3,.steps.n4{grid-template-columns:1fr 1fr} .opts{grid-template-columns:1fr}
  .slide{padding:8vh 8vw}
}
/* ===== AMÉLIORATIONS V2 ===== */
/* 1. Timer circulaire */
.timer-ring{width:clamp(80px,10vw,120px);height:clamp(80px,10vw,120px);flex-shrink:0}
.timer-arc{transition:stroke-dashoffset 1s linear}
/* 3. Transitions directionnelles */
@keyframes slideOutLeft{to{opacity:0;transform:translateX(-60px) scale(.97)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOutRight{to{opacity:0;transform:translateX(60px) scale(.97)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px) scale(.97)}to{opacity:1;transform:none}}
.slide.leave-left{animation:slideOutLeft .38s cubic-bezier(.4,0,.2,1) forwards;z-index:3}
.slide.enter-right{animation:slideInRight .38s cubic-bezier(.4,0,.2,1) forwards}
.slide.leave-right{animation:slideOutRight .38s cubic-bezier(.4,0,.2,1) forwards;z-index:3}
.slide.enter-left{animation:slideInLeft .38s cubic-bezier(.4,0,.2,1) forwards}
/* 4. Divider animé */
.slide.s-divider{background:linear-gradient(135deg,#0a0a0a 0%,#1a0a0a 50%,#0a0a0a 100%);background-size:400% 400%;animation:divPulse 6s ease infinite}
@keyframes divPulse{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.s-divider .title::after{content:'';display:block;height:3px;background:var(--red,#E2001A);width:0;margin-top:.5rem;animation:lineGrow 1s .3s ease forwards}
.slide.active.s-divider .title::after{animation:lineGrow 1s .3s ease forwards}
@keyframes lineGrow{to{width:80px}}
/* 5. Spotlight laser */
#spotlight{position:fixed;inset:0;pointer-events:none;z-index:500;display:none}
#spotlight.on{display:block;background:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),transparent 0%,rgba(0,0,0,.75) 100%)}
/* 6. Barre numérotée */
#bar{overflow:visible}
#bar-num{position:absolute;right:8px;top:8px;background:var(--yellow);color:var(--ink);font-family:var(--ui);font-weight:800;font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;z-index:51;white-space:nowrap;letter-spacing:.04em;box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* 8. Print amélioré */
@media print{
  #spotlight,#bar-num{display:none!important}
}

/* ===== V3 : schémas animés, stagger étendu ===== */
.slide.active .reveal:nth-child(7){animation-delay:.36s}
.slide.active .reveal:nth-child(8){animation-delay:.42s}
.slide.active .reveal:nth-child(9){animation-delay:.48s}
.slide.active .reveal:nth-child(10){animation-delay:.54s}
.svgcap{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:1.2vh;max-width:90ch}
.s-svg .svgwrap{margin-top:1.6vh}
.s-svg .svgwrap svg{max-height:66vh}
.svgwrap .t-title{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em}
.svgwrap .t-ui{font-family:var(--ui);font-weight:700}
.svgwrap .t-body{font-family:var(--body)}
/* tracés qui se dessinent (pathLength="1") */
.slide .a-draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .a-draw{animation:drawLine .9s cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
/* éléments qui apparaissent */
.slide .a-pop{opacity:0;transform-box:fill-box;transform-origin:center}
.slide.active .a-pop{animation:popIn .55s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slide .a-fade{opacity:0}
.slide.active .a-fade{animation:fadeIn .6s ease var(--d,0s) forwards}
@keyframes fadeIn{to{opacity:1}}
/* barres qui grandissent */
.slide .a-growx{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.slide.active .a-growx{animation:growX .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growX{to{transform:scaleX(1)}}
.slide .a-growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0)}
.slide.active .a-growy{animation:growY .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growY{to{transform:scaleY(1)}}
/* pulsation d'un point d'attention */
.slide.active .a-pulse{animation:pulseRing 1.8s ease-out calc(var(--d,0s) + .6s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media print{
  .a-draw{stroke-dashoffset:0!important;animation:none!important}
  .a-pop,.a-fade{opacity:1!important;animation:none!important;transform:none!important}
  .a-growx,.a-growy{transform:none!important;animation:none!important}
  .a-pulse{display:none!important}
}

{type:"title",
  eyebrow:"Formation syndicale CGT Occitanie · Module AT/MP",
  title:["Recours &", "<span class='em'>contestations</span>", "face à la CPAM"],
  lede:"CRA, CMRA, pôle social, CRRMP, faute inexcusable : les délais, les procédures et les arguments juridiques pour défendre les victimes.",
  foot:"CGT Occitanie — Comité régional",
  notes:"<b>Poser l'enjeu : une décision de la CPAM n'est jamais une fin en soi.</b> Refus de reconnaissance d'un accident ou d'une maladie professionnelle, taux d'incapacité sous-évalué, consolidation trop précoce, rechute refusée : toutes ces décisions se contestent, dans des délais courts et selon des voies précises. Une erreur de voie ou un délai dépassé, et le droit est perdu. <b>Objectif du module :</b> savoir quel recours engager, dans quel délai, avec quels arguments ; savoir engager la faute inexcusable de l'employeur. <b>Question d'ouverture :</b> « Avez-vous déjà vu un collègue renoncer après un refus de la CPAM ? Pourquoi ? » (réponses fréquentes : découragement, méconnaissance des délais, peur du coût). <span class='cgt'>Fil rouge CGT : la contestation n'est pas une procédure réservée aux avocats. Les recours amiables sont gratuits, sans avocat obligatoire, et le syndicat peut accompagner la victime à chaque étape. Beaucoup de décisions défavorables sont réformées quand la victime conteste.</span> <span class='ref'>Ce module complète la formation AT/MP 2 jours. Toujours vérifier les délais indiqués sur la notification reçue.</span>"},

{type:"callout", mode:"red", kicker:"Le réflexe à installer", title:"Une décision de la CPAM se conteste",
  big:"2 mois. C'est le délai de droit commun pour contester. Après, c'est trop tard.",
  sub:"Le délai court à partir de la réception de la notification. La notification doit indiquer les voies et délais de recours : sinon, le délai ne court pas.",
  notes:"<b>Le délai : la première arme et le premier piège.</b> La plupart des recours (commission de recours amiable, commission médicale de recours amiable, tribunal) doivent être engagés dans les <b>2 mois</b> suivant la notification. Le délai court à compter de la <b>réception</b> du courrier (d'où l'importance de garder l'enveloppe et l'accusé de réception). <b>Argument juridique clé :</b> la notification doit mentionner les voies et délais de recours ; si elle ne le fait pas, ou de façon erronée, le délai n'est pas opposable à l'assuré (R.142-1 ; jurisprudence constante). <span class='cgt'>Réflexe syndical : dès qu'un salarié reçoit une décision défavorable, noter la date de réception, faire une copie, et préparer le recours sans attendre. En cas de doute sur la voie, il vaut mieux saisir dans le délai et se faire réorienter que de laisser passer le délai.</span> <span class='ref'>Réf. R.142-1 et R.142-1-A CSS.</span>"},

{type:"divider", kicker:"Partie 1", title:["Les voies", "de recours"], lede:"Quel recours pour quelle décision ?",
  notes:"<b>Cartographier les recours avant d'entrer dans les arguments.</b> Trois questions à se poser devant toute décision : (1) est-ce une décision <b>administrative</b> (refus de reconnaissance, montant d'indemnités, prescription) ou <b>médicale</b> (taux d'incapacité, date de consolidation, état de santé) ? (2) Quel est le délai ? (3) Quelles pièces réunir ? <span class='cgt'>Une erreur fréquente : contester une décision médicale devant la CRA, ou l'inverse. Ce n'est pas toujours fatal, mais cela fait perdre du temps : bien identifier la nature de la décision.</span>"},

  notes:"<b>La carte des recours (schéma animé).</b> <b>Décisions administratives</b> (refus de reconnaissance d'un AT, d'une MP, d'une rechute ; montant ou durée des indemnités ; refus après avis du CRRMP ; prescription opposée) : recours préalable obligatoire devant la <b>commission de recours amiable (CRA)</b> de la caisse, dans les 2 mois. Sans réponse dans les 2 mois, la demande est rejetée implicitement. <b>Décisions médicales</b> (taux d'incapacité permanente, date de consolidation ou de guérison, invalidité, justification médicale des soins et arrêts) : recours préalable obligatoire devant la <b>commission médicale de recours amiable (CMRA)</b>, dans les 2 mois ; elle dispose de 4 mois pour statuer, son silence vaut rejet. Depuis le 1er janvier 2022, l'ancienne « expertise médicale technique » a été supprimée : les litiges médicaux passent par la CMRA. <b>Ensuite :</b> pôle social du tribunal judiciaire dans les 2 mois de la décision de rejet (explicite ou implicite), puis appel (1 mois) et cassation (2 mois). <b>Faute inexcusable</b> : procédure à part (diapo dédiée). <span class='cgt'>Le recours amiable est gratuit et rapide : ne jamais s'en priver. Mais le préparer sérieusement, car le dossier constitué servira devant le tribunal.</span> <span class='ref'>Réf. L.142-4, R.142-1, R.142-6, R.142-8 et s., R.142-10-1 CSS ; art. 538 et 612 CPC.</span>"},

{type:"steps", kicker:"Les délais à retenir", title:"Le calendrier d'un recours",
  items:[
    {big:"2 mois",nm:"Saisir la CRA ou la CMRA",ds:"À compter de la réception de la notification. Lettre recommandée avec accusé de réception, ou en ligne."},
    {big:"2 / 4 mois",nm:"Réponse de la commission",ds:"CRA : silence de 2 mois = rejet. CMRA : 4 mois. On peut alors saisir le tribunal."},
    {big:"2 mois",nm:"Saisir le pôle social",ds:"À compter du rejet explicite ou implicite. Requête au greffe du tribunal judiciaire."},
    {big:"1 mois",nm:"Faire appel",ds:"À compter de la notification du jugement. Pourvoi en cassation : 2 mois."}
  ],
  notes:"<b>Un calendrier à afficher dans chaque local syndical.</b> (1) <b>2 mois</b> pour saisir la commission (CRA ou CMRA) : envoi recommandé avec accusé de réception ou dépôt en ligne sur le compte ameli, en gardant une preuve. (2) La CRA a <b>2 mois</b> pour répondre ; la CMRA, <b>4 mois</b> ; le silence vaut rejet et ouvre la voie du tribunal. (3) <b>2 mois</b> pour saisir le pôle social du tribunal judiciaire après le rejet ; la procédure est orale, gratuite (pas de frais de justice), l'avocat n'est pas obligatoire en première instance. (4) Appel : <b>1 mois</b> ; cassation : <b>2 mois</b>. <span class='cgt'>Tenir un échéancier pour chaque dossier suivi par le syndicat. Un délai manqué, c'est un droit perdu pour la victime. En cas de rejet implicite, ne pas attendre une réponse écrite qui ne viendra peut-être jamais : le délai de 2 mois pour saisir le tribunal court quand même.</span> <span class='ref'>Réf. R.142-1, R.142-6, R.142-8-5 et R.142-10-1 CSS ; procédure devant le pôle social : R.142-10 et s.</span>"},

{type:"content", kicker:"Méthode", title:"Rédiger un recours qui tient",
  bullets:[
    "<b>Identifier</b> la décision contestée : date, référence, objet",
    "<b>Exposer les faits</b> de façon chronologique, précise et vérifiable",
    "<b>Argumenter en droit</b> : présomption, conditions du tableau, irrégularités de procédure",
    "<b>Joindre les pièces</b> : certificats médicaux, témoignages, fiches de poste, DUERP, PV du CSE",
    "<b>Demander</b> clairement : reconnaissance, nouveau taux, nouvelle date, communication du dossier"
  ],
  strip:"Toujours demander la copie du dossier de la caisse et du rapport médical : on ne conteste bien que ce qu'on a lu.",
  notes:"<b>Un recours efficace tient en une ou deux pages bien construites.</b> (1) <b>Objet</b> : « recours contre la décision du … refusant la prise en charge de … ». (2) <b>Faits</b> : date, heure, lieu, circonstances, témoins, premiers soins, déclaration. (3) <b>Droit</b> : rappeler la règle (présomption d'imputabilité, conditions du tableau, délai de prise en charge) et montrer qu'elle s'applique ; relever les irrégularités de procédure (délais non respectés, dossier non communiqué). (4) <b>Pièces</b> numérotées. (5) <b>Demande</b> précise. <b>Pièces clés</b> : certificat médical initial et de prolongation, attestations de témoins (formulaire avec copie de pièce d'identité), fiche de poste, plannings, DUERP, comptes rendus d'inspection et PV du CSE, échanges écrits avec l'employeur. <span class='cgt'>Le dossier de la caisse est consultable : le demander systématiquement. Il contient souvent les réserves de l'employeur et le questionnaire qu'il a rempli, qu'il faut contredire point par point. Les documents produits par le CSE (alertes, inspections, enquêtes) sont des pièces précieuses.</span> <span class='ref'>Réf. R.441-14 et R.461-10 CSS (consultation du dossier) ; art. 202 CPC (attestations).</span>"},

{type:"two", kicker:"Deux commissions, deux logiques", title:"CRA ou CMRA ?",
  a:{h:"CRA — commission de recours amiable",t:"Composée d'administrateurs de la caisse (représentants des assurés et des employeurs). Examine les décisions <b>administratives</b> : reconnaissance, prestations, procédure. Silence de 2 mois = rejet.",style:"plain"},
  b:{h:"CMRA — commission médicale",t:"Composée de médecins. Examine les décisions <b>médicales</b> : taux d'incapacité, consolidation, guérison, invalidité. Peut examiner l'assuré. Le rapport médical est transmis au médecin désigné par l'assuré. Silence de 4 mois = rejet.",style:"black"},
  notes:"<b>Bien choisir la commission.</b> La <b>CRA</b> est une émanation du conseil de la caisse, où siègent des représentants des assurés désignés par les organisations syndicales : c'est un lieu où la qualité du dossier et l'argumentation juridique comptent. La <b>CMRA</b>, régionale, est composée de deux médecins (un médecin-conseil et un médecin expert indépendant) ; elle statue sur pièces et peut convoquer l'assuré. Point essentiel : l'assuré peut demander que le <b>rapport médical</b> (par exemple le rapport d'évaluation des séquelles) soit transmis au médecin qu'il désigne, pour préparer ses observations. <span class='cgt'>Devant la CMRA, le recours doit être médicalement argumenté : faire rédiger par le médecin traitant ou un spécialiste un courrier détaillé (séquelles, retentissement, traitements, pronostic). Les administrateurs CGT des caisses peuvent aussi éclairer sur le fonctionnement de la CRA locale.</span> <span class='ref'>Réf. R.142-1 à R.142-7 (CRA) ; L.142-6, R.142-8 à R.142-8-5 (CMRA) CSS.</span>"},

{type:"content", kicker:"Décisions médicales", title:"Contester le taux d'incapacité permanente",
  bullets:[
    "Le taux tient compte de la <b>nature des séquelles</b>, de l'état général, de l'âge, des facultés et des <b>aptitudes et qualification professionnelles</b> (L.434-2)",
    "Le barème est <b>indicatif</b> : le médecin-conseil doit motiver",
    "Revendiquer un <b>coefficient professionnel</b> en cas d'inaptitude, de perte d'emploi ou de déclassement",
    "Faire décrire par son médecin <b>toutes</b> les séquelles, y compris psychiques et douleurs",
    "Demander la <b>transmission du rapport médical</b> au médecin de son choix"
  ],
  strip:"Chaque point de taux compte : il détermine la rente versée à vie.",
  notes:"<b>Le taux d'incapacité est souvent sous-évalué — et il se conteste.</b> La loi impose de tenir compte non seulement des séquelles médicales mais aussi des <b>aptitudes et de la qualification professionnelles</b> : c'est le fondement du « taux professionnel » (ou coefficient socio-professionnel), qui s'ajoute au taux médical quand les séquelles entraînent une inaptitude, un licenciement, un déclassement ou une perte de revenus. Le barème indicatif d'invalidité AT/MP n'est qu'un guide : le médecin-conseil peut et doit s'en écarter en motivant. <b>Arguments à faire valoir :</b> séquelles oubliées (douleurs chroniques, limitation de mouvements, troubles psychiques, acouphènes), retentissement sur le métier, licenciement pour inaptitude intervenu depuis la consolidation. <span class='cgt'>Rappeler l'enjeu financier : avec la règle du taux utile, chaque point au-dessus de 50 % compte une fois et demie. Passer de 8 % (capital) à 10 % (rente à vie) change tout. Ne jamais laisser passer un taux qui ne tient pas compte de la perte d'emploi.</span> <span class='ref'>Réf. L.434-2, R.434-32 CSS et annexe I (barème indicatif) ; Cass. soc. jurisprudence constante sur le coefficient professionnel.</span>"},

{type:"content", kicker:"Décisions médicales", title:"Contester la consolidation, la guérison, une rechute",
  bullets:[
    "<b>Consolidation trop précoce</b> : les lésions ne sont pas stabilisées, des soins actifs sont en cours",
    "<b>Guérison</b> déclarée alors que des séquelles persistent : demander une consolidation avec séquelles",
    "<b>Rechute</b> : aggravation ou nouvelle lésion en lien avec l'accident initial, sur certificat médical",
    "<b>Nouvelle lésion</b> apparue avant consolidation : présomption d'imputabilité",
    "Recours devant la <b>CMRA</b> (2 mois), avec un avis médical argumenté"
  ],
  notes:"<b>Des décisions médicales lourdes de conséquences.</b> La <b>consolidation</b> marque la fin des indemnités journalières et l'évaluation des séquelles : fixée trop tôt, elle prive la victime d'indemnités et de soins pris en charge. La <b>guérison</b> sans séquelles écarte toute rente. La <b>rechute</b> (aggravation de la lésion ou apparition d'une nouvelle lésion résultant de l'accident après consolidation) rouvre les droits : IJ AT/MP, soins à 100 %, protection de l'emploi. <b>Arguments :</b> soins actifs en cours (rééducation, intervention prévue), avis du spécialiste, imagerie récente. Pour la rechute, il appartient à la victime de démontrer le lien avec l'accident initial : d'où l'importance d'un certificat médical précis. En revanche, pour les lésions apparues <b>avant</b> la consolidation, la présomption d'imputabilité s'applique. <span class='cgt'>Depuis 2022, ces contestations passent par la CMRA. Ne pas laisser un salarié reprendre le travail en force après une consolidation contestable sans avoir engagé le recours : organiser une visite de pré-reprise avec le médecin du travail.</span> <span class='ref'>Réf. L.443-1, L.443-2, R.443-1 et s. (rechute) ; L.142-6 CSS (CMRA).</span>"},

{type:"divider", kicker:"Partie 2", title:["Les arguments", "juridiques"], lede:"Présomption, tableaux, procédure : ce qui fait gagner",
  notes:"<b>Passer de la procédure au fond.</b> Une fois la bonne voie choisie, il faut des arguments. Trois familles : (1) la <b>présomption</b>, qui renverse la charge de la preuve ; (2) les <b>conditions</b> des tableaux de maladies professionnelles et la voie du CRRMP ; (3) les <b>irrégularités de procédure</b> de la caisse. <span class='cgt'>La force des victimes, c'est le droit : la présomption d'imputabilité est l'une des conquêtes majeures du mouvement ouvrier (loi de 1898). La faire respecter, c'est défendre ce principe.</span>"},

{type:"content", kicker:"Accident du travail", title:"La présomption d'imputabilité",
  bullets:[
    "Tout accident survenu <b>au temps et au lieu du travail</b> est présumé d'origine professionnelle (L.411-1)",
    "C'est à la caisse ou à l'employeur de prouver une <b>cause totalement étrangère</b> au travail",
    "Le <b>malaise</b> ou la lésion psychique soudaine au travail est un accident du travail",
    "La présomption couvre les <b>soins et arrêts</b> jusqu'à la guérison ou la consolidation",
    "Hors temps et lieu de travail : la victime doit prouver le lien avec le travail"
  ],
  notes:"<b>L'argument central en matière d'accident du travail.</b> L'accident survenu par le fait ou à l'occasion du travail est présumé professionnel ; dès lors qu'il survient au temps et au lieu du travail, la victime n'a pas à prouver le lien : c'est à la caisse ou à l'employeur d'établir que la lésion a une cause totalement étrangère au travail (un état antérieur seul ne suffit pas s'il a été révélé ou aggravé par le travail). <b>Jurisprudence utile :</b> le malaise cardiaque au travail est présumé accident du travail ; un choc psychologique soudain (entretien violent, annonce brutale, agression) aussi ; la présomption s'étend à toute la durée d'incapacité jusqu'à la guérison ou la consolidation, ce qui fait échec aux contestations de la durée des arrêts par l'employeur. <span class='cgt'>Face à des réserves de l'employeur (« état antérieur », « aucun témoin »), rappeler que la présomption s'applique et que les réserves doivent être motivées. L'absence de témoin n'empêche pas la reconnaissance si des éléments concordants existent (déclaration rapide, constat médical le jour même).</span> <span class='ref'>Réf. L.411-1 CSS ; Cass. soc. 2 avr. 2003 (malaise) ; Cass. 2e civ., jurisprudence constante sur l'étendue de la présomption aux arrêts jusqu'à consolidation.</span>"},

{type:"content", kicker:"Maladie professionnelle", title:"Les arguments en maladie professionnelle",
  bullets:[
    "<b>Tableau</b> : si les conditions sont remplies, la maladie est présumée professionnelle",
    "<b>Date de première constatation médicale</b> : elle peut être antérieure au certificat initial (examen, arrêt, imagerie)",
    "<b>Liste indicative</b> des travaux : tout travail exposant au risque suffit",
    "Une condition manque : <b>CRRMP</b> (alinéa 6) ; hors tableau avec IPP ≥ 25 % : <b>CRRMP</b> (alinéa 7)",
    "Refus après avis du CRRMP : le tribunal doit consulter <b>un autre CRRMP</b>"
  ],
  notes:"<b>Les leviers propres aux maladies professionnelles.</b> (1) <b>Présomption du tableau</b> : maladie désignée, délai de prise en charge respecté, travaux de la liste (limitative ou indicative), durée d'exposition le cas échéant. (2) La <b>date de première constatation médicale</b> est celle à laquelle les premières manifestations ont été constatées par un médecin, même avant le diagnostic définitif : elle peut sauver un dossier où le délai de prise en charge semble dépassé. (3) Quand la liste est <b>indicative</b>, la caisse ne peut pas refuser au motif que le métier n'est pas cité. (4) Si une condition manque, ou si la maladie n'est pas inscrite (avec une incapacité prévisible d'au moins 25 %), la caisse saisit le <b>CRRMP</b>. (5) Si la caisse refuse après l'avis du CRRMP, le tribunal ne peut statuer qu'après avoir recueilli l'avis d'un <b>second CRRMP</b>. <span class='cgt'>Le taux de 25 % de l'alinéa 7 est un taux prévisible au moment de la demande : le faire évaluer en décrivant toutes les conséquences de la maladie (notamment pour les pathologies psychiques). La CGT revendique la suppression de ce seuil.</span> <span class='ref'>Réf. L.461-1, L.461-2 CSS ; R.142-17-2 (second CRRMP) ; R.461-8 (seuil de 25 %).</span>"},

{type:"content", kicker:"Les fautes de la caisse", title:"Les irrégularités de procédure",
  bullets:[
    "<b>Délais d'instruction</b> dépassés (AT : 30 jours, ou 90 jours en cas d'enquête ; MP : 120 jours, + 120 avec CRRMP) : <b>reconnaissance implicite</b>",
    "<b>Dossier</b> non mis à disposition ou délai de consultation non respecté",
    "<b>Notification</b> sans mention des voies et délais de recours : délai non opposable",
    "<b>Décision non motivée</b> ou fondée sur des faits erronés",
    "<b>Prescription</b> opposée à tort : 2 ans à partir du certificat qui fait le lien avec le travail (MP)"
  ],
  notes:"<b>Les erreurs de la caisse profitent à la victime.</b> (1) <b>Délais d'instruction</b> : depuis le décret du 23 avril 2019, la caisse dispose de 30 jours francs pour statuer sur un accident (ou de 90 jours si elle engage des investigations), et de 120 jours francs pour une maladie professionnelle (plus 120 jours si le CRRMP est saisi). À défaut de décision dans ces délais, le caractère professionnel est reconnu (reconnaissance implicite) : la jurisprudence récente l'applique strictement, la preuve de l'envoi dans le délai pesant sur la caisse. (2) <b>Contradictoire</b> : la victime et l'employeur doivent pouvoir consulter le dossier et formuler des observations avant la décision. (3) <b>Mentions obligatoires</b> de la notification. (4) <b>Prescription</b> : en MP, le délai de 2 ans court à partir de la date à laquelle la victime est informée par un certificat médical du lien possible entre sa maladie et son activité professionnelle. <span class='cgt'>Reconstituer systématiquement la chronologie du dossier (dates de réception de la déclaration, du certificat, des courriers de la caisse) : une décision tardive peut transformer un refus en reconnaissance. Vérifier les dates précises, les délais courant à compter de la réception des pièces.</span> <span class='ref'>Réf. R.441-7, R.441-8, R.441-18 (AT) ; R.461-9 et R.461-10 (MP) ; L.461-1 et L.431-2 (prescription) CSS ; décret n° 2019-356.</span>"},

{type:"two", kicker:"Ne pas confondre", title:"Quand l'employeur conteste : l'inopposabilité",
  a:{h:"Ce que l'employeur peut obtenir",t:"Que la décision de reconnaissance lui soit <b>inopposable</b> : les dépenses ne sont pas imputées sur son compte et ses cotisations AT/MP n'augmentent pas.",style:"plain"},
  b:{h:"Ce que cela ne change pas",t:"La victime <b>garde tous ses droits</b> : reconnaissance, soins, indemnités, rente. Les rapports caisse-victime et caisse-employeur sont indépendants.",style:"red"},
  notes:"<b>Rassurer les victimes inquiètes d'une contestation patronale.</b> L'employeur peut contester la décision de la caisse pour des raisons de procédure (non-respect du contradictoire, délais) ou de fond (durée des arrêts, imputabilité des lésions). S'il obtient gain de cause, la décision lui est seulement <b>inopposable</b> : le coût de l'accident n'est pas imputé sur son compte, ses cotisations n'augmentent pas. Mais la décision reste <b>acquise à la victime</b> : c'est le principe d'indépendance des rapports entre la caisse, l'assuré et l'employeur. <span class='cgt'>Ces contestations, souvent confiées à des cabinets spécialisés, visent à faire baisser les cotisations patronales : c'est la collectivité qui paie. Les élus du CSE peuvent demander, dans la BDESE, le nombre d'accidents et de maladies contestés par l'employeur : c'est un indicateur révélateur de sa politique de prévention. Rappeler aussi que la faute inexcusable reste possible même si la décision est inopposable à l'employeur (il pourra seulement discuter le caractère professionnel dans ce cadre).</span> <span class='ref'>Réf. R.441-18, R.461-10 CSS ; principe d'indépendance des rapports (jurisprudence constante).</span>"},

{type:"divider", kicker:"Partie 3", title:["La faute", "inexcusable"], lede:"Obtenir la réparation de tous les préjudices",
  notes:"<b>La procédure la plus puissante pour la victime.</b> La reconnaissance en AT/MP ouvre une réparation forfaitaire (indemnités, rente). La faute inexcusable de l'employeur ouvre une réparation bien plus large : majoration de la rente au maximum et indemnisation des préjudices personnels. <span class='cgt'>C'est aussi un outil de prévention : l'employeur condamné supporte la charge financière (via la caisse qui la récupère). La CGT revendique la réparation intégrale de tous les préjudices pour toutes les victimes du travail.</span>"},

{type:"def", title:"La faute inexcusable de l'employeur",
  term:"Article L.452-1 du Code de la sécurité sociale",
  text:"Il y a faute inexcusable lorsque l'employeur avait ou aurait dû avoir conscience du danger auquel était exposé le salarié et n'a pas pris les mesures nécessaires pour l'en préserver.",
  extra:"Il suffit que la faute soit <b>une cause nécessaire</b> du dommage, même si d'autres fautes y ont concouru, y compris celle de la victime (Cass. ass. plén. 24 juin 2005). Elle est <b>de droit</b> si le risque avait été signalé à l'employeur (L.4131-4) ou pour un CDD ou intérimaire affecté à un poste à risque sans formation renforcée (L.4154-3).",
  notes:"<b>La définition à connaître par cœur.</b> Deux conditions : (1) la <b>conscience du danger</b> — l'employeur savait ou aurait dû savoir (en tant que professionnel organisant le travail) ; (2) l'<b>absence de mesures</b> nécessaires pour protéger le salarié. La faute n'a pas à être la cause déterminante : il suffit qu'elle soit une cause nécessaire, même si la victime a elle aussi commis une imprudence. <b>Faute inexcusable de droit</b> (la victime n'a rien à prouver d'autre) : quand un salarié ou un élu du CSE avait signalé le risque qui s'est matérialisé (L.4131-4) ; quand un salarié en CDD ou intérimaire victime était affecté à un poste à risques particuliers sans formation renforcée à la sécurité (L.4154-3). <span class='cgt'>C'est ici que le travail des élus prend tout son sens : une alerte écrite, un compte rendu d'inspection, un PV du CSE signalant le risque font basculer le dossier. Penser aussi à l'intérim : la faute de l'entreprise utilisatrice est imputable à l'employeur juridique (l'entreprise de travail temporaire), qui dispose d'un recours contre elle.</span> <span class='ref'>Réf. L.452-1 CSS ; L.4131-4 et L.4154-3 CT ; L.412-6 CSS (intérim) ; Cass. soc. 28 fév. 2002 ; Cass. ass. plén. 24 juin 2005.</span>"},

{type:"svg", kicker:"La procédure", title:"Engager la faute inexcusable, étape par étape",
  caption:"La victime (ou ses ayants droit) agit dans les 2 ans. La caisse avance les sommes, puis les récupère auprès de l'employeur.",

  <g class="t-ui" font-size="15" text-anchor="middle">
    <g class="a-pop" style="--d:.1s"><rect x="10" y="60" width="205" height="100" rx="8" fill="#E2001A"/><text x="112" y="96" fill="#fff">1. AT ou MP</text><text x="112" y="120" fill="#fff">reconnu (ou en cours)</text><text x="112" y="144" fill="#FFD200" font-size="13">la FI peut être demandée</text></g>
    <g class="a-pop" style="--d:.5s"><rect x="255" y="60" width="210" height="100" rx="8" fill="#141414"/><text x="360" y="96" fill="#FFD200">2. Demande à la CPAM</text><text x="360" y="120" fill="#fff">tentative de</text><text x="360" y="144" fill="#fff">conciliation</text></g>
    <g class="a-pop" style="--d:.9s"><rect x="505" y="60" width="210" height="100" rx="8" fill="#141414"/><text x="610" y="96" fill="#FFD200">3. Pôle social</text><text x="610" y="120" fill="#fff">saisi par la victime</text><text x="610" y="144" fill="#fff">(CPAM et employeur appelés)</text></g>
    <g class="a-pop" style="--d:1.3s"><rect x="755" y="60" width="210" height="100" rx="8" fill="#FFD200"/><text x="860" y="96" fill="#141414">4. Jugement :</text><text x="860" y="120" fill="#141414">faute reconnue</text><text x="860" y="144" fill="#141414">rente majorée au max.</text></g>
    <g class="a-pop" style="--d:1.7s"><rect x="755" y="240" width="210" height="100" rx="8" fill="#F1EFE8" stroke="#141414" stroke-width="2"/><text x="860" y="276" fill="#141414">5. Expertise médicale</text><text x="860" y="300" fill="#141414">des préjudices</text><text x="860" y="324" fill="#6C6A63" font-size="13">ordonnée par le juge</text></g>
    <g class="a-pop" style="--d:2.1s"><rect x="505" y="240" width="210" height="100" rx="8" fill="#F1EFE8" stroke="#E2001A" stroke-width="3"/><text x="610" y="276" fill="#141414">6. Indemnisation</text><text x="610" y="300" fill="#141414">des préjudices</text><text x="610" y="324" fill="#E2001A" font-size="13">avancée par la CPAM</text></g>
    <g class="a-pop" style="--d:2.5s"><rect x="255" y="240" width="210" height="100" rx="8" fill="#141414"/><text x="360" y="276" fill="#FFD200">7. La CPAM récupère</text><text x="360" y="300" fill="#fff">les sommes auprès</text><text x="360" y="324" fill="#fff">de l'employeur</text></g>
  </g>
  <g class="a-fade" style="--d:2.9s"><rect x="10" y="375" width="1080" height="80" rx="8" fill="#FFD200"/>
    <text x="550" y="407" text-anchor="middle" class="t-ui" font-size="17" fill="#141414">Délai : 2 ans à compter de l'accident ou de la fin du versement des IJ</text>
    <text x="550" y="435" text-anchor="middle" class="t-ui" font-size="15" fill="#141414">(interrompu notamment par l'action en reconnaissance du caractère professionnel ou une action pénale)</text></g>
</svg>`,
  notes:"<b>La procédure pas à pas (schéma animé).</b> (1) La faute inexcusable suppose un accident du travail ou une maladie professionnelle (la demande peut être engagée pendant l'instruction ou le contentieux de reconnaissance). (2) La victime adresse une demande à la caisse, qui organise une <b>tentative de conciliation</b> entre la victime et l'employeur. (3) À défaut d'accord (ou sans attendre la fin de la conciliation), la victime saisit le <b>pôle social</b> du tribunal judiciaire ; la caisse et l'employeur sont dans la cause. (4) Si la faute est reconnue : <b>majoration de la rente</b> au maximum (ou du capital). (5) Le juge ordonne en général une <b>expertise médicale</b> pour évaluer les préjudices, et peut accorder une provision. (6) La <b>caisse verse</b> l'indemnisation à la victime — même si l'employeur a disparu ou est insolvable. (7) La caisse <b>récupère</b> ensuite les sommes auprès de l'employeur. <b>Délai</b> : 2 ans à compter du jour de l'accident ou de la cessation du paiement des indemnités journalières ; la prescription est interrompue par l'action en reconnaissance du caractère professionnel et par l'action pénale. <span class='cgt'>Ne pas attendre : rassembler très tôt les preuves de la conscience du danger (diapo suivante). L'assistance d'un avocat spécialisé est fortement recommandée ; l'UD CGT et les associations de victimes (FNATH, ANDEVA pour l'amiante) peuvent orienter.</span> <span class='ref'>Réf. L.452-1 à L.452-5, L.431-2 CSS ; L.452-3 (avance par la caisse).</span>"},

{type:"content", kicker:"Prouver la faute", title:"Les preuves de la conscience du danger",
  bullets:[
    "<b>DUERP</b> : le risque y figure (l'employeur le connaissait) ou n'y figure pas (il ne l'a pas évalué)",
    "<b>PV du CSE</b>, alertes, comptes rendus d'inspection, enquêtes après accident",
    "<b>Accidents ou incidents antérieurs</b> similaires, signalements des salariés",
    "<b>Réglementation</b> non respectée : formation, vérification des machines, protections collectives",
    "<b>Mises en demeure</b> ou procès-verbaux de l'inspection du travail, injonctions CARSAT"
  ],
  strip:"Tout ce que le CSE écrit aujourd'hui peut devenir la preuve de demain.",
  notes:"<b>Construire la preuve.</b> La conscience du danger s'apprécie objectivement : l'employeur, professionnel de son activité, ne peut pas ignorer les risques connus du métier ou signalés. <b>Pièces décisives :</b> le DUERP (s'il mentionne le risque sans mesure adaptée, la conscience est établie ; s'il ne le mentionne pas, l'employeur a manqué à son obligation d'évaluer) ; les PV et alertes du CSE ; les comptes rendus d'inspection ; les accidents antérieurs sur le même poste ; l'absence de formation obligatoire (CACES, travail en hauteur, risque chimique) ; l'absence de vérification périodique des équipements ; les injonctions de la CARSAT et les observations de l'inspection du travail ; les témoignages des collègues. <span class='cgt'>C'est le lien direct entre l'action quotidienne des élus et la défense des victimes : chaque risque signalé par écrit, chaque inspection consignée, construit le dossier. Les victimes et leurs avocats ont accès à ces documents : les élus doivent les conserver et les transmettre (avec l'accord de la victime).</span> <span class='ref'>Réf. L.4121-1 à L.4121-3 CT ; L.4131-4 (faute de droit) ; R.4141-1 et s. (formation à la sécurité).</span>"},

{type:"content", kicker:"Ce que la victime obtient", title:"Les préjudices indemnisés en cas de faute inexcusable",
  bullets:[
    "<b>Majoration de la rente</b> au maximum (ou du capital)",
    "<b>Souffrances</b> physiques et morales, <b>préjudice esthétique</b>, <b>préjudice d'agrément</b>",
    "<b>Perte ou diminution des possibilités de promotion</b> professionnelle",
    "<b>Déficit fonctionnel permanent</b> (depuis 2023), déficit temporaire, préjudice sexuel",
    "<b>Frais</b> d'aménagement du logement et du véhicule, assistance par une tierce personne avant consolidation",
    "En cas de décès : <b>préjudice moral</b> des ayants droit"
  ],
  notes:"<b>Une réparation bien plus large que la réparation forfaitaire.</b> La loi prévoit la majoration de la rente et l'indemnisation des souffrances, du préjudice esthétique, du préjudice d'agrément et de la perte de chance de promotion (L.452-3). Depuis la décision du Conseil constitutionnel du 18 juin 2010, la victime peut demander réparation de <b>tous les préjudices non couverts</b> par la réparation forfaitaire : déficit fonctionnel temporaire, préjudice sexuel, aménagement du logement et du véhicule, assistance par une tierce personne avant consolidation, etc. Depuis deux arrêts de l'assemblée plénière de la Cour de cassation du 20 janvier 2023, la rente ne répare plus le <b>déficit fonctionnel permanent</b>, qui peut donc être indemnisé en plus. <b>En cas de décès</b>, les ayants droit obtiennent la réparation de leur préjudice moral. <span class='cgt'>Ces avancées sont le fruit de combats menés par les victimes, leurs associations et leurs syndicats. La CGT revendique désormais la <b>réparation intégrale</b> de tous les préjudices pour toutes les victimes du travail, sans avoir à prouver une faute.</span> <span class='ref'>Réf. L.452-2, L.452-3 CSS ; Cons. const. 18 juin 2010 n° 2010-8 QPC ; Cass. ass. plén. 20 janv. 2023 n° 21-23.947 et 20-23.673.</span>"},

{type:"quiz", title:"Quiz — Quel recours ?",
  q:"La CPAM fixe le taux d'incapacité permanente d'un salarié à 6 %, sans tenir compte de son licenciement pour inaptitude. Que faire ?",
  opts:[{k:"A",t:"Saisir directement le conseil de prud'hommes"},{k:"B",t:"Saisir la commission de recours amiable (CRA)"},{k:"C",t:"Saisir la commission médicale de recours amiable (CMRA) dans les 2 mois et demander un coefficient professionnel"},{k:"D",t:"Rien : le taux fixé par le médecin-conseil est définitif"}],
  ans:2,
  explain:"Le taux d'incapacité est une décision d'ordre médical : recours préalable obligatoire devant la CMRA, dans les 2 mois. Le licenciement pour inaptitude justifie de demander un coefficient professionnel (L.434-2).",
  notes:"<b>Vérifier qu'on sait aiguiller.</b> Le taux d'incapacité relève de la CMRA (décision médicale), pas de la CRA. Le prud'hommes est compétent pour le licenciement, pas pour le taux. L'enjeu : à 6 %, la victime touche un capital ; à 10 % ou plus, une rente à vie. Le licenciement pour inaptitude consécutif aux séquelles est l'argument type pour obtenir un taux professionnel. <span class='cgt'>Réflexe : coupler les deux combats — contestation du taux devant la CMRA, et vérification des droits liés à l'inaptitude d'origine professionnelle (indemnité doublée, reclassement) devant le prud'hommes si nécessaire.</span>"},

{type:"quiz", title:"Quiz — La caisse a-t-elle le droit ?",
  q:"Une salariée a déclaré une maladie professionnelle. La CPAM lui notifie un refus 150 jours après avoir reçu le dossier complet, sans avoir saisi le CRRMP. Quel argument soulever ?",
  opts:[{k:"A",t:"Aucun : la caisse peut prendre le temps nécessaire"},{k:"B",t:"Le délai de 120 jours francs est dépassé : le caractère professionnel est implicitement reconnu"},{k:"C",t:"Il faut recommencer la déclaration depuis le début"},{k:"D",t:"Saisir l'inspection du travail"}],
  ans:1,
  explain:"Faute de décision dans le délai de 120 jours francs (hors saisine du CRRMP), le caractère professionnel est reconnu. Vérifier précisément les dates de réception, la preuve de l'envoi dans le délai pesant sur la caisse.",
  notes:"<b>Un argument de procédure qui fait gagner.</b> La caisse dispose de 120 jours francs à compter de la réception de la déclaration et du certificat médical pour statuer ou saisir le CRRMP. Au-delà, sans décision, le caractère professionnel est reconnu. La jurisprudence récente des cours d'appel l'applique strictement. <span class='cgt'>Tenir la chronologie de chaque dossier : date d'envoi de la déclaration, accusé de réception, courriers de la caisse. C'est souvent sur ces dates que se gagne un recours.</span> <span class='ref'>Réf. R.461-9 CSS.</span>"},

{type:"case", title:"Cas pratique — Karim, cariste, refus et taux contesté",
  scenario:"Karim, 49 ans, cariste depuis 18 ans dans un entrepôt, a déclaré une hernie discale L5-S1 avec sciatique. La CPAM refuse la prise en charge au titre du tableau 98, au motif que « la manutention n'était pas habituelle » (questionnaire employeur). Le CSE avait pourtant signalé en 2023 l'absence de transpalettes électriques et des charges de plus de 25 kg. Par ailleurs, pour un accident survenu il y a 2 ans, Karim a été consolidé avec un taux de 5 % ; il vient d'être licencié pour inaptitude.",
  questions:["Groupe A — Quel(s) recours contre le refus de la maladie professionnelle ? Dans quels délais ? Quels arguments et quelles pièces ?","Groupe B — Peut-on encore contester le taux de 5 % ? Sinon, quelles autres voies pour améliorer sa situation ?","Groupe C — La faute inexcusable de l'employeur est-elle envisageable ? Sur quelles preuves ? Quelle procédure ?"],
  minutes:25,
  notes:"<b>Atelier en 3 groupes (15 min) + restitution (10 min).</b> <b>Groupe A :</b> refus administratif → CRA dans les 2 mois, puis pôle social. Arguments : conditions du tableau 98 (manutention manuelle habituelle de charges lourdes, 5 ans d'exposition, délai de 6 mois, hernie avec atteinte radiculaire concordante) ; contredire le questionnaire employeur par des attestations de collègues, les fiches de poste, le PV du CSE de 2023, des photos ; demander la copie du dossier ; vérifier les délais d'instruction (reconnaissance implicite éventuelle) ; si une condition manque vraiment, demander la saisine du CRRMP. <b>Groupe B :</b> le taux de 5 % ne peut plus être contesté si le délai de 2 mois est expiré (vérifier que la notification mentionnait bien les voies et délais de recours : sinon, le délai ne court pas). Autres voies : demande de révision pour aggravation ; droits liés à l'inaptitude d'origine professionnelle (indemnité spéciale doublée, reclassement). <b>Groupe C :</b> faute inexcusable envisageable (et même de droit si le risque avait été signalé, L.4131-4) : PV du CSE de 2023, absence d'aides à la manutention, DUERP ; demande à la CPAM pour conciliation, puis pôle social, dans les 2 ans. <span class='cgt'>Point fort : le PV du CSE de 2023 sert à la fois la reconnaissance de la maladie (exposition) et la faute inexcusable (conscience du danger). C'est la démonstration concrète de l'utilité des écrits des élus.</span>"},

{type:"content", kicker:"À retenir", title:"Les réflexes du militant",
  bullets:[
    "<b>Noter la date de réception</b> de chaque décision — et ne jamais laisser passer 2 mois",
    "<b>Identifier la voie</b> : CRA (administratif), CMRA (médical), pôle social, faute inexcusable",
    "<b>Demander le dossier</b> de la caisse et le rapport médical",
    "<b>Vérifier la procédure</b> : délais d'instruction, contradictoire, mentions de la notification",
    "<b>Argumenter</b> : présomption, tableau, date de première constatation, coefficient professionnel",
    "<b>Penser faute inexcusable</b> dès qu'un risque avait été signalé ou une règle non respectée"
  ],
  strip:"Ne jamais laisser une victime seule face à la caisse : le syndicat accompagne, l'UD appuie, l'avocat plaide quand il le faut.",
  notes:"<b>Six réflexes à emporter.</b> (1) La date de réception et le délai de 2 mois. (2) La bonne voie de recours. (3) La copie du dossier. (4) Les failles de procédure. (5) Les arguments de fond. (6) La faute inexcusable, à envisager systématiquement quand des preuves de la conscience du danger existent. <span class='cgt'>Message de fin : le droit des victimes du travail est une conquête collective, qui ne vit que si on le fait respecter. Chaque recours gagné fait aussi reculer la sous-déclaration et rappelle aux employeurs que la santé des salariés a un prix. Organiser dans l'UD un suivi des dossiers de recours (échéancier, modèles de courriers, contacts d'avocats spécialisés).</span>"},

{type:"closing",
  title:"Recours\\n& contestations",
  sub:"Formation syndicale CGT Occitanie — Module AT/MP",
  contacts:"CGT Comité Régional Occitanie · Secteur privé",
  notes:"<b>Clôture.</b> Tour de table : « une voie de recours ou un argument que je ne connaissais pas ». Distribuer les modèles de courriers (recours CRA, recours CMRA, demande de communication du dossier, demande de faute inexcusable) et l'échéancier des délais. <span class='cgt'>Rappeler les contacts : UD CGT, collectifs santé-travail, associations de victimes, avocats partenaires. Ne jamais laisser un dossier de faute inexcusable ou de décès sans accompagnement juridique.</span> <span class='ref'>Avant toute utilisation sur un dossier réel : vérifier les délais indiqués sur la notification et la version en vigueur des textes sur Légifrance.</span>"}

/* ===================== MOTEUR ===================== */
let cur=0, timerInt=null, timerSec=0, timerRunning=false;
const deck=document.getElementById('deck');
const notesEl=document.getElementById('notes');
const notesBody=notesEl.querySelector('.nbody');
const countEl=document.getElementById('count');
const barFill=document.querySelector('#bar i');
const ovEl=document.getElementById('ov');
const inkCanvas=document.getElementById('ink');
const inkTools=document.getElementById('inktools');
const ctx=inkCanvas.getContext('2d');
let inkOn=false, inkTool='pen', drawing=false, lastX=0, lastY=0;

function resizeCanvas(){inkCanvas.width=window.innerWidth;inkCanvas.height=window.innerHeight;}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

function logoMark(){ return CONFIG.logo
  ? `<img class="logo-img" src="${CONFIG.logo}" alt="CGT">`
  : `<span class="wordmark">CGT</span>`; }

function buildSlide(s,i){
  const div=document.createElement('div');
  const types={'title':'s-title','divider':'s-divider','content':'s-content','stats':'s-stats',
    'steps':'s-steps','two':'s-two','callout':'s-callout','def':'s-def','case':'s-case',
    'quiz':'s-quiz','closing':'s-closing','svg':'s-svg'};
  div.className=`slide ${types[s.type]||''} ${s.dark?'dark':''}`;
  div.dataset.idx=i;
  if(s.type==='title'){
    div.innerHTML=`
      <div class="lockup reveal">${logoMark()}</div>
      <div class="kicker reveal"><span class="dot"></span>${s.eyebrow||''}</div>
      <h1 class="title reveal">${Array.isArray(s.title)?s.title.join('<br>'):s.title}</h1>
      <div class="accent reveal"></div>
      <p class="lede reveal">${s.lede||''}</p>
      <div class="foot reveal">${s.foot||''}</div>`;
  } else if(s.type==='divider'){
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||''}</div>
      <h1 class="title reveal">${Array.isArray(s.title)?s.title.join('<br>'):s.title}</h1>
      <div class="barline reveal"></div>
      ${s.lede?`<p class="lede reveal">${s.lede}</p>`:''}`;
  } else if(s.type==='content'){
    const strip=s.strip?`<div class="note-strip reveal">${s.strip}</div>`:'';
    const n=s.bullets.length;
    const ulCls=n>=7?'bullets dense':n>=5?'bullets md':'bullets';
    const titleSz=n>=7?'clamp(24px,3.6vw,56px)':n>=5?'clamp(26px,4vw,64px)':'clamp(28px,4.5vw,72px)';
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||'Points clés'}</div>
      <h2 class="title reveal" style="font-size:${titleSz}">${s.title}</h2>

SLIDES.forEach((s,i)=>deck.appendChild(buildSlide(s,i)));
const allSlides=deck.querySelectorAll('.slide');

function goTo(n){
  const prev=cur;
  const nCur=Math.max(0,Math.min(n,SLIDES.length-1));
  // Directional transitions
  if(nCur!==prev){
    const dir=nCur>prev?1:-1;
    allSlides[prev].classList.add(dir>0?'leave-left':'leave-right');
    allSlides[nCur].classList.add(dir>0?'enter-right':'enter-left');
    setTimeout(()=>{
      allSlides[prev].classList.remove('leave-left','leave-right');
      allSlides[nCur].classList.remove('enter-right','enter-left');
    },400);
  }
  allSlides[cur].classList.remove('active');
  cur=nCur;
  allSlides[cur].classList.add('active');
  countEl.innerHTML=`<b>${String(cur+1).padStart(2,'0')}</b> / ${SLIDES.length}`;
  barFill.style.width=`${((cur+1)/SLIDES.length)*100}%`;
  const barNum=document.getElementById('bar-num');if(barNum)barNum.textContent=(cur+1)+' / '+SLIDES.length;
  notesBody.innerHTML=(SLIDES[cur].notes||'<em>Aucune note pour cette diapositive.</em>').replace(/\n/g,'<br>');
  // Compteurs animés stats (easing sqrt, toLocaleString fr-FR, data-animated flag)
  allSlides[cur].querySelectorAll('[data-val]').forEach(el=>{
    if(el.dataset.animated)return;
    el.dataset.animated='1';
    const target=+el.dataset.val, pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    let t0=null;
    requestAnimationFrame(function step(now){
      if(t0===null)t0=now;
      const t=Math.min(Math.max(0,now-t0),1200);
      el.textContent=pre+Math.floor(Math.sqrt(t/1200)*target).toLocaleString('fr-FR')+suf;
      if(t<1200)requestAnimationFrame(step);
    });
  });
  const nsEl=document.getElementById('notes-slide-num');
  if(nsEl)nsEl.textContent='Diapo '+(cur+1)+' / '+SLIDES.length;
  if(typeof updatePresenter==='function')updatePresenter();
  // localStorage
  try{localStorage.setItem('cgt-recours-slide',cur);}catch(e){}
}

// resume
try{const saved=localStorage.getItem('cgt-recours-slide');if(saved!==null)goTo(+saved);else goTo(0);}catch(e){goTo(0);}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();goTo(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(cur-1);}
  else if(e.key==='Home'){goTo(0);}
  else if(e.key==='End'){goTo(SLIDES.length-1);}
  else if(e.key.toLowerCase()==='o'){ovEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='n'){notesEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key.toLowerCase()==='a'){toggleInk();}
  else if(e.key.toLowerCase()==='l'){document.getElementById('spotlight').classList.toggle('on');}
  else if(e.key.toLowerCase()==='p'){openPresenter();}
  else if(e.key==='Escape'){ovEl.classList.remove('show');notesEl.classList.remove('show');document.getElementById('help').classList.remove('show');if(inkOn)toggleInk();}
  else if(e.key==='?'){document.getElementById('help').classList.toggle('show');}
});

(function(){

    notesEl.style.height=newH+"px";

  handle.addEventListener("touchstart",e=>{dragging=true;startY=e.touches[0].clientY;startH=notesEl.offsetHeight;},{passive:true});
  document.addEventListener("touchmove",e=>{

    notesEl.style.height=newH+"px";

inkCanvas.addEventListener('pointermove',e=>{
  if(!inkOn||!drawing)return;
  ctx.save();
  if(inkTool==='pen'){ctx.strokeStyle='rgba(226,0,26,0.9)';ctx.lineWidth=3;ctx.globalCompositeOperation='source-over';}
  else if(inkTool==='hl'){ctx.strokeStyle='rgba(255,210,0,0.35)';ctx.lineWidth=24;ctx.globalCompositeOperation='source-over';}
  else{ctx.lineWidth=28;ctx.globalCompositeOperation='destination-out';}
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();
  ctx.restore();
  lastX=e.offsetX;lastY=e.offsetY;
});

    const t=new Date();
    const cl=presWin.document.getElementById('pcl');
    if(cl)cl.textContent=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    const sec=Math.floor((Date.now()-presStart)/1000);
    const ee=presWin.document.getElementById('pe');

  },1000);
  setTimeout(updatePresenter,120);

function updatePresenter(){
  if(!presWin||presWin.closed)return;
  const d=presWin.document; if(!d.getElementById('pt'))return;
  const c=slideSummary(SLIDES[cur]);
  d.getElementById('pk').textContent=plainText(c.k);
  d.getElementById('pt').innerHTML=c.T;
  d.getElementById('pb').innerHTML=c.body;
  d.getElementById('pno').innerHTML=(SLIDES[cur].notes||"<i style='color:#555'>Aucune note pour cette diapo.</i>").replace(/\n/g,'<br>');
  d.getElementById('pc').textContent=String(cur+1).padStart(2,'0')+' / '+SLIDES.length;
  const lab={content:'Contenu',stats:'Chiffres',steps:'Étapes',two:'Comparaison',callout:'Point clé',def:'Définition',case:'Atelier',quiz:'Quiz',divider:'Séquence',svg:'Schéma animé',closing:'Clôture',title:'Titre'};
  const nx=SLIDES[cur+1];
  d.getElementById('pn-title').innerHTML=nx?slideSummary(nx).T:'— Fin de la présentation —';
  d.getElementById('pn-type').textContent=nx?(lab[nx.type]||nx.type):'';
}
