    <text x="30" y="285" class="t-ui" font-size="17" fill="#141414">Tout au long du parcours :</text>
    <text x="30" y="312" class="t-body" font-size="16" fill="#141414">• visite de pré-reprise pendant l'arrêt pour préparer le retour</text>
    <text x="30" y="337" class="t-body" font-size="16" fill="#141414">• prévoyance déclarée • contestation du taux ou de la catégorie</text>
  </g>
</svg>`,
  notes:"<b>Le parcours d'un salarié après un arrêt long (schéma animé).</b> Pendant l'arrêt : IJ, maintien de salaire, prévoyance ; et la possibilité de demander une <b>visite de pré-reprise</b> au médecin du travail (à l'initiative du salarié, de son médecin traitant ou du médecin-conseil), essentielle pour préparer le retour. À la stabilisation : en <b>AT/MP</b>, la consolidation et la fixation du taux d'incapacité permanente (rente ou capital) ; en <b>maladie</b>, éventuellement une pension d'invalidité. Au retour : la <b>visite de reprise</b> auprès du médecin du travail, qui conclut à l'aptitude (avec ou sans aménagement) ou à l'inaptitude. En cas d'inaptitude : recherche de reclassement, puis licenciement si aucun poste ne convient ; en cas d'origine professionnelle, indemnités doublées. <span class='cgt'>La visite de pré-reprise est sous-utilisée : elle permet d'anticiper un aménagement (temps partiel thérapeutique, adaptation du poste) au lieu de subir une inaptitude. L'élu peut informer le salarié de ce droit et, avec son accord, appuyer les demandes d'aménagement.</span> <span class='ref'>Réf. R.4624-29 à R.4624-34 CT (pré-reprise et reprise) ; L.1226-2 et L.1226-10 CT (reclassement).</span>"},

 {type:"content", title:"Articulation pratique",
  bullets:["La rente AT/MP est calculée sur un <b>taux utile</b> : moitié du taux jusqu'à 50 %, une fois et demie au-delà.",
   "La pension d'invalidité tient compte des <b>10 meilleures années</b> ; la rente AT/MP, des 12 derniers mois de salaire.",
   "La prévoyance collective doit être <b>coordonnée</b> avec ces prestations pour couvrir ce qui manque.",
   "À l'âge légal, la pension d'invalidité laisse place à la <b>retraite pour inaptitude</b> ; la rente AT/MP continue à vie."],
  notes:"<b>Les mécanismes à connaître pour accompagner.</b> <b>Rente AT/MP</b> : taux d'incapacité permanente fixé par le médecin-conseil ; « taux utile » = moitié du taux jusqu'à 50 %, puis une fois et demie pour la part au-delà de 50 % ; rente = salaire annuel de référence × taux utile. Exemple : IPP de 60 % → taux utile = 25 % + 15 % = 40 %. <b>Pension d'invalidité</b> : 30 % ou 50 % du salaire annuel moyen des 10 meilleures années. La <b>prévoyance</b> intervient en complément, souvent en garantissant un pourcentage du salaire « sous déduction » des prestations de la Sécurité sociale. <span class='cgt'>Le taux d'incapacité fixé par la caisse est souvent sous-évalué, en particulier le « taux professionnel » (perte d'emploi, déclassement) : accompagner le salarié, contester devant la commission médicale de recours amiable, puis le tribunal. Chaque point de taux compte pour la rente à vie.</span> <span class='ref'>Réf. R.434-2 CSS (taux utile) ; R.434-32 ; L.142-6 (contestation).</span>"},

 {type:"divider", kicker:"Séquence 4", title:["La prévoyance","collective","en entreprise"],
  notes:"<b>Le cœur du sujet CGT : c'est ici qu'on négocie et qu'on contrôle.</b> Rappeler le chiffre souvent ignoré : les régimes de prévoyance collectifs représentent des milliards d'euros de cotisations chaque année, dont une partie payée par les salariés. <span class='cgt'>C'est du salaire socialisé : les représentants des salariés ont toute légitimité pour en exiger la transparence et pour peser sur les garanties.</span>"},

 {type:"def", title:"Les obligations en matière de protection sociale complémentaire",
  term:"Code de la sécurité sociale — ANI du 17 novembre 2017",
  text:"Complémentaire santé obligatoire pour tous les salariés (L.911-7). Prévoyance obligatoire pour les cadres : cotisation employeur d'au moins 1,50 % de la tranche A, affectée en priorité au décès.",
  extra:"Pour les autres salariés, les garanties incapacité, invalidité et décès dépendent de la convention collective, des accords d'entreprise ou d'une décision de l'employeur.",
  notes:"<b>Ce qui est obligatoire — et ce qui ne l'est pas.</b> <b>Santé</b> : tous les employeurs du privé doivent proposer une complémentaire santé collective (panier minimal, financement employeur d'au moins 50 %). <b>Prévoyance des cadres</b> : l'ANI du 17 novembre 2017 (qui reprend l'ancien article 7 de la convention de 1947) impose à l'employeur une cotisation d'au moins 1,50 % sur la tranche A des cadres, affectée en priorité à la garantie décès ; en cas de manquement, l'employeur doit verser aux ayants droit un capital égal à trois fois le plafond annuel de la Sécurité sociale. <b>Autres salariés</b> : pas d'obligation légale générale ; tout dépend de la branche (beaucoup de conventions prévoient un régime) et des accords. <span class='cgt'>Cette inégalité entre cadres et non-cadres est un terrain de lutte : exiger un régime de prévoyance pour tous, avec des garanties au moins équivalentes. Une cotisation patronale « cadres » sans équivalent pour les ouvriers et employés n'est pas justifiable.</span> <span class='ref'>Réf. L.911-1, L.911-7, L.912-1 CSS ; ANI du 17 nov. 2017.</span>"},

 {type:"steps", title:"Les garanties d'un régime de prévoyance",
  items:[{big:"Décès",nm:"Capital et rentes",ds:"Capital (souvent 1 à 3 ans de salaire), majoré par enfant ; rente éducation ; rente de conjoint."},
   {big:"Incap.",nm:"Incapacité temporaire",ds:"Complément des IJ après la franchise (souvent 90 jours), pour maintenir 80 à 100 % du salaire."},
   {big:"Inval.",nm:"Invalidité permanente",ds:"Rente complémentaire selon la catégorie ou le taux d'incapacité, jusqu'à la retraite."}],
  notes:"<b>Lire les définitions contractuelles : chaque mot compte.</b> La garantie <b>décès</b> protège la famille (capital, rentes éducation et conjoint). La garantie <b>incapacité</b> complète les IJ après une franchise. La garantie <b>invalidité</b> complète la pension ou la rente jusqu'à la retraite. Questions à poser : l'invalidité est-elle définie par référence à la Sécurité sociale (catégories, taux) ou par une définition propre à l'assureur, plus restrictive ? Les arrêts à temps partiel thérapeutique sont-ils couverts ? Les rentes sont-elles revalorisées ? <span class='cgt'>Préférer les contrats qui s'alignent sur les décisions de la Sécurité sociale : une définition « maison » de l'invalidité permet à l'assureur de refuser de payer alors que la CPAM a reconnu l'invalidité.</span> <span class='ref'>Réf. loi Évin n° 89-1009 du 31 déc. 1989 (art. 7 : maintien des prestations en cours) ; L.912-1 CSS.</span>"},

 {type:"content", title:"Lire un tableau de garanties — les points clés",
  bullets:["La <b>franchise</b> : à partir de quel jour d'arrêt l'organisme intervient-il ?",
   "La <b>base de calcul</b> : salaire brut, net, tranches A/B ; primes incluses ?",
   "Les <b>définitions</b> : invalidité alignée sur la Sécurité sociale ou définition propre ?",
   "Les <b>exclusions</b> : maladies antérieures, affections psychiques, sports…",
   "La <b>portabilité</b>, la <b>revalorisation</b> des rentes et le maintien en cas de résiliation."],
  strip:"Un tableau de garanties se lit comme un contrat : chaque mot compte.",
  notes:"<b>Les points à vérifier dans un contrat de prévoyance.</b> (1) Franchise et cohérence avec le maintien employeur (éviter le « trou »). (2) Niveau garanti en % du salaire, brut ou net, et base de calcul (primes, tranches). (3) Durée de versement. (4) Définition de l'invalidité. (5) Exclusions (maladies antérieures à l'embauche, affections psychiques, tentative de suicide, etc.) : les exclusions visant les troubles psychiques sont particulièrement pénalisantes alors que les RPS explosent. (6) Garanties décès. (7) Portabilité après la rupture du contrat. (8) Revalorisation des rentes et maintien des prestations en cours en cas de changement d'assureur (loi Évin). <span class='cgt'>Exiger la notice d'information : l'organisme doit la remettre à l'employeur, qui doit la distribuer à chaque salarié. Sans notice, les salariés ne connaissent pas leurs droits. Comparer avec les minima de la branche et contester les exclusions abusives lors des renégociations.</span> <span class='ref'>Réf. L.932-6 CSS ; L.141-4 C. assur. ; L.221-6 C. mutualité (notice) ; loi Évin, art. 2, 7 et 7-1.</span>"},

 {type:"callout", mode:"red", title:"La portabilité — article L.911-8 CSS",
  big:"Après la rupture du contrat, les garanties santé et prévoyance sont maintenues gratuitement, jusqu'à 12 mois.",
  sub:"Si la rupture ouvre droit à l'assurance chômage (et n'est pas consécutive à une faute lourde). Durée égale à celle du dernier contrat, dans la limite de 12 mois. L'employeur doit en informer le salarié.",
  notes:"<b>Un droit très concret, souvent ignoré.</b> En cas de licenciement, rupture conventionnelle, fin de CDD, etc., le salarié indemnisé par l'assurance chômage conserve gratuitement ses garanties santé et prévoyance pendant une durée égale à celle de son dernier contrat, dans la limite de 12 mois. L'employeur doit l'en informer, notamment dans le certificat de travail, et signaler la cessation du contrat à l'organisme. <b>Après la portabilité</b>, la loi Évin (article 4) permet aux anciens salariés (retraités, invalides, chômeurs) de conserver la complémentaire santé, avec un tarif encadré. <span class='cgt'>Le piège classique : un salarié licencié pour inaptitude, en arrêt ou en invalidité, qui ne sait pas que sa prévoyance continue. Le délégué doit systématiquement l'informer et vérifier que l'organisme a bien été prévenu.</span> <span class='ref'>Réf. L.911-8 CSS ; loi Évin, art. 4.</span>"},

 {type:"divider", kicker:"Séquence 5", title:["Le rôle CGT","dans la négociation","et le contrôle"],
  notes:"<b>Passer du savoir au pouvoir d'agir.</b> Comment la section syndicale et les élus du CSE s'emparent de ces sujets ? <span class='cgt'>Trois leviers : la négociation (branche et entreprise), le contrôle (CSE, comptes du régime), l'accompagnement individuel (dossiers de salariés). Les trois se nourrissent : les difficultés rencontrées par les salariés alimentent les revendications.</span>"},

 {type:"content", title:"Les leviers de négociation",
  bullets:["<b>Branche</b> : peser sur les garanties minimales, le haut degré de solidarité, le choix recommandé d'un organisme.",
   "<b>Entreprise</b> : améliorer les garanties pour tous, cadres et non-cadres ; réduire les franchises.",
   "<b>Choix de l'organisme</b> : institutions de prévoyance paritaires, mutuelles, assureurs — critères de qualité de gestion.",
   "<b>Suivi du régime</b> : comptes de résultats, ratio prestations/cotisations, réserves, fonds social."],
  strip:"La prévoyance collective, c'est du salaire socialisé : défendre les garanties, c'est défendre le pouvoir d'achat.",
  notes:"<b>Les leviers concrets de la négociation prévoyance.</b> (1) Exiger les comptes du régime : cotisations encaissées, prestations versées, provisions, frais de gestion. Si les prestations représentent une faible part des cotisations, revendiquer de meilleures garanties ou une baisse des cotisations salariales. (2) Comparer avec la branche et les meilleures conventions du secteur. (3) Revendiquer : suppression ou réduction des franchises, maintien du net, couverture du temps partiel thérapeutique, définitions alignées sur la Sécurité sociale, absence d'exclusion des troubles psychiques. (4) Préférer les organismes à but non lucratif et à gestion paritaire (institutions de prévoyance), où les représentants des salariés siègent. (5) Le « haut degré de solidarité » des accords de branche finance des actions sociales (aides aux salariés en difficulté, prévention). <span class='cgt'>Argument fondamental : les cotisations sont du salaire socialisé. Un contrat très bénéficiaire pour l'assureur et peu protecteur pour les salariés est un transfert de richesse inacceptable. Inscrire la prévoyance comme un axe à part entière des négociations, pas comme un sujet technique annexe.</span> <span class='ref'>Réf. L.912-1 et R.912-1 et s. CSS (haut degré de solidarité) ; L.2242-1 et s. CT.</span>"},

 {type:"content", title:"Le contrôle par le CSE",
  bullets:["La mise en place ou la modification d'un régime de prévoyance est une <b>consultation</b> du CSE.",
   "Demander le <b>rapport annuel</b> de l'organisme : cotisations, prestations, résultats.",
   "Vérifier les <b>affiliations</b> (y compris CDD, temps partiels, apprentis) et la distribution des <b>notices</b>.",
   "Utiliser les <b>activités sociales et culturelles</b> et le fonds social du régime pour aider les salariés en difficulté."],
  notes:"<b>Les droits d'information du CSE — et comment les exercer.</b> (1) Toute mise en place ou modification importante du régime relève de la consultation du CSE (dans les entreprises d'au moins 50 salariés). (2) L'organisme établit un rapport annuel sur les comptes du contrat collectif : le demander et l'inscrire à l'ordre du jour. (3) Vérifier que tous les salariés relevant du régime sont bien affiliés et ont reçu la notice. (4) Recenser, de façon anonyme, les difficultés de prise en charge rencontrées par les salariés. <span class='cgt'>Beaucoup de CSE n'ont jamais vu le rapport annuel de l'organisme. Poser la question dès la prochaine réunion : « Pouvez-vous nous communiquer le dernier rapport annuel du régime de prévoyance ? ». C'est souvent révélateur d'une opacité que l'employeur préfère maintenir — et le point de départ d'une renégociation.</span> <span class='ref'>Réf. L.2312-8 CT (consultation) ; L.932-6 CSS et art. 15 loi Évin (rapport annuel).</span>"},

 {type:"quiz", title:"Quiz — Vrai ou faux ?",
  q:"Un salarié classé en invalidité catégorie 2 peut-il reprendre une activité professionnelle ?",
  opts:[{k:"A",t:"Non : la catégorie 2 interdit toute activité"},{k:"B",t:"Oui, sous conditions : le contrat n'est pas rompu, le médecin du travail se prononce, et la pension se cumule avec le salaire dans certaines limites"},{k:"C",t:"Seulement si la convention collective le prévoit"},{k:"D",t:"Seulement après accord de l'employeur"}],
  ans:1,
  explain:"Le classement en invalidité ne rompt pas le contrat et ne vaut pas inaptitude. Une reprise est possible après visite de reprise, souvent avec aménagement ; la pension se cumule avec le salaire dans la limite d'un plafond.",
  notes:"<b>Bousculer une idée reçue.</b> Beaucoup de salariés et d'employeurs pensent que l'invalidité catégorie 2 interdit tout travail. C'est faux : la catégorie décrit une capacité de gain réduite, mais la reprise reste possible, souvent à temps partiel et sur un poste adapté, après avis du médecin du travail. La pension est alors maintenue tant que le cumul ne dépasse pas un plafond lié au salaire antérieur. <span class='cgt'>Cette possibilité peut servir l'intérêt du salarié (revenu, lien social, droits à la retraite). L'élu doit la connaître pour contrer les pressions à la sortie de l'entreprise.</span> <span class='ref'>Réf. L.341-12 CSS.</span>"},

 {type:"quiz", title:"Quiz — Quel taux d'indemnisation ?",
  q:"Un salarié blessé au travail est en arrêt depuis 35 jours. Quel est le taux de son indemnité journalière versée par la CPAM ?",
  opts:[{k:"A",t:"80 % du salaire journalier de référence (AT, à partir du 29e jour)"},{k:"B",t:"60 % du salaire journalier (AT, 28 premiers jours)"},{k:"C",t:"50 % du salaire journalier de base (maladie ordinaire)"},{k:"D",t:"100 % du salaire net"}],
  ans:0,
  explain:"À partir du 29e jour d'arrêt pour AT/MP, l'IJ passe à 80 % du salaire journalier de référence, sans aucun jour de carence. C'est nettement plus favorable que la maladie ordinaire (50 %).",
  notes:"<b>Ancrer l'intérêt financier de la reconnaissance AT/MP.</b> Faire le parallèle avec l'exercice de Fatima : en maladie ordinaire, elle aurait eu 50 % ; en maladie professionnelle reconnue, 60 % puis 80 %, sans carence. La réponse D (100 % du net) peut être vraie pour le revenu total grâce au maintien employeur et à la prévoyance, mais pas pour la seule part de la CPAM. <span class='cgt'>Chaque arrêt lié au travail mal déclaré, c'est de l'argent perdu pour le salarié et un coût reporté sur l'assurance maladie au lieu des employeurs.</span>"},

 {type:"case", title:"Exercice 3 — Robert, AT grave, IPP 25 %, contrat menacé",
  scenario:"Robert, 54 ans, monteur-câbleur, <b>salaire brut 2 800 €/mois</b>, ancienneté 18 ans. Il a chuté de 3 m sur un chantier : AT reconnu, consolidation après 8 mois d'arrêt. Le médecin-conseil fixe son taux d'incapacité permanente à <b>25 %</b>. À la visite de reprise, le médecin du travail le déclare inapte à son poste. Son employeur envisage un licenciement pour inaptitude. Robert vous demande ce qu'il peut espérer financièrement et quelles sont ses protections.",
  questions:[
   "<b>Question 1 :</b> Calculez le montant approximatif de sa rente AT (méthode du taux utile).",
   "<b>Question 2 :</b> Une pension d'invalidité peut-elle s'y ajouter ?",
   "<b>Question 3 :</b> Que faut-il vérifier dans le régime de prévoyance de l'entreprise ?",
   "<b>Question 4 :</b> En cas de licenciement pour inaptitude d'origine professionnelle, quelles sont ses protections ?"
  ],
  minutes:20,
  corrige:[
   "<span class='cr-key'>Rente AT</span> : taux utile = 25 % ÷ 2 = <b>12,5 %</b> (moitié du taux jusqu'à 50 %). Salaire annuel de référence ≈ 2 800 × 12 = 33 600 €. Rente annuelle ≈ 12,5 % × 33 600 = <b>4 200 €/an, soit 350 €/mois</b>, à vie, non imposable. À contester si le taux paraît sous-évalué (notamment le taux professionnel, compte tenu de la perte de son métier).",
   "<span class='cr-key'>Pension d'invalidité</span> : elle couvre la perte de capacité due à une maladie ou un accident <b>non professionnel</b>. Ici, les séquelles viennent d'un AT : c'est la rente AT qui les répare. Une pension d'invalidité ne serait envisageable que pour une autre affection, sans lien avec l'accident, réduisant sa capacité de gain d'au moins deux tiers.",
   "<span class='cr-key'>Prévoyance</span> : (1) la garantie invalidité prévoit-elle une rente en cas d'incapacité permanente d'origine professionnelle, à partir de quel taux (souvent 33 % ou 66 %) ? (2) La définition est-elle alignée sur la Sécurité sociale ? (3) Les indemnités versées pendant les 8 mois d'arrêt ont-elles bien été complétées après la franchise ? (4) En cas de licenciement : <b>portabilité</b> gratuite jusqu'à 12 mois.",
   "<span class='cr-key'>Inaptitude d'origine professionnelle</span> : (1) obligation de recherche de reclassement, après avis du CSE ; (2) en cas de licenciement, <b>indemnité spéciale = double de l'indemnité légale</b> : indemnité légale = 1/4 de mois par année jusqu'à 10 ans + 1/3 au-delà = 7 000 + 7 467 ≈ 14 467 € → indemnité spéciale ≈ <b>28 900 €</b> ; (3) <b>indemnité compensatrice</b> égale au préavis ; (4) indemnité temporaire d'inaptitude versée par la CPAM pendant le mois de recherche de reclassement ; (5) si le reclassement n'a pas été sérieusement recherché : licenciement sans cause réelle et sérieuse, avec dommages-intérêts."
  ],
  notes:"<b>Cas de synthèse (20 min) : rente AT + prévoyance + inaptitude.</b> Faire travailler par groupes de 3 ou 4, chaque groupe prenant une question, puis restitution. <b>Points de vigilance du corrigé :</b> le taux utile (25 % → 12,5 %) ; la distinction rente AT / pension d'invalidité (ici, l'accident du travail relève de la rente) ; le calcul de l'indemnité légale (1/4 de mois par an jusqu'à 10 ans, 1/3 au-delà) puis son doublement ; l'indemnité compensatrice de préavis ; l'indemnité temporaire d'inaptitude. Évoquer aussi la <b>faute inexcusable</b> : une chute de 3 m sur un chantier pose immédiatement la question des protections collectives contre les chutes de hauteur ; si elle est reconnue, la rente est majorée et les préjudices réparés. <span class='cgt'>C'est dans ces situations multi-régimes que l'accompagnement syndical fait la différence financière : ne jamais laisser le salarié seul face à l'employeur et à la caisse. Orienter vers l'UD et un avocat spécialisé pour la faute inexcusable.</span> <span class='ref'>Réf. R.434-2 CSS ; L.1226-10, L.1226-14, R.1234-2 CT ; D.433-2 et s. CSS (indemnité temporaire d'inaptitude) ; L.452-1 CSS.</span>"},

 {type:"content", title:"Synthèse — les réflexes militants",
  bullets:["Tout arrêt long : vérifier le maintien (loi, convention, accord), la subrogation et la déclaration à la prévoyance.",
   "Poser la question de l'<b>origine professionnelle</b> : TMS, lombalgies, épuisement…",
   "Consolidation : accompagner la fixation du taux d'incapacité et contester s'il est sous-évalué.",
   "Invalidité : vérifier la catégorie, la prévoyance, et rappeler que le contrat n'est pas rompu.",
   "Rupture du contrat : informer sur la portabilité.",
   "En négociation : franchises réduites, maintien du net, définitions alignées, régime pour tous."],
  strip:"Ces droits ne s'appliquent que si quelqu'un les fait valoir : c'est le rôle du syndicat.",
  notes:"<b>Six réflexes à emporter.</b> (1) Arrêt long : reconstituer avec le salarié ce qu'il touche et ce qu'il devrait toucher. (2) Origine professionnelle : la question à poser systématiquement, parce qu'elle change tout. (3) Consolidation : ne pas laisser passer un taux sous-évalué. (4) Invalidité : vérifier la catégorie et la prévoyance, défendre le maintien dans l'emploi. (5) Rupture : portabilité. (6) Négociation : améliorer le régime pour tous. <span class='cgt'>Message de fin : la prévoyance n'est ni un luxe ni une faveur, c'est du salaire différé. La défendre, c'est défendre le niveau de vie de tous les salariés quand la santé lâche — et c'est aussi faire reculer la logique qui fait payer aux salariés malades le prix de l'organisation du travail.</span>"},

 {type:"closing", title:"Prévoyance,\\ninvalidité,\\ncomplémentaires",
  sub:"Module complémentaire — Formation syndicale CGT Occitanie",
  contacts:"CGT Comité Régional Occitanie · Secteur privé · Réforme PSC fonction publique couverte",
  notes:"<b>Clôture de la demi-journée — ancrer les acquis.</b> Tour de table en deux questions : (1) « un droit ou un mécanisme que je ne connaissais pas et que je vais vérifier dans mon entreprise » ; (2) « un cas concret (collègue en arrêt, négociation prévoyance) sur lequel je me sens mieux armé·e ». Faire remplir l'évaluation. <span class='cgt'>Distribuer le mémo des réflexes : lire la fiche de paie d'un salarié en arrêt, demander la notice et le rapport annuel du régime, calculer avant de conseiller, orienter vers l'UD pour les dossiers complexes (invalidité, rente AT, faute inexcusable). Ne jamais laisser un salarié gérer seul un dossier d'inaptitude ou d'invalidité.</span>"}
];

function buildSlide(s,i){
  const div=document.createElement('div');
  const types={'title':'s-title','divider':'s-divider','content':'s-content','stats':'s-stats',

    const src=s.source?`<p class="source reveal" style="margin-top:2vh">${s.source}</p>`:'';
    const sa=s.a.style||'plain', sb=s.b.style||'plain';

  } else if(s.type==='case'){
    const qs=Array.isArray(s.questions)?s.questions.map((q,i)=>`<li><span class="qi">${i+1}</span>${q.replace(/^[①②③④⑤⑥]/,'').trim()}</li>`).join(''):'';
    const crItems=Array.isArray(s.corrige)?s.corrige.map(c=>`<li>${c}</li>`).join(''):s.corrige||'';
    const corrigeBlock=crItems?`
      <button class="btn-corrige" onclick="const c=this.nextElementSibling;c.classList.toggle('show');this.textContent=c.classList.contains('show')?'▲ Masquer le corrigé':'▼ Voir le corrigé'">▼ Voir le corrigé</button>

    const timerBlock=s.minutes>0?`<div class="timer reveal" data-min="${s.minutes}">
        <svg class="timer-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#333" stroke-width="6"/>

            stroke-dasharray="264" stroke-dashoffset="0" stroke-linecap="round"
            transform="rotate(-90 50 50)" class="timer-arc" id="tarc${i}"/>
          <text x="50" y="44" text-anchor="middle" fill="white" font-family="var(--disp,Anton)" font-size="22" font-weight="bold" class="timer-min" id="tmin${i}">${s.minutes}</text>
          <text x="50" y="60" text-anchor="middle" fill="#888" font-family="var(--ui,sans-serif)" font-size="10">min</text>
        </svg>
        <div style="display:flex;flex-direction:column;gap:.6rem">
          <button class="tbtn t-start" id="ts${i}">▶ Démarrer ${s.minutes} min</button>
          <button class="tbtn ghost t-reset" id="tr${i}">↺ Réinitialiser</button>
        </div>
      </div>`:'';
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>Cas pratique · ${s.minutes>0?s.minutes+' min':''}</div>
      <h2 class="title reveal" style="font-size:clamp(18px,2.4vw,36px)">${s.title}</h2>
      <div class="case-sc reveal">${s.scenario}</div>
      <ul class="case-q bullets reveal" style="margin-top:1.2vh">${qs}</ul>
      ${corrigeBlock}${timerBlock}`;
    if(s.minutes>0) setTimeout(()=>{
      const arc=div.querySelector(`#tarc${i}`);
      const minTxt=div.querySelector(`#tmin${i}`);
      const startBtn=div.querySelector(`#ts${i}`);
      const resetBtn=div.querySelector(`#tr${i}`);
      const total=s.minutes*60;
      let sec=total, running=false, intv=null;
      const fmt=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
      const updateArc=()=>{
        const offset=264*(1-sec/total);
        arc.style.strokeDashoffset=offset;
        arc.style.stroke=sec<=60?'var(--red)':'var(--yellow)';
        minTxt.textContent=sec>0?fmt(sec):'0:00';
        minTxt.setAttribute('fill',sec<=60?'var(--red)':'white');
      };
      updateArc();
      startBtn.addEventListener('click',()=>{
        if(!running){
          running=true;startBtn.textContent='⏸ Pause';
          intv=setInterval(()=>{
            if(sec>0){sec--;updateArc();}
            else{clearInterval(intv);running=false;startBtn.textContent='✓ Terminé';}
          },1000);
        } else {clearInterval(intv);running=false;startBtn.textContent='▶ Reprendre';}
      });
      resetBtn.addEventListener('click',()=>{
        clearInterval(intv);running=false;sec=total;updateArc();
        startBtn.textContent=`▶ Démarrer ${s.minutes} min`;
      });
    },100);
  } else if(s.type==='svg'){
    div.innerHTML=`
      <div class="kicker reveal"><span class="dot"></span>${s.kicker||'Schéma'}</div>
      <h2 class="title reveal" style="font-size:clamp(26px,3.8vw,62px)">${s.title}</h2>

  } else if(s.type==='closing'){
    div.innerHTML=`
      <div class="lockup reveal">${logoMark()}</div>
      <h1 class="title reveal">${(s.title||'').replace(/\\n/g,'<br>')}</h1>
      <p class="sub reveal">${s.sub||''}</p>
      <div class="contacts reveal">${s.contacts||''}</div>`;
  }
  return div;
}

SLIDES.forEach((s,i)=>deck.appendChild(buildSlide(s,i)));
const allSlides=deck.querySelectorAll('.slide');

function goTo(n){
  const newIdx=Math.max(0,Math.min(n,SLIDES.length-1));
  if(newIdx===cur) return;
  const dir=newIdx>cur?1:-1;
  const oldSlide=allSlides[cur];
  const newSlide=allSlides[newIdx];
  // directional transitions
  oldSlide.classList.add(dir>0?'leave-left':'leave-right');
  newSlide.classList.add(dir>0?'enter-right':'enter-left');
  newSlide.classList.add('active');
  setTimeout(()=>{
    oldSlide.classList.remove('active','leave-left','leave-right');
    newSlide.classList.remove('enter-right','enter-left');
  },400);
  cur=newIdx;
  countEl.innerHTML=`<b>${String(cur+1).padStart(2,'0')}</b> / ${SLIDES.length}`;
  barFill.style.width=`${((cur+1)/SLIDES.length)*100}%`;
  const barNum=document.getElementById('bar-num');
  if(barNum) barNum.textContent=`${cur+1} / ${SLIDES.length}`;
  notesBody.innerHTML=(SLIDES[cur].notes||'<em>Aucune note pour cette diapositive.</em>').replace(/\n/g,'<br>');
  document.getElementById('notes-slide-num').textContent=`Diapo ${cur+1} / ${SLIDES.length}`;
  if(typeof updatePresenter==='function')updatePresenter();
  // counter anim (stats)
  allSlides[cur].querySelectorAll('[data-val]:not([data-animated])').forEach(el=>{
    el.dataset.animated='1';
    const target=+el.dataset.val, pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    let start=null;
    function step(ts){
      if(!start)start=ts;
      const p=Math.min((ts-start)/1200,1);
      const val=Math.floor(Math.sqrt(p)*target);
      el.textContent=pre+val.toLocaleString('fr-FR')+suf;
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  // localStorage
  try{localStorage.setItem('cgt-prev-slide',cur);}catch(e){}
}

// Nav
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();goTo(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goTo(cur-1);}
  else if(e.key==='Home'){goTo(0);}
  else if(e.key==='End'){goTo(SLIDES.length-1);}
  else if(e.key.toLowerCase()==='o'){ovEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='n'){notesEl.classList.toggle('show');}
  else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(e.key.toLowerCase()==='a'){toggleInk();}
  else if(e.key.toLowerCase()==='l'){document.getElementById('spotlight').classList.toggle('on');}
  else if(e.key.toLowerCase()==='p'){openPresenter();}
  else if(e.key==='Escape'){ovEl.classList.remove('show');notesEl.classList.remove('show');document.getElementById('help').classList.remove('show');if(inkOn)toggleInk();}
  else if(e.key==='?'){document.getElementById('help').classList.toggle('show');}
});

(function(){

  });
  document.addEventListener("mousemove",e=>{

    const delta=startY-e.clientY;

  });
  document.addEventListener("mouseup",()=>{dragging=false;document.body.style.userSelect="";});
  handle.addEventListener("touchstart",e=>{dragging=true;startY=e.touches[0].clientY;startH=notesEl.offsetHeight;},{passive:true});
  document.addEventListener("touchmove",e=>{
    if(!dragging)return;
    const delta=startY-e.touches[0].clientY;
    const newH=Math.min(Math.max(54,startH+delta),window.innerHeight*.85);
    notesEl.style.height=newH+"px";
    if(newH<=60)notesEl.classList.add("mini"); else notesEl.classList.remove("mini");

inkCanvas.addEventListener('pointerdown',e=>{if(!inkOn)return;drawing=true;lastX=e.offsetX;lastY=e.offsetY;});
inkCanvas.addEventListener('pointermove',e=>{
  if(!inkOn||!drawing)return;
  ctx.save();
  if(inkTool==='pen'){ctx.strokeStyle='rgba(226,0,26,0.9)';ctx.lineWidth=3;ctx.globalCompositeOperation='source-over';}
  else if(inkTool==='hl'){ctx.strokeStyle='rgba(255,210,0,0.35)';ctx.lineWidth=24;ctx.globalCompositeOperation='source-over';}
  else{ctx.lineWidth=28;ctx.globalCompositeOperation='destination-out';}
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();
  ctx.restore();
  lastX=e.offsetX;lastY=e.offsetY;
});

function slideSummary(s){
  const T=Array.isArray(s.title)?s.title.join(' '):String(s.title||'').replace(/\\n/g,' ');
  const k=s.kicker||s.eyebrow||'';
  let body='';
  if(s.bullets)body=s.bullets.map(b=>'• '+b).join('<br>');
  else if(s.items&&s.type==='stats')body=s.items.map(it=>`<b>${it.p||''}${Number(it.v).toLocaleString('fr-FR')}${it.s||''}</b> — ${it.l}`).join('<br>');
  else if(s.items)body=s.items.map(it=>`<b>${it.big}</b> ${it.nm} — ${it.ds}`).join('<br>');
  else if(s.type==='two')body=`<b>${s.a.h}</b><br>${s.a.t}<br><br><b>${s.b.h}</b><br>${s.b.t}`;
  else if(s.type==='callout')body=`<b>${s.big||''}</b><br>${s.sub||''}`;
  else if(s.type==='def')body=`<b>${s.term}</b><br>${s.text}${s.extra?'<br><br>'+s.extra:''}`;
  else if(s.type==='quiz')body=`${s.q}<br>`+s.opts.map((o,j)=>`${j===s.ans?'✅':'▫️'} <b>${o.k}</b> ${o.t}`).join('<br>')+(s.explain?`<br><br><i>${s.explain}</i>`:'');
  else if(s.type==='case')body=`${s.scenario}<br><br>`+(s.questions||[]).map((q,j)=>`${j+1}. ${q}`).join('<br>');
  else if(s.type==='svg')body=s.caption||'Schéma animé — commenter au fil de l\'apparition des éléments.';
  else body=s.lede||s.sub||'';
  if(s.strip)body+=`<span class="strip">${s.strip}</span>`;
  return {T,k,body};
}

function updatePresenter(){
  if(!presWin||presWin.closed)return;
  const d=presWin.document; if(!d.getElementById('pt'))return;
  const c=slideSummary(SLIDES[cur]);
  d.getElementById('pk').textContent=plainText(c.k);
  d.getElementById('pt').innerHTML=c.T;
  d.getElementById('pb').innerHTML=c.body;
  d.getElementById('pno').innerHTML=(SLIDES[cur].notes||"<i style='color:#555'>Aucune note pour cette diapo.</i>").replace(/\n/g,'<br>');
  d.getElementById('pc').textContent=String(cur+1).padStart(2,'0')+' / '+SLIDES.length;
  const lab={content:'Contenu',stats:'Chiffres',steps:'Étapes',two:'Comparaison',callout:'Point clé',def:'Définition',case:'Atelier',quiz:'Quiz',divider:'Séquence',svg:'Schéma animé',closing:'Clôture',title:'Titre'};
  const nx=SLIDES[cur+1];
  d.getElementById('pn-title').innerHTML=nx?slideSummary(nx).T:'— Fin de la présentation —';
  d.getElementById('pn-type').textContent=nx?(lab[nx.type]||nx.type):'';
}
