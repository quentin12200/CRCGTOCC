<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CGT · Prévoyance, Invalidité & Complémentaires — Formation demi-journée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E2001A; --red-d:#A60012; --yellow:#FFD200; --ink:#141414;
  --paper:#FBFAF6; --card:#F1EFE8; --line:#E4E0D4; --muted:#6C6A63; --white:#fff;
  --disp:'Anton', 'Arial Narrow', Impact, sans-serif;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0c;color:var(--ink);font-family:var(--body)}
body{-webkit-font-smoothing:antialiased}
#deck{position:fixed;top:0;right:0;bottom:0;left:0}
.slide{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:center;
  padding:5.5vh 7vw;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(14px) scale(.995);transition:opacity .45s ease, transform .45s ease;
  background:var(--paper);
  background-image:radial-gradient(rgba(20,20,20,.035) 1px, transparent 1px);background-size:22px 22px;}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;z-index:2}
.slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--red)}
.slide.dark::before{background:var(--yellow)}
.kicker{font-family:var(--ui);font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  font-size:clamp(11px,1.25vw,18px);color:var(--red);margin-bottom:1.4vh;display:flex;align-items:center;gap:.8em}
.kicker .dot{width:.6em;height:.6em;background:var(--yellow);display:inline-block;transform:rotate(45deg)}
h1,h2{font-family:var(--disp);font-weight:400;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
.title{font-size:clamp(34px,6.2vw,104px);color:var(--ink)}
.title .em{color:var(--red)}
.lede{font-size:clamp(16px,2.1vw,30px);max-width:60ch;margin-top:2.4vh;color:#2b2b2b}
.foot{font-family:var(--ui);font-weight:700;color:var(--red);margin-top:auto;font-size:clamp(14px,1.6vw,22px);
  text-transform:uppercase;letter-spacing:.12em}
.slide.active .reveal{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
.slide.active .reveal:nth-child(2){animation-delay:.06s}
.slide.active .reveal:nth-child(3){animation-delay:.12s}
.slide.active .reveal:nth-child(4){animation-delay:.18s}
.slide.active .reveal:nth-child(5){animation-delay:.24s}
.slide.active .reveal:nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.s-title .title{font-size:clamp(40px,7.4vw,128px)}
.s-title .accent{height:14px;width:min(42vw,520px);background:var(--yellow);margin:3vh 0}
.slide.s-divider{background:var(--ink);color:var(--white);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px}
.s-divider .kicker{color:var(--yellow)}
.s-divider .title{color:var(--yellow);font-size:clamp(40px,8vw,132px)}
.s-divider .lede{color:#e8e8e8}
.s-divider .barline{height:10px;width:min(36vw,440px);background:var(--red);margin-top:3vh}
.bullets{list-style:none;margin-top:1.6vh;display:flex;flex-direction:column;gap:1.2vh;max-width:72ch}
.bullets li{position:relative;padding-left:1.3em;font-size:clamp(15px,1.85vw,27px);line-height:1.38}
.bullets li::before{content:"";position:absolute;left:0;top:.52em;width:.58em;height:.58em;background:var(--red);transform:rotate(45deg)}
.bullets.md{gap:.9vh;max-width:80ch}
.bullets.md li{font-size:clamp(13px,1.55vw,22px);line-height:1.36}
.bullets.dense{display:grid;grid-template-columns:1fr 1fr;gap:.7vh 2.5vw;max-width:100ch;margin-top:1vh;align-items:start}
.bullets.dense li{font-size:clamp(12px,1.35vw,19px);line-height:1.32}
.note-strip{margin-top:1.8vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1vh 1.4vw;font-size:clamp(12px,1.4vw,20px);max-width:76ch;border-left:8px solid var(--yellow);line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6vw;margin-top:3vh}
.stat{background:var(--white);border:1px solid var(--line);border-top:7px solid var(--red);
  padding:3vh 1.4vw;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 40px -30px rgba(0,0,0,.4)}
.stat .num{font-family:var(--disp);color:var(--red);font-size:clamp(34px,5.6vw,92px);line-height:.9}
.stat .lab{font-family:var(--body);color:#2b2b2b;font-size:clamp(12px,1.3vw,19px);margin-top:1.4vh;line-height:1.25}
.source{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:2.4vh}
.steps{display:grid;gap:1.4vw;margin-top:3vh}
.steps.n3{grid-template-columns:repeat(3,1fr)} .steps.n4{grid-template-columns:repeat(4,1fr)}
.step{background:var(--card);border:1px solid var(--line);padding:2.6vh 1.3vw;position:relative;
  transition:transform .25s ease, box-shadow .25s ease}
.step:hover{transform:translateY(-6px);box-shadow:0 22px 44px -28px rgba(0,0,0,.45)}
.step .big{font-family:var(--disp);color:var(--red);font-size:clamp(26px,3.6vw,60px);line-height:.9}
.step .nm{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  font-size:clamp(13px,1.4vw,21px);margin-top:1.2vh}
.step .ds{font-size:clamp(12px,1.25vw,19px);color:#333;margin-top:.7vh;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.8vw;margin-top:3vh}
.tc{padding:3.2vh 1.8vw;border:1px solid var(--line);background:var(--card)}
.tc.red{background:var(--red);color:#fff;border-color:var(--red)}
.tc.black{background:var(--ink);color:#fff;border-color:var(--ink)}
.tc h3{font-family:var(--ui);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(17px,2.1vw,32px)}
.tc.red h3,.tc.black h3{color:var(--yellow)}
.tc.plain h3{color:var(--red)}
.tc p{font-size:clamp(14px,1.6vw,24px);margin-top:1.6vh;line-height:1.35}
.callout{margin-top:3vh;padding:5vh 3vw;display:flex;flex-direction:column;gap:1.6vh;max-width:80ch}
.callout.black{background:var(--ink)} .callout.red{background:var(--red)}
.callout .big{font-family:var(--disp);text-transform:uppercase;line-height:1;
  font-size:clamp(24px,3.6vw,58px)}
.callout.black .big{color:var(--yellow)} .callout.red .big{color:#fff}
.callout .sub{font-size:clamp(15px,1.8vw,26px)} .callout.black .sub{color:#fff} .callout.red .sub{color:#fff}
.defbox{margin-top:2.6vh;background:var(--card);border-left:12px solid var(--red);padding:3.4vh 2.4vw;max-width:82ch}
.defbox .term{font-family:var(--ui);font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(16px,1.9vw,28px)}
.defbox .txt{font-size:clamp(17px,2.1vw,30px);margin-top:1.4vh;line-height:1.3}
.defextra{margin-top:2.2vh;background:var(--ink);color:var(--yellow);font-family:var(--ui);font-weight:600;
  padding:1.4vh 1.6vw;border-left:8px solid var(--yellow);font-size:clamp(14px,1.6vw,23px);max-width:82ch}
.quiz-q{font-size:clamp(18px,2.4vw,36px);font-weight:600;margin-top:2vh;max-width:60ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;margin-top:3vh;max-width:90ch}
.opt{font-family:var(--ui);text-align:left;background:var(--white);border:2px solid var(--line);
  padding:1.8vh 1.4vw;font-size:clamp(14px,1.6vw,23px);cursor:pointer;transition:.2s;display:flex;gap:.7em;align-items:center}
.opt:hover{border-color:var(--ink);transform:translateY(-3px)}
.opt .k{font-weight:800;color:var(--red)}
.opt.good{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.opt.good .k{color:var(--ink)}
.opt.bad{opacity:.45;border-style:dashed}
.quiz-a{margin-top:2.4vh;font-family:var(--ui);font-weight:700;color:var(--red);
  font-size:clamp(14px,1.7vw,24px);opacity:0;transition:.3s}
.quiz-a.show{opacity:1}
.case-sc{background:var(--ink);color:#eee;border-left:5px solid var(--yellow);padding:1.4vh 1.8vw;
  font-size:clamp(13px,1.4vw,20px);margin-top:.8vh;max-width:96ch;line-height:1.45;border-radius:0 6px 6px 0;
  position:relative}
.case-sc::before{content:"Scénario";position:absolute;top:-1px;left:-1px;background:var(--yellow);color:var(--ink);
  font-family:var(--ui);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;line-height:1.6}
.case-ctx{font-size:clamp(11px,1.05vw,14px);color:#6a8fa8;margin-top:.6vh;padding:.4vh 1vw;
  border-left:2px solid #334;max-width:96ch;line-height:1.5;font-style:italic;background:rgba(100,160,220,.05);border-radius:0 3px 3px 0}
.case-ctx::before{content:"Guide d'animation · ";font-weight:700;color:#4a7090;font-style:normal}
.case-q{margin-top:1.2vh;display:flex;flex-direction:column;gap:.7vh}
.case-q li{font-size:clamp(12px,1.35vw,19px) !important;list-style:none;padding:.5vh .8vw .5vh 2.8vw;
  background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.08);border-radius:5px;
  position:relative;line-height:1.3;color:var(--ink)}
.case-q li::before{content:none}
.case-q li .qi{position:absolute;left:.6vw;top:.45vh;font-family:var(--disp);color:var(--yellow);font-size:clamp(14px,1.5vw,21px);line-height:1}
.timer{display:flex;align-items:center;gap:1vw;margin-top:1.2vh;padding-top:1vh}
.btn-corrige{margin-top:1vh;font-family:var(--ui);font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;border:2px solid var(--red);background:transparent;color:var(--red);
  padding:.5vh 1.2vw;cursor:pointer;font-size:clamp(11px,1.1vw,15px);transition:.2s}
.btn-corrige:hover{background:var(--red);color:#fff}
.case-corrige{margin-top:.8vh;background:#f9f6ef;border-left:8px solid var(--red);
  padding:1vh 1.4vw;display:none;max-width:92ch}
.case-corrige.show{display:block}
.case-corrige .cr-title{font-family:var(--ui);font-weight:800;color:var(--red);
  text-transform:uppercase;letter-spacing:.06em;font-size:clamp(10px,1.1vw,15px);margin-bottom:.6vh}
.case-corrige ol{padding-left:1.3em;display:flex;flex-direction:column;gap:.35vh}
.case-corrige ol li{font-size:clamp(10px,1.05vw,15px);line-height:1.38}
.case-corrige .cr-key{color:var(--red);font-weight:700}
.tmr-display{font-family:var(--disp);font-size:clamp(26px,3.6vw,56px);color:var(--ink);line-height:.9;min-width:3.4ch}
.tmr-display.run{color:var(--red)} .tmr-display.done{color:var(--red);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.25}}
.tbtn{font-family:var(--ui);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:2px solid var(--ink);background:var(--ink);color:#fff;padding:.8vh 1.2vw;cursor:pointer;font-size:clamp(11px,1.1vw,15px)}
.tbtn.ghost{background:transparent;color:var(--ink)}
.tbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
/* slides cas pratiques : alignement haut + défilement si contenu long */
.s-case{justify-content:flex-start!important;overflow-y:auto!important;padding-top:3vh!important;padding-bottom:2vh!important}
.slide.s-closing{background:var(--ink);color:#fff;justify-content:center}
.s-closing .title{color:var(--yellow);font-size:clamp(54px,11vw,180px)}
.s-closing .sub{font-size:clamp(16px,2vw,30px);color:#eee;margin-top:2vh}
.s-closing .contacts{font-family:var(--ui);color:#bbb;margin-top:3vh;font-size:clamp(13px,1.4vw,20px);line-height:1.6}
.s-closing::before{background:var(--red)}
.svgwrap{margin-top:2.2vh;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
.svgwrap svg{width:100%;max-width:1100px;max-height:72vh;height:auto;display:block}
.svgwrap text{font-family:var(--ui)}
#ink{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#inktools{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:58;display:none;gap:8px;
  background:rgba(18,18,18,.94);padding:9px;border-radius:14px;box-shadow:0 14px 40px -16px rgba(0,0,0,.6)}
#inktools.on{display:flex}
.it{width:44px;height:44px;border-radius:10px;border:2px solid transparent;background:#2a2a2a;color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:18px;font-family:var(--ui);font-weight:800;transition:.15s}
.it:hover{background:#3a3a3a}
.it.act{border-color:#fff;background:#000}
.it.pen{color:var(--red)} .it.hl{color:var(--yellow)}
#bar{position:fixed;top:0;left:0;height:6px;background:rgba(0,0,0,.12);width:100%;z-index:50}
#bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .35s ease}
.hud{position:fixed;z-index:50;font-family:var(--ui);font-weight:700}
#count{left:24px;bottom:18px;color:var(--muted);font-size:14px;letter-spacing:.1em}
#count b{color:var(--red)}
#ctrl{right:18px;bottom:14px;display:flex;gap:8px}
.cb{width:42px;height:42px;border:1.5px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
  border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink);transition:.2s;font-size:18px}
.cb:hover{background:var(--red);color:#fff;border-color:var(--red)}
#brand{position:fixed;right:26px;top:16px;z-index:50;font-family:var(--disp);font-size:24px;color:var(--red);letter-spacing:.02em;
  background:var(--yellow);padding:2px 10px 0;line-height:1.25}
/* notes */
#notes{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,10,10,.97);color:#f4f4f4;
  transform:translateY(102%);transition:transform .35s cubic-bezier(.4,0,.2,1), height .25s ease;
  height:50vh;display:flex;flex-direction:column;
  border-top:3px solid var(--yellow);font-family:var(--ui);box-shadow:0 -8px 40px rgba(0,0,0,.6)}
#notes.show{transform:none}
#notes.mini{height:54px}
#notes.mini #notes-body{display:none}
#notes.mini #notes-min{transform:rotate(180deg)}

/* handle de drag pour resize */
#notes-handle{height:18px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
#notes-handle::before{content:"";width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
#notes-handle:hover::before{background:var(--yellow)}

#notes-head{display:flex;align-items:center;gap:10px;padding:0 20px 10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
#notes-head .n-label{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;flex:1}
#notes-head .n-slide{color:#666;font-size:11px;font-weight:600;letter-spacing:.05em;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:3px}
.notes-btn{background:none;border:1.5px solid #3a3a3a;color:#aaa;width:28px;height:28px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;padding:0;line-height:1}
.notes-btn:hover{background:var(--yellow);border-color:var(--yellow);color:#000}
#notes-close:hover{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}

#notes-body{overflow-y:auto;padding:16px 22px 20px;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
#notes .nbody{font-family:var(--body,'Georgia',serif);font-size:clamp(14px,1.35vw,18px);line-height:1.75;max-width:110ch;color:#ccc}
#notes .nbody b{color:#fff;font-weight:700}
#notes .nbody br+b,#notes .nbody>b:first-child{display:inline-block;margin-top:1em;color:var(--yellow);font-size:.78em;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(255,210,0,.2);padding-bottom:.2em;width:100%}
#notes .nbody .cgt{color:#FFD200;font-weight:600;display:block;margin-top:.8em;padding:.6em 1em;background:rgba(255,210,0,.06);border-left:3px solid var(--yellow);border-radius:0 4px 4px 0;font-family:var(--ui);font-size:.92em;line-height:1.5}
#notes .nbody .ref{color:#7aabff;font-style:italic;font-size:.84em;display:inline-block;margin-top:.4em}
#ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:rgba(12,12,12,.97);overflow:auto;padding:70px 5vw 60px;
  display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
#ov.show{display:grid}
.ovc{background:#1b1b1b;border:1px solid #2c2c2c;border-left:5px solid var(--red);padding:16px 16px 18px;cursor:pointer;
  color:#eaeaea;transition:.18s;min-height:120px;display:flex;flex-direction:column;gap:6px}
.ovc:hover{background:#262626;transform:translateY(-4px);border-left-color:var(--yellow)}
.ovc.div{border-left-color:var(--yellow);background:#000}
.ovc .n{font-family:var(--ui);font-weight:800;color:var(--red);font-size:12px;letter-spacing:.1em}
.ovc .k{font-family:var(--ui);font-weight:700;color:var(--yellow);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ovc .t{font-family:var(--disp);font-size:19px;line-height:1.02;text-transform:uppercase;color:#fff}
#ovhead{position:fixed;top:18px;left:5vw;z-index:71;color:#fff;font-family:var(--ui);font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;font-size:13px;display:none}
#ov.show ~ #ovhead{display:block}
#help{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(10,10,10,.9);display:none;place-items:center}
#help.show{display:grid}
.helpcard{background:#fff;max-width:520px;width:90%;padding:34px 38px;border-top:10px solid var(--red)}
.helpcard h3{font-family:var(--disp);font-size:30px;color:var(--red);text-transform:uppercase;margin-bottom:18px}
.helpcard dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-family:var(--ui);font-size:15px}
.helpcard dt{font-weight:800;color:var(--ink)}
.helpcard kbd{background:var(--ink);color:#fff;padding:2px 9px;border-radius:5px;font-family:var(--ui);font-size:13px}
.wordmark{font-family:var(--disp);background:var(--yellow);color:var(--red);padding:2px 10px 0;line-height:1.25;display:inline-block}
.logo-img{display:block;height:100%}
#brand.haslogo{background:transparent;padding:0;height:46px}
.lockup{display:flex;align-items:center;gap:16px;margin-bottom:2.4vh}
.lockup .wordmark{font-size:clamp(26px,3vw,40px)}
.lockup .logo-img{height:clamp(46px,6vw,84px)}
.s-title .lockup .logo-img{height:clamp(110px,15vh,190px)}
.s-closing .lockup .logo-img{height:clamp(90px,12vh,150px)}
#brand.haslogo{height:clamp(74px,9.5vh,112px)}
@media print{
  @page{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #bar,#ctrl,#brand,#count,#notes,#ov,#ovhead,#help{display:none!important}
  #deck{position:static!important}
  .slide{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
    opacity:1!important;visibility:visible!important;transform:none!important;height:100vh!important;
    page-break-after:always;break-after:page}
  .reveal{animation:none!important;opacity:1!important;transform:none!important}
  .quiz-a{opacity:1!important}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr}
  .steps.n3,.steps.n4{grid-template-columns:1fr 1fr} .opts{grid-template-columns:1fr}
  .slide{padding:8vh 8vw}
}
/* ---- 1. Circular timer ---- */
.timer-ring{width:clamp(80px,10vw,120px);height:clamp(80px,10vw,120px);flex-shrink:0}
.timer-arc{transition:stroke-dashoffset 1s linear}
/* ---- 3. Directional transitions ---- */
@keyframes slideOutLeft{to{opacity:0;transform:translateX(-60px) scale(.97)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOutRight{to{opacity:0;transform:translateX(60px) scale(.97)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-60px) scale(.97)}to{opacity:1;transform:none}}
.slide.leave-left{animation:slideOutLeft .38s cubic-bezier(.4,0,.2,1) forwards}
.slide.enter-right{animation:slideInRight .38s cubic-bezier(.4,0,.2,1) forwards}
.slide.leave-right{animation:slideOutRight .38s cubic-bezier(.4,0,.2,1) forwards}
.slide.enter-left{animation:slideInLeft .38s cubic-bezier(.4,0,.2,1) forwards}
/* ---- 4. Divider animated ---- */
.s-divider{background:linear-gradient(135deg,#0a0a0a 0%,#1a0a0a 50%,#0a0a0a 100%)!important;background-size:400% 400%!important;animation:divPulse 6s ease infinite}
@keyframes divPulse{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.s-divider .title::after{content:'';display:block;height:3px;background:var(--red);width:0;margin-top:.5rem;animation:lineGrow 1s .3s ease forwards}
@keyframes lineGrow{to{width:80px}}
/* ---- 5. Spotlight ---- */
#spotlight{position:fixed;inset:0;pointer-events:none;z-index:500;display:none}
#spotlight.on{display:block;background:radial-gradient(circle 90px at var(--mx,50%) var(--my,50%),transparent 0%,rgba(0,0,0,.75) 100%)}
/* ---- 6. Bar num badge ---- */
#bar-num{position:fixed;top:8px;right:10px;z-index:51;background:var(--yellow);color:var(--ink);font-family:var(--ui);font-weight:800;font-size:12px;padding:2px 10px;border-radius:20px;cursor:pointer;letter-spacing:.04em}
/* ---- 8. Print ---- */
@media print{
  @page{size:landscape;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #bar,#bar-num,#ctrl,#brand,#count,#notes,#ov,#ovhead,#help,#inktools,#spotlight,#btn-print-float{display:none!important}
  #deck{position:static!important}
  .slide{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;
    opacity:1!important;visibility:visible!important;transform:none!important;height:100vh!important;
    page-break-after:always;break-after:page}
  .reveal{animation:none!important;opacity:1!important;transform:none!important}
  .quiz-a{opacity:1!important}
}

/* ===== V3 : schémas animés, stagger étendu ===== */
.slide.active .reveal:nth-child(7){animation-delay:.36s}
.slide.active .reveal:nth-child(8){animation-delay:.42s}
.slide.active .reveal:nth-child(9){animation-delay:.48s}
.slide.active .reveal:nth-child(10){animation-delay:.54s}
.svgcap{font-family:var(--ui);color:var(--muted);font-size:clamp(11px,1.1vw,16px);margin-top:1.2vh;max-width:90ch}
.s-svg .svgwrap{margin-top:1.6vh}
.s-svg .svgwrap svg{max-height:66vh}
.svgwrap .t-title{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em}
.svgwrap .t-ui{font-family:var(--ui);font-weight:700}
.svgwrap .t-body{font-family:var(--body)}
/* tracés qui se dessinent (pathLength="1") */
.slide .a-draw{stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .a-draw{animation:drawLine .9s cubic-bezier(.4,0,.2,1) var(--d,0s) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
/* éléments qui apparaissent */
.slide .a-pop{opacity:0;transform-box:fill-box;transform-origin:center}
.slide.active .a-pop{animation:popIn .55s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slide .a-fade{opacity:0}
.slide.active .a-fade{animation:fadeIn .6s ease var(--d,0s) forwards}
@keyframes fadeIn{to{opacity:1}}
/* barres qui grandissent */
.slide .a-growx{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.slide.active .a-growx{animation:growX .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growX{to{transform:scaleX(1)}}
.slide .a-growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0)}
.slide.active .a-growy{animation:growY .9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
@keyframes growY{to{transform:scaleY(1)}}
/* pulsation d'un point d'attention */
.slide.active .a-pulse{animation:pulseRing 1.8s ease-out calc(var(--d,0s) + .6s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulseRing{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media print{
  .a-draw{stroke-dashoffset:0!important;animation:none!important}
  .a-pop,.a-fade{opacity:1!important;animation:none!important;transform:none!important}
  .a-growx,.a-growy{transform:none!important;animation:none!important}
  .a-pulse{display:none!important}
}
</style>
</head>

<div id="bar"><i></i></div>
<span id="bar-num" onclick="buildOv();document.getElementById('ov').classList.toggle('show')">1 / 1</span>

<div id="brand">CGT</div>
<div class="hud" id="count"><b>01</b> / 30</div>
<div class="hud" id="ctrl">

  <button class="cb" id="bNext" title="Suivant (→)">&#8250;</button>
  <button class="cb" id="bOv" title="Vue d'ensemble (O)">&#9638;</button>
  <button class="cb" id="bNotes" title="Notes formateur (N)">&#9998;</button>
  <button class="cb" id="bFull" title="Plein écran (F)">&#9974;</button>
  <button class="cb" id="bInk" title="Stylo (A)">&#9998;</button>
  <button class="cb" id="bPres" title="Mode présentateur (P)">&#10697;</button>
  <button class="cb" id="bPrint" title="Exporter PDF (Impr.)" onclick="window.print()">&#8659;</button>
  <button class="cb" id="bHelp" title="Aide (?)">?</button>
</div>
<div id="notes">
  <div id="notes-handle" title="Faire glisser pour redimensionner"></div>
  <div id="notes-head">
    <span class="n-label">✎ Notes formateur</span>

    <button class="notes-btn" id="notes-min" onclick="miniNotes()" title="Réduire / agrandir">−</button>
    <button class="notes-btn" id="notes-close" onclick="toggleNotes()" title="Fermer (N)">✕</button>
  </div>
  <div id="notes-body"><div class="nbody"></div></div>
</div>
<canvas id="ink"></canvas>
<div id="inktools">
  <button class="it pen act" data-tool="pen" title="Stylo rouge">&#9998;</button>
  <button class="it hl" data-tool="hl" title="Surligneur jaune">&#9646;</button>
  <button class="it" data-tool="erase" title="Gomme">&#8backspace;</button>
  <button class="it" id="inkClearBtn" title="Tout effacer">&#10005;</button>
  <button class="it" id="inkCloseBtn" title="Fermer (A)">&#9167;</button>
</div>
<div id="ovhead">Vue d'ensemble — cliquez une diapo</div>
<div id="ov"></div>
<div id="help"><div class="helpcard">

    <dt><kbd>&#8592;</kbd></dt><dd>Diapo précédente</dd>

    <dt><kbd>A</kbd></dt><dd>Stylo / surligneur</dd>
    <dt><kbd>N</kbd></dt><dd>Notes formateur</dd>
    <dt><kbd>F</kbd></dt><dd>Plein écran</dd>
    <dt><kbd>Échap</kbd></dt><dd>Fermer un panneau</dd>
  </dl>
</div></div>

const SLIDES = [
 {type:"title", eyebrow:"Formation syndicale CGT · demi-journée",
  title:["Prévoyance,","<span class='em'>invalidité</span>","& complémentaires"],
  lede:"IJ · maintien de salaire · invalidité · IPP · prévoyance collective · rôle des négociateur·rices CGT.",
  foot:"CGT Occitanie",
  notes:"<b>Poser le cadre de la demi-journée.</b> Ce module complète la formation AT/MP : on passe de la reconnaissance et de la réparation à la question très concrète du <b>revenu</b> et de l'<b>emploi</b> quand la santé lâche. Qu'est-ce qui rentre sur le compte quand on est en arrêt ? Que se passe-t-il après un an, deux ans, trois ans ? Que vaut une pension d'invalidité ? Que doit couvrir un bon contrat de prévoyance ? <b>Tour de table rapide :</b> « avez-vous déjà accompagné un collègue en arrêt long ? Qu'est-ce qui l'inquiétait le plus ? » (réponse fréquente : l'argent et la peur du licenciement). <span class='cgt'>Fil rouge CGT : la protection sociale complémentaire, c'est du <b>salaire socialisé</b>. Les cotisations sont payées par et pour les salariés : la CGT doit en contrôler l'usage, négocier les garanties et veiller à ce que chaque salarié touche ce à quoi il a droit.</span>"},

 {type:"content", title:"Objectifs de la demi-journée",
  bullets:["Distinguer IJ maladie et IJ AT/MP et connaître leurs taux.",
   "Comprendre le maintien de salaire : loi, convention collective, accord, prévoyance.",
   "Expliquer les trois catégories d'invalidité et leurs effets sur le contrat de travail.",
   "Articuler rente AT/MP et pension d'invalidité.",
   "Lire un tableau de garanties de prévoyance (franchises, définitions, exclusions).",
   "Identifier les leviers CGT de négociation et de contrôle."],
  notes:"<b>Un module à la fois utilitaire et militant.</b> À la fin de la demi-journée, chaque participant doit être capable : (1) de reconstituer ce que touche un collègue en arrêt et de repérer une erreur sur la fiche de paie ; (2) d'expliquer simplement l'invalidité et ce qu'elle change (ou ne change pas) au contrat de travail ; (3) de lire une notice de prévoyance et d'y trouver les pièges ; (4) de savoir quoi demander au CSE et en négociation. <b>Annoncer la méthode :</b> trois exercices de calcul sur des cas réels, des schémas animés, deux quiz. <span class='cgt'>Le délégué n'a pas besoin d'être actuaire : il doit savoir poser les bonnes questions, demander les bons documents et orienter vers l'UD pour les dossiers complexes.</span>"},

  a:{h:"Complémentaire santé (mutuelle)",t:"Rembourse les <b>frais de soins</b> : consultations, pharmacie, optique, dentaire, hospitalisation. Obligatoire dans toutes les entreprises du privé depuis 2016, financée au moins à 50 % par l'employeur. Ne verse rien pendant un arrêt de travail."},
  b:{h:"Prévoyance collective",t:"Verse des <b>prestations en espèces</b> : complément d'IJ en cas d'incapacité, rente en cas d'invalidité, capital et rentes en cas de décès. Pas d'obligation générale, sauf pour les cadres et selon la branche.",style:"black"},
  notes:"<b>Lever la confusion n°1 en salle.</b> La <b>mutuelle</b> rembourse des frais de santé. La <b>prévoyance</b> remplace un revenu perdu ou protège la famille en cas de décès. Les deux sont souvent gérées par le même organisme, dans deux contrats distincts. Un salarié peut avoir une très bonne mutuelle et aucune prévoyance : en cas d'arrêt long, ses revenus chutent. <b>Obligations :</b> la complémentaire santé est obligatoire pour tous les salariés du privé depuis le 1er janvier 2016 (financement employeur ≥ 50 %). Pour la prévoyance, il n'y a pas d'obligation légale générale : les cadres bénéficient d'une obligation conventionnelle (cotisation employeur de 1,50 % sur la tranche A) ; pour les autres, tout dépend de la convention collective et des accords. <span class='cgt'>La mutuelle, c'est le quotidien ; la prévoyance, c'est le coup dur (accident grave, cancer, décès). C'est sur la prévoyance que se jouent les plus grands écarts entre salariés : exiger un régime pour tous, cadres et non-cadres, avec des garanties solides.</span> <span class='ref'>Réf. L.911-7 CSS (santé obligatoire) ; ANI du 17 nov. 2017 (prévoyance des cadres) ; L.911-1 et L.912-1 CSS.</span>"},

{type:"callout", mode:"black", title:"Dans la fonction publique — la PSC",
  kicker:"Réforme de la protection sociale complémentaire",
  big:"Les employeurs publics doivent désormais participer à la santé et à la prévoyance de leurs agents.",
  sub:"Ordonnance n° 2021-175 du 17 février 2021 : participation obligatoire, montée en charge progressive selon le versant (État, territoriale, hospitalière), accords collectifs pouvant rendre l'adhésion obligatoire.",
  notes:"<b>Pour les agents publics présents.</b> Longtemps, les agents ont financé seuls leur mutuelle et leur prévoyance, contrairement au privé. L'ordonnance du 17 février 2021 oblige les employeurs publics à participer. Calendrier à rappeler dans ses grandes lignes : fonction publique de l'État (santé dès 2024 avec un contrat collectif ministériel, prévoyance ensuite), territoriale (participation à la prévoyance depuis 2025 et à la santé à partir de 2026), hospitalière (en cours de déploiement). Les accords collectifs peuvent rendre l'adhésion obligatoire et fixer une participation plus élevée. <b>Particularité :</b> l'agent public en maladie ordinaire passe à demi-traitement après 3 mois (et, depuis 2025, à 90 % seulement les trois premiers mois) : la garantie « perte de traitement » de la prévoyance est donc essentielle. <span class='cgt'>Levier syndical : exiger que l'accord couvre bien la prévoyance (incapacité, invalidité, décès) et pas seulement la santé, avec une participation employeur élevée et une adhésion collective qui mutualise les risques entre jeunes et anciens, malades et bien portants.</span> <span class='ref'>Réf. Ordonnance n° 2021-175 ; décrets d'application par versant. Voir aussi le guide AT/MP fonction publique.</span>"},

 {type:"divider", kicker:"Séquence 1", title:["Indemnités","journalières","& maintien de salaire"],
  notes:"<b>Partir du quotidien du salarié en arrêt.</b> Question d'ouverture : « un collègue est en arrêt maladie depuis trois mois : qu'est-ce qui arrive sur son compte ? ». Laisser répondre : souvent, personne ne sait. <span class='cgt'>C'est pourtant la première question que se posent les salariés, et un terrain où le syndicat peut faire la différence immédiatement : repérer une erreur de paie, un complément non versé, une prévoyance non déclenchée.</span>"},

 {type:"two", title:"IJ maladie vs IJ AT/MP — la part de la CPAM",
  a:{h:"Maladie ordinaire",t:"50 % du salaire journalier de base (moyenne des 3 derniers mois ÷ 91,25). <b>3 jours de carence.</b> Salaire pris en compte plafonné à 1,4 SMIC depuis avril 2025, soit environ 42 €/jour maximum.",style:"plain"},
  b:{h:"AT / maladie professionnelle",t:"Salaire du mois précédent ÷ 30,42. <b>Aucun jour de carence</b> : le jour de l'accident est payé par l'employeur. 60 % du 1er au 28e jour, <b>80 % à partir du 29e jour</b> (dans la limite de plafonds).",style:"red"},
  notes:"<b>Deux régimes très différents pour la CPAM.</b> En <b>maladie ordinaire</b> : indemnité égale à 50 % du salaire journalier de base, calculé sur les trois derniers mois ; 3 jours de carence ; depuis le 1er avril 2025, le salaire retenu est plafonné à 1,4 SMIC, ce qui limite l'indemnité à environ 42 € par jour. En <b>AT/MP</b> : calcul sur le dernier mois, pas de carence, 60 % puis 80 % à partir du 29e jour, avec des plafonds bien plus élevés. Les IJ ne supportent que la CSG et la CRDS (6,7 %), pas les cotisations salariales habituelles. <b>Attention :</b> ce n'est que la part de la CPAM ; l'employeur et la prévoyance complètent (diapos suivantes). <span class='cgt'>L'écart entre les deux régimes est l'une des meilleures raisons de faire reconnaître un AT ou une maladie professionnelle : plus d'indemnités, pas de carence, protection contre le licenciement, réparation des séquelles. Ne jamais laisser un accident du travail être traité comme une maladie ordinaire.</span> <span class='ref'>Réf. L.321-1 et R.323-4 CSS (maladie) ; L.433-1, L.433-2 et R.433-1 à R.433-4 CSS (AT/MP).</span>"},

  notes:"<b>L'empilement des trois étages (schéma animé).</b> (1) La <b>CPAM</b> verse les IJ (60 % puis 80 % du salaire journalier en AT/MP). (2) L'<b>employeur</b> complète, au titre de la loi (maintien de 90 % de la rémunération brute pendant 30 jours puis 66,66 % pendant 30 jours, durées allongées avec l'ancienneté) ou, plus souvent, au titre de la convention collective, qui peut garantir 100 % plus longtemps. (3) La <b>prévoyance</b> prend le relais quand le maintien employeur s'arrête, selon le contrat : c'est elle qui protège en arrêt long. Comme les IJ ne supportent que la CSG-CRDS, un bon maintien permet de conserver l'équivalent du salaire net. <span class='cgt'>Sans accord ni prévoyance, le salarié retombe aux seules IJ une fois le maintien légal épuisé : en maladie ordinaire, c'est une chute brutale. Vérifier la convention collective et le contrat de prévoyance de l'entreprise, et revendiquer un régime qui maintient le net pendant toute la durée de l'arrêt.</span> <span class='ref'>Réf. L.1226-1 et D.1226-1 à D.1226-8 CT ; L.433-1 CSS.</span>"},

 {type:"callout", mode:"red", title:"En AT/MP bien couvert : le salaire net est maintenu",
  big:"IJ + complément employeur + prévoyance ≈ salaire net habituel",
  sub:"Pourquoi ? Les IJ ne supportent que la CSG et la CRDS (6,7 %), pas les cotisations salariales habituelles. Avec un maintien conventionnel du salaire, le salarié en AT/MP ne perd pas de revenu — à condition que tout soit bien déclaré et versé.",
  notes:"<b>L'argument clé, à condition d'être précis.</b> Les IJ sont soumises à la CSG (6,2 %) et à la CRDS (0,5 %), mais pas aux cotisations salariales retraite, chômage ou prévoyance. Un maintien conventionnel calculé « en net » permet donc de conserver le revenu habituel. Attention toutefois : (1) le maintien légal (90 % puis 66 % du brut) n'assure pas toujours le net ; (2) les IJ AT/MP sont imposables à 50 % ; (3) tout repose sur une déclaration correcte de l'accident et une transmission rapide des attestations de salaire. <span class='cgt'>C'est une raison de plus de faire reconnaître un AT/MP : le revenu est mieux protégé, la carence disparaît, le contrat est protégé. Et c'est un point de contrôle syndical : vérifier sur la fiche de paie que le complément employeur et la prévoyance sont effectivement versés.</span> <span class='ref'>Réf. CSG-CRDS sur les revenus de remplacement ; art. 80 quinquies CGI (imposition des IJ).</span>"},

 {type:"case", title:"Exercice 1 — Lucas, magasinier victime d'un AT",
  scenario:"Lucas, 38 ans, magasinier, gagne <b>2 200 € brut/mois</b>. Ancienneté : 4 ans. Le 15 mars, il glisse sur un quai mouillé et se fracture le poignet. L'accident est déclaré en AT. Son arrêt dure 45 jours. Sa convention collective prévoit un maintien à 100 % du salaire brut pendant les 90 premiers jours. L'employeur pratique la subrogation.",
  questions:[
   "<b>Question 1 :</b> Calculez le salaire journalier de référence retenu par la CPAM pour un AT.",
   "<b>Question 2 :</b> Quel montant verse la CPAM les 28 premiers jours ? Et à partir du 29e jour ?",
   "<b>Question 3 :</b> Que reçoit Lucas au total, avec le maintien conventionnel et la subrogation ?",
   "<b>Question 4 :</b> Comparez avec son salaire net habituel. Que constatez-vous ?"
  ],
  minutes:15,
  corrige:[
   "<span class='cr-key'>Salaire journalier AT/MP</span> = salaire brut du mois précédent ÷ 30,42 = 2 200 ÷ 30,42 = <b>72,32 €/jour</b>. En AT/MP, on retient le dernier mois (et non les 3 derniers mois ÷ 91,25 comme en maladie).",
   "<span class='cr-key'>IJ CPAM jours 1 à 28</span> : 60 % × 72,32 = <b>43,39 €/jour</b>, sans carence (le jour de l'accident est payé par l'employeur). Sur 28 jours : environ 1 215 €.",
   "<span class='cr-key'>IJ CPAM jours 29 à 45</span> : 80 % × 72,32 = <b>57,86 €/jour</b>. Sur 17 jours : environ 984 €.",
   "<span class='cr-key'>Maintien conventionnel + subrogation</span> : la convention garantit 100 % du brut pendant 90 jours. L'employeur verse le salaire habituel sur la fiche de paie et perçoit les IJ à la place de Lucas (subrogation). Lucas ne subit aucune rupture de revenu.",
   "<span class='cr-key'>Net perçu</span> : la part correspondant aux IJ ne supporte que la CSG-CRDS (6,7 %), pas les cotisations salariales. Le net de Lucas est donc au moins égal à son net habituel, souvent légèrement supérieur. Conclusion : en AT/MP bien couvert, l'arrêt ne coûte rien au salarié — d'où l'importance de faire reconnaître l'accident."
  ],
  notes:"<b>Exercice de calcul (15 min) — travail en binômes.</b> Distribuer une calculatrice par binôme. Laisser chercher 10 minutes, puis corriger avec le bouton « corrigé ». Points d'attention : la base de calcul AT/MP (dernier mois ÷ 30,42) ; l'absence de carence ; le passage à 80 % au 29e jour ; la mécanique de la subrogation (l'employeur avance le salaire et récupère les IJ). <span class='cgt'>Message à retenir : en AT/MP avec un bon maintien conventionnel, le salarié ne perd rien. L'enjeu syndical est de s'assurer que l'accident est bien déclaré comme tel, et que le maintien prévu par la convention est réellement appliqué : vérifier la fiche de paie avec le salarié.</span> <span class='ref'>Réf. R.433-4 CSS (salaire journalier AT) ; R.323-11 CSS (subrogation).</span>"},

 {type:"steps", title:"Les trois étages du maintien de salaire",
  items:[{big:"Loi",nm:"Mensualisation (L.1226-1)",ds:"Après 1 an d'ancienneté : 90 % du brut pendant 30 jours, puis 66,66 % pendant 30 jours, durées allongées de 10 jours par tranche de 5 ans. Carence de 7 jours en maladie, aucune en AT/MP."},
   {big:"CCN",nm:"Convention collective",ds:"Durée et taux souvent plus favorables : 100 % du salaire, carence supprimée, ancienneté requise réduite."},
   {big:"Accord",nm:"Accord d'entreprise / prévoyance",ds:"Peut aller au-delà de la convention et organiser le relais par un organisme de prévoyance pour les arrêts longs."}],
  notes:"<b>La logique d'empilement : la loi est un plancher.</b> <b>Loi</b> (mensualisation) : condition d'un an d'ancienneté ; 90 % de la rémunération brute (IJ comprises) pendant 30 jours puis 66,66 % pendant 30 jours ; ces durées augmentent de 10 jours par période de 5 ans d'ancienneté, dans la limite de 90 jours chacune ; carence de 7 jours en maladie ordinaire, aucune en AT/MP ; les durées s'apprécient sur 12 mois glissants. <b>Convention collective</b> : souvent bien plus favorable. <b>Accord d'entreprise et prévoyance</b> : peuvent encore améliorer. <span class='cgt'>Toujours vérifier la convention collective applicable (sur Légifrance) et les accords d'entreprise : la règle la plus favorable s'applique. Beaucoup de salariés et même de services RH ne connaissent que le minimum légal.</span> <span class='ref'>Réf. L.1226-1, D.1226-1 à D.1226-8 CT.</span>"},

 {type:"callout", mode:"black", title:"La subrogation",
  big:"L'employeur maintient le salaire et perçoit les IJ à la place du salarié.",
  sub:"Elle est de droit lorsque l'employeur maintient au moins l'équivalent des IJ. Sans subrogation, le salarié perçoit lui-même les IJ : vigilance sur les délais de versement.",
  notes:"<b>La subrogation : mécanisme et enjeux pratiques.</b> Lorsque l'employeur maintient le salaire pendant l'arrêt, il est subrogé de plein droit dans les droits du salarié aux IJ, dans la limite des sommes qu'il verse : la CPAM lui verse directement les IJ et le salarié perçoit son salaire habituel sans rupture de trésorerie. Sans subrogation, le salarié reçoit les IJ de la CPAM d'un côté et le complément de l'employeur de l'autre, souvent avec retard. <b>Point de vigilance :</b> à la fin du maintien employeur, la subrogation s'arrête ; le salarié doit alors percevoir les IJ directement, et la prévoyance doit avoir été déclarée pour prendre le relais. <span class='cgt'>Anticiper ces bascules avec le salarié : le prévenir avant la fin du maintien, vérifier que l'attestation de salaire a été transmise à la CPAM et que le dossier de prévoyance est ouvert. Beaucoup de pertes de revenus viennent de déclarations oubliées.</span> <span class='ref'>Réf. R.323-11 CSS ; L.1226-1 CT.</span>"},

    <text class="a-fade" style="--d:1.7s" x="970" y="188" fill="#141414">50 %</text>
  </g>
  <g class="t-ui" font-size="15" fill="#141414" text-anchor="middle">
    <text x="180" y="405">J1 à J3</text><text x="180" y="425" font-size="13" fill="#6C6A63">carence CPAM</text>
    <text x="310" y="405">J4 à J7</text><text x="310" y="425" font-size="13" fill="#6C6A63">IJ seules</text>
    <text x="500" y="405">J8 à J37</text><text x="500" y="425" font-size="13" fill="#6C6A63">maintien 90 %</text>
    <text x="750" y="405">J38 à J67</text><text x="750" y="425" font-size="13" fill="#6C6A63">maintien 66,66 %</text>
    <text x="970" y="405">Au-delà</text><text x="970" y="425" font-size="13" fill="#6C6A63">IJ seules (plafonnées)</text>
  </g>
  <g class="a-pop" style="--d:2s"><rect x="660" y="445" width="410" height="22" fill="none"/><text x="1065" y="462" text-anchor="end" class="t-ui" font-size="15" fill="#E2001A">→ Sans prévoyance, la chute est brutale</text></g>
</svg>`,
  notes:"<b>La « falaise » du maintien légal (schéma animé).</b> Pour un salarié ayant entre 1 et 5 ans d'ancienneté, en maladie ordinaire, sans convention plus favorable : <b>J1 à J3</b> : carence de la CPAM, et carence de 7 jours du maintien employeur ; <b>J4 à J7</b> : seules les IJ (50 %) ; <b>J8 à J37</b> : maintien employeur à 90 % du brut ; <b>J38 à J67</b> : 66,66 % ; <b>au-delà</b> : retour aux seules IJ, plafonnées. Avec plus d'ancienneté, les périodes de maintien s'allongent. <b>Question au groupe :</b> « dans votre convention collective, quel est le maintien prévu ? ». <span class='cgt'>Ce schéma montre pourquoi la prévoyance et les accords comptent : sans eux, un salarié malade perd la moitié de son revenu au bout de deux mois. La revendication CGT : suppression des jours de carence, maintien du salaire net pour toute la durée de l'arrêt, financé par l'employeur et un régime de prévoyance mutualisé.</span> <span class='ref'>Réf. L.1226-1, D.1226-1 et s. CT ; R.323-1 CSS (carence de 3 jours).</span>"},

 {type:"content", title:"Les pièges à éviter",
  bullets:["Les durées de maintien s'apprécient sur <b>12 mois glissants</b> : plusieurs arrêts dans l'année les épuisent.",
   "La <b>franchise</b> du contrat de prévoyance (souvent 90 jours) peut laisser un trou si le maintien employeur s'arrête avant.",
   "Le salaire de référence d'un <b>temps partiel</b> ou d'un salarié aux revenus variables est souvent mal calculé.",
   "La prévoyance ne paie <b>que si elle est déclarée</b> : l'employeur doit ouvrir le dossier auprès de l'organisme."],
  strip:"Vérifier chaque situation au cas par cas : la règle générale masque souvent une exception favorable — ou une erreur.",
  notes:"<b>Les quatre pièges les plus fréquents.</b> (1) <b>Arrêts successifs</b> : les durées de maintien légal s'apprécient sur 12 mois ; un salarié souvent arrêté découvre que son maintien est épuisé. (2) <b>Trou entre maintien et prévoyance</b> : si la prévoyance démarre au 91e jour et que le maintien légal s'arrête au 67e, le salarié reste plusieurs semaines aux seules IJ ; vérifier la cohérence entre convention et contrat. (3) <b>Bases de calcul</b> : primes, heures supplémentaires, temps partiel thérapeutique, revenus variables, souvent mal intégrés. (4) <b>Déclaration à l'assureur</b> : faute de dossier ouvert par l'employeur, l'organisme ne verse rien. Autres pièges : exclusions (maladies antérieures à l'adhésion, affections psychiques mal définies) et définitions restrictives de l'invalidité. <span class='cgt'>Le délégué doit savoir lire une fiche de paie d'un salarié en arrêt : complément employeur présent ? IJ subrogées ? prévoyance déclenchée ? taux conforme à la convention ? Des droits restent souvent non versés faute de déclaration : c'est là que l'action syndicale rapporte immédiatement.</span>"},

 {type:"case", title:"Exercice 2 — Fatima, ouvrière en arrêt maladie longue durée",
  scenario:"Fatima, 41 ans, ouvrière de confection, souffre de TMS (tendinites aux deux poignets). Elle est en <b>arrêt maladie ordinaire</b> depuis 4 mois. Salaire : <b>1 900 € brut/mois</b>. Ancienneté : 3 ans. Sa convention collective prévoit un maintien à 100 % du salaire pendant 60 jours, après une carence de 3 jours. Elle vous appelle : le premier mois, elle touchait environ 1 450 € net ; ce mois-ci, elle reçoit beaucoup moins et ne comprend pas pourquoi.",
  questions:[
   "<b>Question 1 :</b> Calculez le salaire journalier de base en maladie et le montant de l'IJ de la CPAM.",
   "<b>Question 2 :</b> Comment s'articulent le maintien légal et le maintien conventionnel ?",
   "<b>Question 3 :</b> Reconstituez ce que Fatima perçoit mois par mois et expliquez la baisse.",
   "<b>Question 4 :</b> Les TMS sont probablement d'origine professionnelle : quel conseil donnez-vous ?"
  ],
  minutes:15,
  corrige:[
   "<span class='cr-key'>Salaire journalier de base</span> = (1 900 × 3) ÷ 91,25 = <b>62,47 €/jour</b>. IJ CPAM = 50 % = <b>31,23 €/jour</b>, versée à partir du 4e jour (3 jours de carence). Le plafond de 1,4 SMIC n'est pas atteint ici.",
   "<span class='cr-key'>Maintien</span> : la loi garantirait 90 % puis 66,66 % du brut pendant 30 + 30 jours après 7 jours de carence. La convention est plus favorable (100 % pendant 60 jours après 3 jours) : c'est elle qui s'applique.",
   "<span class='cr-key'>Mois par mois</span> — Mois 1 et 2 : maintien conventionnel à 100 % (hors 3 jours de carence) ≈ salaire habituel. Mois 3 et 4 : le maintien est épuisé ; il ne reste que l'IJ de la CPAM ≈ 31,23 × 30 ≈ <b>937 € par mois</b>, moins la CSG-CRDS. D'où la chute brutale. Si un régime de prévoyance existe, il devrait prendre le relais : vérifier qu'il a été déclaré.",
   "<span class='cr-key'>Conseil CGT</span> : (1) faire déclarer les TMS en <b>maladie professionnelle</b> (tableau 57 du régime général : syndrome du canal carpien, tendinites…). Si elle est reconnue, les IJ passent au régime AT/MP (60 % puis 80 %, pas de carence) et le contrat est protégé. (2) Vérifier la prévoyance et l'ouverture du dossier. (3) Demander une visite de pré-reprise auprès du médecin du travail pour préparer un aménagement de poste."
  ],
  notes:"<b>Cas Fatima : la chute des revenus en maladie ordinaire.</b> Ce cas reproduit une situation très fréquente : un salarié qui touche son salaire pendant deux mois, puis découvre une baisse de moitié. Faire reconstituer la chronologie au tableau. <b>Points clés :</b> carence ; maintien conventionnel puis fin du maintien ; IJ seules ; absence de relais par la prévoyance (contrat absent ou non déclaré). <span class='cgt'>L'enjeu syndical : repérer que la pathologie de Fatima (TMS liés à des gestes répétitifs) relève très probablement d'une maladie professionnelle non déclarée. La faire reconnaître change tout : meilleures indemnités, protection contre le licenciement, rente en cas de séquelles. C'est l'un des actes syndicaux les plus utiles financièrement.</span> <b>Question au groupe :</b> quels éléments recueillir auprès de Fatima pour la déclaration de MP ? (poste, gestes, cadences, durée d'exposition, certificat médical). <span class='ref'>Réf. tableau n° 57 du régime général ; L.461-1 CSS.</span>"},

 {type:"divider", kicker:"Séquence 2", title:["L'invalidité","de la Sécurité","sociale"],
  notes:"<b>Changer de registre.</b> On quitte l'arrêt temporaire pour une situation durable : l'état de santé est stabilisé mais la capacité de travail reste fortement réduite. <b>Question d'ouverture :</b> « que se passe-t-il au bout de trois ans d'arrêt maladie ? ». Réponse : les IJ s'arrêtent ; si la capacité de travail est réduite d'au moins deux tiers, une pension d'invalidité peut prendre le relais. <span class='cgt'>L'invalidité n'est pas une sortie de l'entreprise : le contrat continue, et c'est le médecin du travail, pas la CPAM, qui se prononce sur l'aptitude au poste.</span>"},

 {type:"def", title:"L'invalidité — définition",
  term:"Article L.341-1 du Code de la sécurité sociale",
  text:"L'assuré a droit à une pension d'invalidité lorsque son état de santé réduit d'au moins deux tiers sa capacité de travail ou de gain.",
  extra:"Reconnue par le médecin-conseil, à la fin des IJ, après stabilisation de l'état de santé, ou à la demande de l'assuré. Conditions : ne pas avoir atteint l'âge légal de la retraite, justifier de 12 mois d'immatriculation et d'un minimum d'heures travaillées ou de cotisations.",
  notes:"<b>L'invalidité de la Sécurité sociale : définition et conditions.</b> Elle concerne les maladies et accidents <b>non professionnels</b> (pour les AT/MP, c'est le taux d'incapacité permanente qui s'applique). Elle suppose une réduction d'au moins deux tiers de la capacité de travail ou de gain, appréciée par le médecin-conseil en tenant compte de l'état de santé, de l'âge, des capacités restantes, de la formation et du métier. <b>Conditions administratives</b> : avoir moins que l'âge légal de départ en retraite ; être immatriculé depuis au moins 12 mois ; avoir travaillé au moins 600 heures ou cotisé sur un salaire suffisant au cours des 12 mois précédant l'arrêt. La demande peut être faite par l'assuré lui-même, sans attendre la fin des IJ. <span class='cgt'>Ne pas attendre passivement la décision de la caisse : accompagner le salarié, rassembler les certificats médicaux, demander à consulter le rapport médical, et contester si la catégorie est sous-évaluée (commission médicale de recours amiable dans les 2 mois).</span> <span class='ref'>Réf. L.341-1 à L.341-4, R.341-2 et R.313-5 CSS ; L.142-6 (contestations médicales).</span>"},

 {type:"svg", kicker:"Les trois catégories", title:"Combien rapporte une pension d'invalidité ?",
  caption:"Pension calculée sur le salaire annuel moyen (SAM) des 10 meilleures années, avec un minimum garanti et un plafond (30 % ou 50 % du plafond de la Sécurité sociale).",
  svg:`<svg viewBox="0 0 1100 460" role="img" aria-label="Catégories d'invalidité">
  <g class="t-ui" font-size="18" fill="#141414">

</svg>`,
  notes:"<b>Les trois catégories (schéma animé).</b> <b>Catégorie 1</b> : invalide capable d'exercer une activité rémunérée — pension de 30 % du salaire annuel moyen (SAM) des 10 meilleures années. <b>Catégorie 2</b> : invalide absolument incapable d'exercer une profession quelconque — 50 % du SAM. <b>Catégorie 3</b> : comme la catégorie 2, avec en plus l'obligation de recourir à une tierce personne pour les actes ordinaires de la vie — 50 % du SAM + une majoration pour tierce personne (montant forfaitaire, de l'ordre de 1 200 € par mois). Les pensions sont plafonnées (30 % ou 50 % du plafond mensuel de la Sécurité sociale) et un montant minimum est garanti. <span class='cgt'>Le classement en catégorie 1 plutôt que 2 fait passer la pension de 30 % à 50 % : vérifier le classement et contester s'il ne correspond pas à la réalité. Rappeler aussi qu'une pension de 30 % ou 50 % ne permet presque jamais de vivre : c'est la prévoyance collective qui doit compléter.</span> <span class='ref'>Réf. L.341-4, R.341-4 et s., L.355-1 CSS (majoration tierce personne).</span>"},

 {type:"two", title:"Pension d'invalidité — ordres de grandeur",
  a:{h:"Catégorie 1 — 30 % du SAM",t:"Plafond : 30 % du plafond mensuel de la Sécurité sociale (environ 1 200 €/mois). Un minimum est garanti. Cumulable avec un salaire, dans certaines limites."},
  b:{h:"Catégories 2 et 3 — 50 % du SAM",t:"Plafond : 50 % du plafond mensuel de la Sécurité sociale (environ 2 000 €/mois). Catégorie 3 : + majoration forfaitaire pour tierce personne.",style:"red"},
  source:"Montants revalorisés chaque 1er avril : consulter ameli.fr avant de chiffrer un dossier.",
  notes:"<b>Donner des ordres de grandeur, pas des montants figés.</b> Les montants sont revalorisés chaque année au 1er avril : toujours vérifier sur ameli.fr avant de chiffrer un dossier. Retenir : la pension dépend du salaire des 10 meilleures années ; elle est plafonnée ; elle est soumise à la CSG, à la CRDS et à l'impôt sur le revenu. <b>Cumul avec un salaire :</b> possible, dans la limite d'un plafond fondé sur le salaire antérieur ; au-delà, la pension est réduite. <span class='cgt'>L'objectif d'un bon régime de prévoyance est de compléter la pension pour atteindre au moins 75 à 80 % du salaire antérieur — et plus pour les bas salaires, pour qui chaque euro compte. C'est un axe de négociation prioritaire.</span> <span class='ref'>Réf. R.341-4 et s. CSS ; L.341-12 (cumul avec une activité).</span>"},

 {type:"content", title:"Effets de la pension d'invalidité sur le contrat",
  bullets:["La pension d'invalidité <b>ne rompt pas</b> le contrat de travail.",
   "Seul le <b>médecin du travail</b> se prononce sur l'aptitude au poste : classement en invalidité ≠ inaptitude.",
   "Une reprise est possible, éventuellement à temps partiel, avec cumul pension + salaire dans certaines limites.",
   "L'employeur ne peut pas licencier au motif de l'état de santé ou de l'invalidité (discrimination).",
   "À l'âge légal de la retraite, la pension est remplacée par une retraite pour inaptitude au taux plein."],
  strip:"L'invalidité n'est pas une porte de sortie de l'entreprise : c'est un droit qui se défend.",
  notes:"<b>Point militant clé : invalidité et emploi.</b> Le classement en invalidité, même en catégorie 2, ne rompt pas le contrat et ne vaut pas inaptitude. Si le salarié souhaite reprendre, il passe une visite de reprise : le médecin du travail se prononce sur l'aptitude, propose des aménagements ou constate l'inaptitude. Un licenciement fondé sur l'état de santé ou l'invalidité est discriminatoire et nul. En cas d'inaptitude, l'employeur doit rechercher un reclassement avant tout licenciement. À l'âge légal, la pension cesse et le salarié perçoit une retraite au taux plein pour inaptitude, sauf s'il poursuit une activité. <span class='cgt'>Ne jamais laisser croire à un salarié qu'il « doit » démissionner ou qu'il est « automatiquement » licencié parce qu'il est en invalidité. Le contrat suspendu continue d'ouvrir des droits, notamment à la prévoyance.</span> <span class='ref'>Réf. L.1132-1 et L.1226-2 CT ; L.341-15 et L.341-16 CSS.</span>"},

 {type:"divider", kicker:"Séquence 3", title:["Rente AT/MP","et invalidité","maladie"],
  notes:"<b>Deux régimes, deux logiques, parfois les deux à la fois.</b> Un salarié peut avoir eu un accident du travail (rente AT/MP) et développer par ailleurs une maladie invalidante (pension d'invalidité). <span class='cgt'>Bien distinguer les deux évite des erreurs de conseil coûteuses : la reconnaissance en AT/MP ouvre des droits plus protecteurs.</span>"},

 {type:"two", title:"Deux régimes, deux logiques",
  a:{h:"Rente AT/MP (incapacité permanente)",t:"Répare les séquelles d'un accident du travail ou d'une maladie professionnelle. Capital si le taux est inférieur à 10 %, <b>rente viagère</b> au-delà. Non imposable.",style:"plain"},
  b:{h:"Pension d'invalidité",t:"Compense la perte de capacité de travail ou de gain due à une maladie ou un accident non professionnel. Cesse à l'âge légal de la retraite. Imposable.",style:"black"},
  notes:"<b>Deux prestations distinctes, deux branches de la Sécurité sociale.</b> La <b>branche AT/MP</b>, financée par les seuls employeurs, répare les séquelles d'un accident ou d'une maladie d'origine professionnelle : taux d'incapacité permanente fixé à la consolidation ; capital en dessous de 10 %, rente viagère à partir de 10 %, calculée sur le salaire des 12 derniers mois multiplié par un « taux utile » ; non imposable ; à vie. La <b>branche maladie</b> verse la pension d'invalidité pour les maladies et accidents de la vie : fondée sur la perte de capacité de gain, calculée sur les 10 meilleures années, imposable, remplacée par la retraite à l'âge légal. <span class='cgt'>La rente AT/MP est à vie et peut être majorée en cas de faute inexcusable de l'employeur : encore une raison de toujours faire reconnaître l'origine professionnelle quand elle existe.</span> <span class='ref'>Réf. L.434-1, L.434-2, R.434-2 CSS (rente AT/MP) ; L.341-1 et s. (invalidité).</span>"},

 {type:"callout", mode:"black", title:"Le cumul est possible",
  big:"Une rente AT/MP et une pension d'invalidité peuvent se cumuler.",
  sub:"Lorsque l'invalidité résulte d'une autre affection que l'AT/MP, les deux sont versées. Quand elles portent sur les mêmes séquelles, des règles d'articulation s'appliquent : faire simuler le dossier avant toute démarche.",
  notes:"<b>Cumul : le principe et ses limites.</b> Une personne peut être titulaire d'une rente AT/MP (pour un accident du travail ancien) et d'une pension d'invalidité (pour une maladie sans lien avec le travail) : les deux sont versées. Lorsque l'état d'invalidité est en partie lié aux séquelles de l'AT/MP, le médecin-conseil en tient compte et des règles de coordination limitent le cumul. En pratique, chaque dossier est particulier. <span class='cgt'>Ne jamais conseiller « au jugé » : faire simuler les deux scénarios (avec l'appui de l'UD) avant toute démarche, et vérifier ce que prévoit le contrat de prévoyance, qui peut lui aussi tenir compte de la rente et de la pension pour calculer son complément.</span> <span class='ref'>Réf. L.341-1 et s. et L.434-2 CSS.</span>"},
