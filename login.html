<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Accès — CGT Occitanie Formation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23E2001A'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23FFD200'%3ECGT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #141414;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Archivo', sans-serif;
      padding: 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .logo-block {
      background: #E2001A;
      padding: 1.5rem 2rem 1.25rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
    }
    .logo-block img {
      height: 72px;
      width: auto;
      background: white;
      padding: 4px 7px;
    }
    .logo-block h1 {
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      letter-spacing: .06em;
      color: #fff;
      text-align: center;
      line-height: 1.3;
    }
    .stripe { height: 5px; background: #FFD200; width: 100%; }
    .form-block {
      background: #1E1E1E;
      border: 1px solid #2E2E2E;
      border-top: none;
      width: 100%;
      padding: 2rem 1.75rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .field label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #9A9A9A;
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      background: #141414;
      border: 2px solid #2E2E2E;
      color: #FBFAF6;
      font-family: 'Archivo', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .12em;
      padding: .75rem 1rem;
      outline: none;
      transition: border-color .15s;
      text-transform: uppercase;
    }
    .field input:focus { border-color: #E2001A; }
    .field input::placeholder { color: #444; text-transform: none; letter-spacing: 0; }
    .btn-login {
      background: #E2001A;
      color: #fff;
      border: none;
      width: 100%;
      padding: .85rem;
      font-family: 'Archivo', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #C40017; }
    .error {
      display: none;
      background: #3A0008;
      border: 1px solid #E2001A;
      color: #FF6B7A;
      font-size: .8rem;
      padding: .6rem .85rem;
      text-align: center;
    }
    .hint {
      font-size: .72rem;
      color: #555;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo-block">
    <img src="/assets/logo-cgt-occitanie.jpg" alt="CGT Comité Régional Occitanie">
    <h1>Espace Formation Syndicale<br>CGT Occitanie</h1>
  </div>
  <div class="stripe"></div>
  <div class="form-block">
    <div class="error" id="error">Code incorrect — réessayez.</div>
    <div class="field">
      <label for="code">Code d'accès</label>
      <input type="password" id="code" placeholder="••••••••" autocomplete="off" autofocus>
    </div>
    <button class="btn-login" onclick="valider()">Accéder</button>
    <p class="hint">Accès réservé aux formateurs et stagiaires CGT Occitanie.<br>Code communiqué par votre formateur.</p>
  </div>
</div>

<script>
/* Modifier le code ici */
const CODE = 'CGTOCC';

function valider() {
  const v = document.getElementById('code').value.trim().toUpperCase();
  if (v === CODE) {
    sessionStorage.setItem('cgt_auth', 'ok');
    const p = new URLSearchParams(location.search).get('from') || '/';
    location.replace(p);
  } else {
    document.getElementById('error').style.display = 'block';
    document.getElementById('code').value = '';
    document.getElementById('code').focus();
  }
}

document.getElementById('code').addEventListener('keydown', e => {
  if (e.key === 'Enter') valider();
});

/* Déjà connecté → rediriger */
if (sessionStorage.getItem('cgt_auth') === 'ok') {
  const p = new URLSearchParams(location.search).get('from') || '/';
  location.replace(p);
}
</script>

</body>
</html>
