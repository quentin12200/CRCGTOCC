<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Accès — CGT Occitanie Formation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23E2001A'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23FFD200'%3ECGT%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F0F0F;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Archivo', sans-serif;
      padding: 1.5rem;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      border: 1px solid #2A2A2A;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
      display: flex;
      flex-direction: column;
    }
    .logo-block {
      background: #0F0F0F;
      padding: 2rem 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .logo-block img {
      height: 80px;
      width: auto;
      background: #fff;
      padding: 6px;
      display: block;
    }
    .logo-block h1 {
      font-family: 'Anton', sans-serif;
      font-size: 1.6rem;
      letter-spacing: .04em;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }
    .logo-block .subtitle {
      font-family: 'Archivo', sans-serif;
      font-weight: 500;
      font-size: .8rem;
      color: #888;
      text-align: center;
    }
    .stripe { height: 4px; background: #FFD200; width: 100%; }
    .form-block {
      background: #0F0F0F;
      border-top: none;
      width: 100%;
      padding: 2rem 1.75rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .field label {
      display: block;
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: .4rem;
    }
    .field input {
      width: 100%;
      background: #1A1A1A;
      border: 1px solid #333;
      color: #fff;
      font-family: 'Archivo', sans-serif;
      font-size: 1rem;
      padding: .9rem 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: #E2001A;
      box-shadow: 0 0 0 3px rgba(226,0,26,.2);
    }
    .field input::placeholder { color: #555; }
    .btn-login {
      background: #E2001A;
      color: #fff;
      border: none;
      width: 100%;
      padding: .9rem;
      font-family: 'Anton', sans-serif;
      font-size: 1rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #C40017; }
    .error {
      display: none;
      color: #E2001A;
      font-size: .85rem;
      text-align: center;
    }
    .alt-link {
      font-size: .72rem;
      color: #555;
      text-align: center;
    }
    .alt-link a { color: #777; text-decoration: underline; }
    .alt-link a:hover { color: #aaa; }
    .footer {
      font-size: .72rem;
      color: #555;
      text-align: center;
      padding: 1.25rem 1.75rem 1.5rem;
      background: #0F0F0F;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo-block">
    <img src="/assets/logo-cgt-occitanie.jpg" alt="CGT Comité Régional Occitanie">
    <h1>Espace Formateur CGT</h1>
    <p class="subtitle">CGT Occitanie — Accès réservé</p>
  </div>
  <div class="stripe"></div>
  <div class="form-block">
    <div class="field">
      <label for="code">Code d'accès</label>
      <input type="password" id="code" placeholder="••••••••" autocomplete="off" autofocus>
    </div>
    <button class="btn-login" onclick="valider()">Entrer</button>
    <div class="error" id="error">Code incorrect — réessayez.</div>
    <p class="alt-link">Stagiaire ? <a href="/login-stagiaire.html">Accès stagiaire →</a></p>
  </div>
  <div class="footer">Formation syndicale — CGT Occitanie</div>
</div>

<script>
/* Modifier le code ici */
const CODE = 'CGTOCC';

function valider() {
  const v = document.getElementById('code').value.trim().toUpperCase();
  if (v === CODE) {
    localStorage.setItem('cgt_auth', 'ok');
    const p = new URLSearchParams(location.search).get('from') || '/';
    location.replace(p);
  } else {
    document.getElementById('error').style.display = 'block';
    document.getElementById('code').value = '';
    document.getElementById('code').focus();
  }
}

document.getElementById('code').addEventListener('keydown', e => {
  if (e.key === 'Enter') valider();
});

/* Déjà connecté → rediriger */
if (localStorage.getItem('cgt_auth') === 'ok') {
  const p = new URLSearchParams(location.search).get('from') || '/';
  location.replace(p);
}
</script>

</body>
</html>
