<html lang="fr">

  <title>FAQ AT/MP — CGT Occitanie</title>

  <link rel="stylesheet" href="/assets/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rouge: #E2001A; --jaune: #FFD200;
      --fond: #F4F6FA; --fond-card: #FFFFFF;
      --texte: #1A2540; --texte-muted: #5A6A84;
      --border: #D8DEE8; --accent: #1A5FAD;
      --vert: #2ECC71; --vert-bg: #E8FAF0;
      --orange: #F57C00;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fond: #101620; --fond-card: #172033;
        --texte: #E6ECF5; --texte-muted: #7D8FA8;
        --border: #253047; --accent: #4A8FD4;
        --vert-bg: #0D2B1A;
      }
    }
    :root[data-theme="dark"] {
      --fond: #101620; --fond-card: #172033;
      --texte: #E6ECF5; --texte-muted: #7D8FA8;
      --border: #253047; --accent: #4A8FD4;
      --vert-bg: #0D2B1A;
    }
    body { background: var(--fond); color: var(--texte); font-family: 'Archivo', sans-serif; min-height: 100vh; padding: 0 0 4rem; }

    .topbar { background: var(--rouge); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .topbar-badge { font-family: 'Anton', sans-serif; font-size: 1.1rem; color: var(--jaune); letter-spacing: .06em; }
    .topbar-title { font-family: 'Anton', sans-serif; font-size: 1rem; color: #fff; letter-spacing: .04em; }
    .topbar-back { margin-left: auto; color: rgba(255,255,255,.75); font-size: .8rem; text-decoration: none; }
    .topbar-back:hover { color: #fff; }
    .stripe { height: 4px; background: var(--jaune); }

    .hero { background: linear-gradient(135deg, #0D1A35 0%, #0A1525 100%); border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; text-align: center; }
    .hero-icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .hero h1 { font-family: 'Anton', sans-serif; font-size: clamp(1.4rem, 4vw, 2rem); color: var(--jaune); letter-spacing: .04em; margin-bottom: .5rem; }
    .hero p { font-size: .9rem; color: rgba(255,255,255,.7); max-width: 52ch; margin: 0 auto; line-height: 1.6; }

    .content { max-width: 740px; margin: 0 auto; padding: 1.5rem 1rem 0; }

    .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
    .filter-btn {
      background: var(--fond-card); border: 1px solid var(--border); color: var(--texte-muted);
      padding: .4rem .9rem; font-family: 'Archivo', sans-serif; font-size: .75rem;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--texte); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--fond-card)); }
    .filter-btn[data-cat="declaration"].active { border-color: var(--orange); color: var(--orange); background: color-mix(in srgb, var(--orange) 8%, var(--fond-card)); }
    .filter-btn[data-cat="ij"].active { border-color: var(--vert); color: var(--vert); background: var(--vert-bg); }
    .filter-btn[data-cat="droits"].active { border-color: #7BB3FF; color: #7BB3FF; background: color-mix(in srgb, #7BB3FF 8%, var(--fond-card)); }
    .filter-btn[data-cat="recours"].active { border-color: #D98FFF; color: #D98FFF; background: color-mix(in srgb, #D98FFF 8%, var(--fond-card)); }

    .search-wrap { position: relative; margin-bottom: 1.25rem; }
    .search-wrap svg { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--texte-muted); }
    #search { width: 100%; background: var(--fond-card); border: 1px solid var(--border); color: var(--texte); font-family: 'Archivo', sans-serif; font-size: .9rem; padding: .7rem 1rem .7rem 2.5rem; outline: none; transition: border-color .15s; }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--texte-muted); }

    .faq-list { display: flex; flex-direction: column; gap: .5rem; }
    .faq-item { border: 1px solid var(--border); overflow: hidden; }
    .faq-item[data-cat="declaration"] { border-left: 3px solid var(--orange); }
    .faq-item[data-cat="ij"] { border-left: 3px solid var(--vert); }
    .faq-item[data-cat="droits"] { border-left: 3px solid #7BB3FF; }
    .faq-item[data-cat="recours"] { border-left: 3px solid #D98FFF; }
    .faq-item[data-cat="employeur"] { border-left: 3px solid var(--accent); }
    .faq-item:hover { border-color: var(--accent); }

    .faq-q {
      width: 100%; background: var(--fond-card); border: none; color: var(--texte);
      font-family: 'Archivo', sans-serif; font-size: .9rem; font-weight: 600;
      padding: 1rem 3rem 1rem 1rem; text-align: left; cursor: pointer;
      display: flex; align-items: flex-start; gap: .75rem; line-height: 1.4;
      position: relative; transition: background .15s;
    }
    .faq-q:hover { background: color-mix(in srgb, var(--accent) 6%, var(--fond-card)); }
    .faq-q.open { background: color-mix(in srgb, var(--accent) 9%, var(--fond-card)); }
    .faq-q::after {
      content: '+'; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      font-size: 1.3rem; color: var(--texte-muted); font-weight: 400; transition: transform .2s;
    }
    .faq-q.open::after { content: '−'; color: var(--accent); }
    .faq-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .faq-item[data-cat="declaration"] .faq-cat-dot { background: var(--orange); }
    .faq-item[data-cat="ij"] .faq-cat-dot { background: var(--vert); }
    .faq-item[data-cat="droits"] .faq-cat-dot { background: #7BB3FF; }
    .faq-item[data-cat="recours"] .faq-cat-dot { background: #D98FFF; }
    .faq-item[data-cat="employeur"] .faq-cat-dot { background: var(--accent); }

    .faq-a {
      display: none; padding: 1rem 1.25rem 1.25rem;
      background: var(--fond); border-top: 1px solid var(--border);
      font-size: .87rem; line-height: 1.7; color: var(--texte-muted);
    }
    .faq-a.open { display: block; }
    .faq-a strong { color: var(--texte); }
    .faq-a .highlight { background: color-mix(in srgb, var(--accent) 7%, var(--fond-card)); border-left: 3px solid var(--accent); padding: .6rem .85rem; margin: .75rem 0; font-size: .84rem; }
    .faq-a .highlight.vert { background: var(--vert-bg); border-color: var(--vert); }
    .faq-a .ref { font-size: .75rem; color: var(--texte-muted); margin-top: .75rem; }

    .no-result { text-align: center; padding: 3rem 1rem; color: var(--texte-muted); display: none; }
    .no-result.show { display: block; }

    .cat-label {
      font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      padding: .15rem .5rem; border-radius: 2px; display: inline-block;
    }
    .cat-declaration { background: color-mix(in srgb, var(--orange) 10%, var(--fond-card)); color: var(--orange); }
    .cat-ij { background: var(--vert-bg); color: var(--vert); }
    .cat-droits { background: color-mix(in srgb, #7BB3FF 10%, var(--fond-card)); color: #7BB3FF; }
    .cat-recours { background: color-mix(in srgb, #D98FFF 10%, var(--fond-card)); color: #D98FFF; }
    .cat-employeur { background: color-mix(in srgb, var(--accent) 10%, var(--fond-card)); color: var(--accent); }

    .count-label { font-size: .75rem; color: var(--texte-muted); margin-bottom: 1rem; }

    @media (max-width: 480px) {
      .topbar { padding: .75rem 1rem; gap: .6rem; }
      .topbar-title { font-size: .82rem; }
      .hero { padding: 1.25rem 1rem 1rem; }
      .content { padding: 1rem .75rem 0; }
      .filters { gap: .35rem; }
      .filter-btn { padding: .35rem .65rem; font-size: .7rem; }
      .faq-q { font-size: .84rem; padding: .85rem 2.75rem .85rem .85rem; }
      .faq-a { padding: .85rem 1rem 1rem; font-size: .84rem; }
    }
  </style>

<script>
const FAQ = [
  {
    cat: "declaration",
    q: "Mon employeur refuse de déclarer mon accident. Que faire ?",
    a: `L'employeur a <strong>48 heures</strong> pour envoyer la déclaration d'accident du travail (DAT) à la CPAM (source ameli.fr). Le salarié doit, lui, informer l'employeur dans les <strong>24 heures</strong>. S'il refuse ou tarde, vous pouvez <strong>déclarer vous-même</strong> votre AT dans un délai de <strong>2 ans</strong> suivant l'accident (L.441-2 CSS).
    <div class="highlight">Envoyer un courrier en LRAR à la CPAM avec : date, lieu, circonstances de l'accident, nature des lésions, témoins éventuels. Joindre le certificat médical initial.</div>
    Le refus de l'employeur de déclarer peut constituer une faute pouvant engager sa responsabilité. Contactez votre délégué CGT.
    <p class="ref">Réf. L.441-2 CSS — Art. R.441-2 CSS</p>
    <div class="cgt-militant" style="background:#1a0005;border-left:4px solid #E2001A;padding:.75rem 1rem;margin-top:.75rem;font-size:.84rem;line-height:1.6">
      <strong style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#E2001A;display:block;margin-bottom:.3rem">⚡ Point syndical CGT</strong>
      L'employeur EST OBLIGÉ de déclarer dans les 48h — c'est une obligation légale, pas une option. Sanction en cas de refus : le salarié peut déclarer lui-même + engager la responsabilité civile de l'employeur pour dommages-intérêts. Parallèlement, le CSE doit être saisi immédiatement et l'inspection du travail alertée par écrit. <strong>Recours CGT :</strong> UD → CPAM (LRAR) → inspection du travail (signalement en ligne). La sous-déclaration AT/MP coûte 1,3 Md€/an au régime général (rapport Diricq 2022) — l'employeur en bénéficie directement.
    </div>`
  },
  {
    cat: "declaration",
    q: "Est-ce qu'un accident de trajet est considéré comme un AT ?",
    a: `Oui. L'accident de trajet bénéficie du <strong>régime AT/MP</strong> s'il survient sur le trajet direct entre le domicile et le lieu de travail, ou entre le lieu de travail et le lieu de restauration habituel.
    <div class="highlight">Le trajet peut comporter des détours justifiés (déposer un enfant à l'école, achats courants). Il suffit que le détour soit raisonnable et ne résulte pas d'un intérêt purement personnel non lié aux nécessités essentielles.</div>
    Même régime : soins 100 %, IJ majorées, protection du contrat. <strong>Nuance :</strong> la rente d'IPP suit les mêmes règles mais la faute inexcusable de l'employeur ne s'applique pas aux accidents de trajet.
    <p class="ref">Réf. L.411-2 CSS</p>`
  },
  {
    cat: "declaration",
    q: "Peut-on déclarer un AT longtemps après les faits ?",
    a: `Oui, sous certaines conditions. La victime dispose d'un délai de <strong>2 ans</strong> à compter de la date de l'accident pour déclarer elle-même un AT si l'employeur ne l'a pas fait (L.441-2 CSS).
    <div class="highlight vert">En pratique : réunir un maximum de preuves (témoins, documents internes, échanges écrits, photos) et envoyer la déclaration en LRAR à la CPAM avec le certificat médical initial.</div>
    Au-delà de 2 ans, la prescription est en principe acquise — sauf si la victime n'avait pas connaissance des lésions (cas rares, type maladie à développement lent).
    <p class="ref">Réf. L.441-2, L.431-2 CSS</p>`
  },
  {
    cat: "ij",
    q: "Comment sont calculées mes indemnités journalières AT/MP ?",
    a: `La base de calcul est le <strong>Salaire Journalier de Base (SDJB)</strong> = salaire brut du mois précédant l'arrêt ÷ 30,42.
    <br><br>
    <strong>Taux appliqués :</strong><br>
    • J1 à J28 : <strong>60 %</strong> du SDJB (plafond 2026 : 240,49 €/j)<br>
    • À partir du J29 : <strong>80 %</strong> du SDJB (plafond 2026 : 320,66 €/j)<br>
    • <strong>Pas de délai de carence</strong> (contrairement à la maladie ordinaire : 3 jours)
    <div class="highlight vert">Exemple : salarié à 2 400 €/mois. SDJB = 2 400 ÷ 30,42 = 78,90 €. IJ J1-J28 = 47,34 €/j. IJ J29+ = 63,12 €/j.</div>
    <p class="ref">Réf. L.433-2, L.433-3 CSS — PMSS 2026 = 4 005 €/mois</p>`
  },
  {
    cat: "ij",
    q: "Quelle est la différence entre IJ AT/MP et IJ maladie ordinaire ?",
    a: `La différence est significative — c'est l'un des arguments centraux pour la reconnaissance AT/MP :
    <br><br>
    <strong>IJ maladie ordinaire :</strong><br>
    • 3 jours de carence<br>
    • 50 % du SDJB (moy. 3 derniers mois ÷ 91,25)<br>
    • Plafond 2026 : 42,97 €/j (1,4 × SMIC juillet 2026)<br><br>
    <strong>IJ AT/MP :</strong><br>
    • Pas de carence<br>
    • 60 % puis 80 % du SDJB<br>
    • Plafond 2026 : 320,66 €/j
    <div class="highlight">Sur un mois à 2 000 €, la différence entre IJ maladie et IJ AT/MP peut dépasser 300 à 400 €. Sur 6 mois d'arrêt : 1 800 à 2 400 € de plus grâce à la qualification AT.</div>
    <p class="ref">Réf. L.433-1, L.433-2, L.321-1 CSS</p>`
  },
  {
    cat: "ij",
    q: "Mon employeur doit-il maintenir mon salaire pendant l’arrêt AT ?",
    a: `La loi impose le maintien du salaire par l'employeur <strong>le jour de l'accident</strong> uniquement. Le reste de l'arrêt, c'est la CPAM qui verse les IJ.
    <div class="highlight">Cependant, de nombreuses <strong>conventions collectives</strong> imposent un maintien partiel du salaire : souvent 90 % du salaire brut pendant 30 à 90 jours, puis 66 % jusqu'à 180 jours. L'employeur complète les IJ CPAM jusqu'au niveau garanti.</div>
    À vérifier : votre convention collective de branche et votre accord d'entreprise. La CGT peut vous aider à identifier vos droits réels.
    <p class="ref">Réf. L.1226-1 CT — CCN applicable à la branche</p>
    <div class="cgt-militant" style="background:#1a0005;border-left:4px solid #E2001A;padding:.75rem 1rem;margin-top:.75rem;font-size:.84rem;line-height:1.6">
      <strong style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#E2001A;display:block;margin-bottom:.3rem">⚡ Point syndical CGT</strong>
      L'employeur EST OBLIGÉ de respecter le maintien de salaire prévu par la CCN — c'est un droit supérieur au légal. Sanction en cas de non-respect : remboursement des sommes dues + dommages-intérêts. Le délégué CGT doit vérifier la fiche de paie de chaque collègue en arrêt AT/MP pour s'assurer que le maintien CCN est bien appliqué. <strong>Lien collectif :</strong> Négocier un accord d'entreprise améliorant le maintien de salaire en AT/MP (objectif : 100 % du net maintenu) — c'est l'une des revendications CGT les plus concrètes et les plus populaires auprès des salariés.
    </div>`
  },
  {
    cat: "ij",
    q: "Puis-je travailler pour un autre employeur pendant mon arrêt AT ?",
    a: `Non. Un arrêt de travail interdit toute activité salariée pendant la durée de l'arrêt, y compris pour un autre employeur. La CPAM peut contrôler le respect de l'arrêt et suspendre les IJ en cas d'activité non autorisée.
    <div class="highlight">Exception : activités expressément autorisées par le médecin prescripteur (type mi-temps thérapeutique), dans le cadre d'un accord CPAM.</div>
    <p class="ref">Réf. L.433-1 CSS</p>`
  },
  {
    cat: "droits",
    q: "Mon employeur peut-il me licencier pendant mon arrêt AT ?",
    a: `Non. La loi interdit à l'employeur de rompre le contrat de travail d'un salarié victime d'un AT pendant la durée de l'arrêt, <strong>sauf :</strong>
    <br><br>
    • <strong>Faute grave</strong> du salarié, étrangère à l'accident<br>
    • <strong>Impossibilité de maintenir le contrat</strong> pour motif étranger à l'accident ou à la maladie
    <div class="highlight">Tout licenciement prononcé en dehors de ces deux exceptions est <strong>nul de plein droit</strong>. Le salarié peut demander sa réintégration ou des indemnités majorées.</div>
    Si l'employeur tente de licencier, contacter immédiatement la CGT et l'inspection du travail.
    <p class="ref">Réf. L.1226-9, L.1226-13 CT</p>`
  },
  {
    cat: "droits",
    q: "Qu’est-ce que la faute inexcusable de l’employeur ?",
    a: `La <strong>faute inexcusable de l'employeur (FIE)</strong> est reconnue lorsque l'employeur avait ou aurait dû avoir conscience du danger et n'a pas pris les mesures nécessaires pour le prévenir.
    <div class="highlight">Depuis l'arrêt Amiante (2002), il existe une <strong>présomption de FIE</strong> quand le salarié avait alerté sur le risque. La victime doit alors seulement prouver qu'elle avait alerté, l'employeur devant prouver qu'il a tout mis en œuvre.</div>
    Conséquences : <strong>majoration de la rente</strong> jusqu'au taux maximum, indemnisation complémentaire de toutes les préjudices (souffrances, préjudice esthétique, d'agrément…). Délai pour agir : <strong>2 ans</strong> à compter de la consolidation.
    <p class="ref">Réf. L.452-1 à L.452-4 CSS — Cass. Soc. 28 fév. 2002 (arrêts Amiante)</p>
    <div class="cgt-militant" style="background:#1a0005;border-left:4px solid #E2001A;padding:.75rem 1rem;margin-top:.75rem;font-size:.84rem;line-height:1.6">
      <strong style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#E2001A;display:block;margin-bottom:.3rem">⚡ Point syndical CGT</strong>
      La FIE est l'outil le plus puissant du militant : elle peut doubler ou tripler l'indemnisation. Tout accident grave mérite d'examiner si l'employeur avait conscience du danger. <strong>Preuves clés :</strong> PV de CSE signalant le risque, courriers d'alerte sans réponse, absence du risque dans le DUERP. Ne jamais attendre — la prescription est de 2 ans à compter de la consolidation. <strong>Recours CGT :</strong> LRAR à la CPAM (tentative amiable) → Pôle social du Tribunal judiciaire. La CPAM avance les sommes puis les récupère sur l'employeur. Contacter l'UD CGT immédiatement.
    </div>`
  },
  {
    cat: "droits",
    q: "Qu’est-ce que la consolidation et qu’est-ce que ça change ?",
    a: `La <strong>consolidation</strong> est la date à laquelle l'état de la victime se stabilise : les lésions ne peuvent plus évoluer de façon significative, avec ou sans séquelles permanentes. Elle est fixée par le médecin-conseil de la CPAM.
    <div class="highlight">À la consolidation :<br>• Les IJ AT/MP s'arrêtent<br>• Le médecin-conseil fixe un <strong>taux d'IPP</strong> (Incapacité Permanente Partielle)<br>• Si IPP &lt; 10 % : versement d'un <strong>capital unique forfaitaire</strong> (ex. : 4 833,18 € à 9 % — montants 2026)<br>• Si IPP ≥ 10 % : <strong>rente viagère</strong> trimestrielle (ou mensuelle si taux ≥ 50 %)<br>• Salaire minimum de calcul des rentes : <strong>21 498,47 €</strong> depuis le 1er avril 2026</div>
    <p><strong>Retraite anticipée :</strong> IPP ≥ 20 % → départ possible dès <strong>60 ans</strong> ; IPP 10–19 % → départ <strong>2 ans avant l'âge légal</strong> sous conditions (AT : 17 ans d'exposition aux risques professionnels ; MP : 68 trimestres validés + 17 ans d'exposition + lien démontré entre exposition et IPP).</p>
    <p><strong>Attestations de rente :</strong> disponibles sur le compte ameli pendant <strong>6 mois seulement</strong> — les télécharger et sauvegarder régulièrement.</p>
    La date de consolidation peut être contestée dans les <strong>2 mois</strong> si elle vous paraît prématurée. La CGT peut vous orienter vers un médecin conseil.
    <p class="ref">Réf. L.434-1, L.434-2 CSS — ameli.fr (07/04/2026)</p>`
  },
  {
    cat: "droits",
    q: "Qu’est-ce qu’une rechute AT/MP et comment la déclarer ?",
    a: `Une <strong>rechute</strong> est une aggravation de l'état de santé postérieure à la guérison ou à la consolidation, qui résulte directement de l'accident ou de la maladie professionnelle initiale.
    <div class="highlight vert">La rechute rouvre tous les droits AT/MP : soins à 100 %, IJ au taux majoré (60→80 %), protection du contrat.</div>
    Démarche : faire établir un <strong>certificat médical de rechute</strong> par son médecin, l'envoyer à la CPAM (même procédure que la déclaration initiale). La CPAM peut instruire et éventuellement refuser — délai de contestation identique.
    <p class="ref">Réf. L.443-1, L.443-2 CSS</p>`
  },
  {
    cat: "employeur",
    q: "L’employeur peut-il contester la reconnaissance de mon AT par la CPAM ?",
    a: `Oui. L'employeur peut émettre des réserves motivées <strong>au moment de remplir la DAT ou dans les 10 jours suivants</strong> (source ameli.fr).
    <div class="highlight">Ces réserves doivent porter sur : la matérialité des faits, la cause médicale des lésions, ou le caractère professionnel de l'accident. Des réserves générales sans motivation ne suffisent pas.</div>
    Si l'employeur émet des réserves, la CPAM ouvre une enquête (70 jours max) puis une phase contradictoire (10 jours consultation + 10 jours observations). La CPAM statue au plus tard dans les <strong>3 mois</strong>. Vous recevrez un questionnaire en ligne — <strong>20 jours</strong> pour y répondre. Préparez vos éléments (témoins, documents, photos).
    <p class="ref">Réf. R.441-7 à R.441-14 CSS</p>`
  },
  {
    cat: "employeur",
    q: "L’employeur est-il obligé d’organiser une visite de reprise ?",
    a: `Oui. Après tout arrêt consécutif à un AT ou une MP, quelle que soit la durée, l'employeur <strong>doit</strong> organiser une visite de reprise auprès du médecin du travail dans les <strong>8 jours</strong> suivant la reprise du travail.
    <div class="highlight">Cette visite est obligatoire avant toute reprise effective du poste. Le médecin du travail peut prononcer une aptitude, une aptitude avec réserves, ou une inaptitude. En cas d'inaptitude, des obligations spécifiques pèsent sur l'employeur (reclassement).</div>
    Si l'employeur ne l'organise pas, il engage sa responsabilité. Vous pouvez vous-même contacter le service de santé au travail.
    <p class="ref">Réf. R.4624-31, R.4624-32 CT</p>`
  },
  {
    cat: "employeur",
    q: "Que se passe-t-il si je suis déclaré inapte après un AT ?",
    a: `L'inaptitude constatée par le médecin du travail après un AT déclenche une procédure spécifique :
    <br><br>
    1. L'employeur doit rechercher un poste de <strong>reclassement</strong> adapté aux préconisations du médecin du travail<br>
    2. Si reclassement impossible : licenciement pour inaptitude d'origine professionnelle<br>
    <div class="highlight">En cas de licenciement pour inaptitude d'origine professionnelle, le salarié a droit à une <strong>indemnité spéciale de licenciement = 2× l'indemnité légale</strong>, ainsi qu'une indemnité compensatrice de préavis.</div>
    La CGT peut vous accompagner pour vérifier que la procédure est respectée et que vous touchez toutes vos indemnités.
    <p class="ref">Réf. L.1226-10, L.1226-14 CT</p>`
  },
  {
    cat: "recours",
    q: "La CPAM a refusé mon AT. Quels recours ai-je ?",
    a: `En cas de refus de prise en charge par la CPAM, deux étapes de recours sont prévues :
    <br><br>
    <strong>1. Commission de Recours Amiable (CRA)</strong><br>
    Délai : <strong>2 mois</strong> à compter de la notification du refus. Courrier LRAR à la CPAM. Gratuit. La CRA se prononce dans les 2 mois ; silence vaut rejet.
    <div class="highlight">Joindre au recours : tous les éléments de preuve (certificat médical, témoignages, photos, témoins, registre d'accidents bénins). La CGT peut vous aider à rédiger ce recours.</div>
    <strong>Délais d'instruction à connaître :</strong><br>
    • Sans réserves employeur : <strong>30 jours</strong> → silence = acceptation<br>
    • Avec réserves ou enquête : <strong>3 mois</strong> (70 jours d'investigation max + phase contradictoire de 10+10 jours)<br><br>
    <strong>2. Pôle Social du Tribunal Judiciaire</strong><br>
    Après rejet de la CRA, délai de <strong>2 mois</strong> pour saisir le tribunal. Procédure gratuite, représentation par avocat non obligatoire.
    <p class="ref">Réf. L.142-1, R.142-1 CSS — R.441-7 à R.441-14 CSS</p>
    <div class="cgt-militant" style="background:#1a0005;border-left:4px solid #E2001A;padding:.75rem 1rem;margin-top:.75rem;font-size:.84rem;line-height:1.6">
      <strong style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#E2001A;display:block;margin-bottom:.3rem">⚡ Point syndical CGT</strong>
      Un refus de la CPAM n'est pas une fin — c'est le début de la procédure. <strong>Ne jamais abandonner sans avoir au moins tenté la CRA.</strong> La sous-déclaration et les refus abusifs coûtent 1,3 Md€/an aux assurés (rapport Diricq 2022) — contester est un acte politique autant qu'individuel. La CGT aide à rédiger le recours CRA et à constituer le dossier de preuves. Si la CRA échoue, le Pôle social du TJ peut ordonner une expertise médicale indépendante. Contacter l'UD pour accompagnement gratuit.
    </div>`
  },
  {
    cat: "recours",
    q: "Puis-je contester le taux d’IPP fixé par la CPAM ?",
    a: `Oui. Le taux d’IPP peut être contesté dans un délai de <strong>2 mois</strong> à compter de la notification par lettre recommandée.
    <div class="highlight">• <strong>AT :</strong> recours auprès de la Commission Médicale de Recours Amiable (CMRA), puis Pôle Social du Tribunal Judiciaire.<br>• <strong>MP :</strong> recours directement devant le Tribunal du contentieux de l’incapacité (TCI), puis Cour nationale de l’incapacité (CNITAAT).<br>Une expertise médicale peut être ordonnée par le tribunal. La CPAM doit justifier son taux, qui peut être révisé à la hausse ou à la baisse.</div>
    Conseils : se faire accompagner par un médecin conseil (non lié à la CPAM) pour évaluer indépendamment le taux, et contacter la CGT ou l’UD pour un accompagnement juridique.
    <p class="ref">Réf. L.143-1 CSS — barèmes indicatifs d’invalidité AT et MP</p>
    <div class="cgt-militant" style="background:#1a0005;border-left:4px solid #E2001A;padding:.75rem 1rem;margin-top:.75rem;font-size:.84rem;line-height:1.6">
      <strong style="font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#E2001A;display:block;margin-bottom:.3rem">⚡ Point syndical CGT</strong>
      La CGT recommande de demander systématiquement une expertise contradictoire pour tout taux d’IPP ≥ 10 %. L’enjeu est considérable : sur un salaire de 30 000 €/an, passer de 15 % à 20 % d’IPP représente environ 750 €/an de rente supplémentaire, soit 15 000 € sur 20 ans. <strong>Recours obligatoire en LRAR dans les 2 mois :</strong> CMRA (AT) ou TCI (MP). Le délai est d’ordre public — ne jamais le laisser passer. Contacter l’UD pour identifier un médecin-expert partenaire.
    </div>`
  },
  {
    cat: "droits",
    q: "Quels sont les montants de l’indemnité en capital et de la rente d’IPP ?",
    a: `<strong>IPP &lt; 10 % — indemnité en capital forfaitaire</strong> (versée en une seule fois, exonérée CSG/CRDS et impôt) :
    <div class="highlight"><table style="width:100%;border-collapse:collapse;font-size:0.9em"><thead><tr style="background:#e8f5e9"><th style="padding:4px 8px;text-align:left">Taux IPP</th><th style="padding:4px 8px;text-align:right">Montant (depuis le 1er avril 2026)</th></tr></thead><tbody>
    <tr><td style="padding:3px 8px">1 %</td><td style="padding:3px 8px;text-align:right">483,38 €</td></tr>
    <tr style="background:#f9f9f9"><td style="padding:3px 8px">2 %</td><td style="padding:3px 8px;text-align:right">785,71 €</td></tr>
    <tr><td style="padding:3px 8px">3 %</td><td style="padding:3px 8px;text-align:right">1 148,17 €</td></tr>
    <tr style="background:#f9f9f9"><td style="padding:3px 8px">4 %</td><td style="padding:3px 8px;text-align:right">1 812,24 €</td></tr>
    <tr><td style="padding:3px 8px">5 %</td><td style="padding:3px 8px;text-align:right">2 295,79 €</td></tr>
    <tr style="background:#f9f9f9"><td style="padding:3px 8px">6 %</td><td style="padding:3px 8px;text-align:right">2 839,52 €</td></tr>
    <tr><td style="padding:3px 8px">7 %</td><td style="padding:3px 8px;text-align:right">3 443,41 €</td></tr>
    <tr style="background:#f9f9f9"><td style="padding:3px 8px">8 %</td><td style="padding:3px 8px;text-align:right">4 108,24 €</td></tr>
    <tr><td style="padding:3px 8px">9 %</td><td style="padding:3px 8px;text-align:right">4 833,18 €</td></tr>
    </tbody></table></div>
    <strong>IPP ≥ 10 % — rente viagère</strong> : Rente = salaire annuel × taux utile.<br>
    <em>Taux utile</em> : fraction ≤ 50 % divisée par 2 ; fraction > 50 % multipliée par 1,5.<br>
    Plancher de calcul : <strong>salaire minimum des rentes = 21 498,47 €</strong> depuis le 1er avril 2026.<br>
    La rente est exonérée de CSG/CRDS et d’impôt sur le revenu. Versée chaque trimestre (taux 10–49 %) ou chaque mois (taux ≥ 50 %).
    <p class="ref">Réf. L.434-1, L.434-2 CSS — ameli.fr (07/04/2026)</p>`
  },
  {
    cat: "recours",
    q: "Qu’est-ce que le FIVA et quand y recourir ?",
    a: `Le <strong>Fonds d'Indemnisation des Victimes de l'Amiante (FIVA)</strong> offre une indemnisation complémentaire à la rente CPAM pour les victimes de maladies liées à l'amiante (mésothéliome, asbestose, plaques pleurales…).
    <div class="highlight vert">Le FIVA indemnise tous les préjudices : souffrances physiques et morales, préjudice esthétique, préjudice d'agrément, préjudice professionnel, préjudice des proches. L'indemnisation est indépendante de la rente AT/MP et cumulative.</div>
    La demande se fait directement auprès du FIVA (fiva.fr). La CGT accompagne de nombreuses victimes dans ces démarches — ne pas hésiter à contacter l'UD.
    <p class="ref">Réf. L.53 LFSS 2001 — Décret 2001-963 du 23 oct. 2001</p>`
  }
];

const list = document.getElementById('faq-list');
const noResult = document.getElementById('no-result');
const countLabel = document.getElementById('count-label');
let activeFilter = 'all';
let searchVal = '';

function render() {
  const filtered = FAQ.filter(f => {
    const matchCat = activeFilter === 'all' || f.cat === activeFilter;
    const matchSearch = !searchVal || f.q.toLowerCase().includes(searchVal) || f.a.toLowerCase().includes(searchVal);
    return matchCat && matchSearch;
  });

  list.innerHTML = filtered.map((f, i) => `
    <div class="faq-item" data-cat="${f.cat}">
      <button class="faq-q" onclick="toggleFaq(this)">
        <span class="faq-cat-dot"></span>
        ${f.q}
      </button>
      <div class="faq-a">${f.a}</div>
    </div>
  `).join('');

  noResult.classList.toggle('show', filtered.length === 0);
  countLabel.textContent = filtered.length + ' question' + (filtered.length > 1 ? 's' : '');
}

function toggleFaq(btn) {
  const a = btn.nextElementSibling;
  const isOpen = btn.classList.contains('open');
  // Fermer tous
  document.querySelectorAll('.faq-q.open').forEach(b => { b.classList.remove('open'); b.nextElementSibling.classList.remove('open'); });
  if (!isOpen) { btn.classList.add('open'); a.classList.add('open'); }
}
window.toggleFaq = toggleFaq;

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.cat;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value.toLowerCase().trim();
  render();
});

render();
</script>
